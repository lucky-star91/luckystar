// ★ 환경설정 (상호 · 견적서 공통내용) — app_settings 테이블의 key='estimate' 한 줄에 JSON으로 저장
const SETTINGS_DEFAULT={company:'LUCKYSTAR CARAVAN',companyInfo:'럭키스타 캠핑카라반 | 경기도 파주시 광탄면',validDays:30,notes:'',holdDays:30,
    // 방문 예약 추천 (카카오 JavaScript 키는 등록한 도메인에서만 동작하는 공개용 키)
    kakaoKey:'7542fd0954e761a43a882196d3b2da3b',visitMin:60,installMin:240,bufferMin:30,workStart:'09:00',workEnd:'20:00',planDays:14,nearKm:15,
    delayDays:3, // 방문 후 본견적 지연 판정 일수
    bankAccount:'',depositRate:30,asTerms:'', // 견적서 결제 조건 기본값 (견적서마다 수정 가능)
    marginWarn:30}; // 마진율이 이보다 낮으면 빨간색 표시
const SQL_SETTINGS="CREATE TABLE IF NOT EXISTS app_settings (\n  key TEXT PRIMARY KEY,\n  value TEXT,\n  updated_at TIMESTAMPTZ DEFAULT NOW()\n);\nALTER TABLE app_settings ENABLE ROW LEVEL SECURITY;\nDROP POLICY IF EXISTS staff_all ON app_settings;\nCREATE POLICY staff_all ON app_settings FOR ALL TO authenticated USING (public.is_staff()) WITH CHECK (public.is_staff());";
let _settingsCache=null; // 마지막으로 불러온 환경설정 (sb 없이 쓰는 곳용: 티맵 길안내)
const loadSettings=async sb=>{
    try{
        const{data,error}=await sb.from('app_settings').select('value').eq('key','estimate').maybeSingle();
        if(error)return{...SETTINGS_DEFAULT,_error:error.message};
        return(_settingsCache={...SETTINGS_DEFAULT,...parseJSON(data&&data.value,{})});
    }catch(e){return{...SETTINGS_DEFAULT,_error:String(e)};}
};
const escHtml=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ★ 방문 예약 추천: 카카오 지도로 주소 → 좌표, 직선거리로 같은 날 동선 묶기 */
let _kakaoP=null;
const loadKakao=key=>{
    if(window.kakao&&window.kakao.maps&&window.kakao.maps.services)return Promise.resolve(window.kakao);
    if(_kakaoP)return _kakaoP;
    _kakaoP=new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
        s.onload=()=>{try{window.kakao.maps.load(()=>res(window.kakao));}catch(e){_kakaoP=null;rej(new Error('카카오 지도를 불러오지 못했습니다 (도메인 등록·카카오맵 사용 설정 확인)'));}};
        s.onerror=()=>{_kakaoP=null;s.remove();rej(new Error('카카오 지도를 불러오지 못했습니다 (도메인 등록·카카오맵 사용 설정 확인)'));};
        document.head.appendChild(s);
    });
    return _kakaoP;
};
const _geoMem={};
const geocode=async(key,addr)=>{
    addr=(addr||'').trim();if(!addr)return null;
    if(_geoMem[addr]!==undefined)return _geoMem[addr];
    try{const c=JSON.parse(localStorage.getItem('geo:'+addr)||'null');if(c){_geoMem[addr]=c;return c;}}catch(e){}
    const kakao=await loadKakao(key);const S=kakao.maps.services;
    const byAddr=q=>new Promise(r=>new S.Geocoder().addressSearch(q,(d,st)=>r(st===S.Status.OK&&d[0]?{lat:+d[0].y,lng:+d[0].x}:null)));
    const byKeyword=q=>new Promise(r=>new S.Places().keywordSearch(q,(d,st)=>r(st===S.Status.OK&&d[0]?{lat:+d[0].y,lng:+d[0].x}:null)));
    const short=addr.replace(/\(.*?\)/g,' ').replace(/\s\d+동\s*\d+호.*$|\s\d+호.*$/,'').trim(); // 동·호수 빼고 재시도
    const r=await byAddr(addr)||(short!==addr&&await byAddr(short))||await byKeyword(short)||null;
    _geoMem[addr]=r;
    if(r)try{localStorage.setItem('geo:'+addr,JSON.stringify(r));}catch(e){}
    return r;
};
// ★ 티맵 길안내: 휴대폰의 티맵 앱을 직접 실행 (티맵은 웹 길안내 주소가 없음)
//   좌표를 찾으면 바로 목적지 길안내, 못 찾으면 티맵에서 주소 검색
const openTmap=async address=>{
    address=(address||'').trim();if(!address)return;
    if(!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){alert('티맵 길안내는 휴대폰에서만 실행됩니다.\nPC에서는 카카오 길안내를 이용하세요.');return;}
    let c=null;try{c=await geocode((_settingsCache||SETTINGS_DEFAULT).kakaoKey,address);}catch(e){} // 환경설정의 카카오 키 사용
    const n=encodeURIComponent(address);
    // 현재 티맵 앱은 goalname/goalx/goaly(목적지 이름·경도·위도)를 읽음 · 예전 버전용 rGo* 도 함께 전달
    window.location.href=c?`tmap://route?goalname=${n}&goalx=${c.lng}&goaly=${c.lat}&rGoName=${n}&rGoX=${c.lng}&rGoY=${c.lat}`:`tmap://search?name=${n}`;
    // 앱이 없으면 화면이 그대로 남아 있음 → 설치 안내
    setTimeout(()=>{if(!document.hidden&&confirm('티맵 앱이 열리지 않았습니다. 티맵 설치 페이지로 이동할까요?'))
        window.location.href=/Android/i.test(navigator.userAgent)?'https://play.google.com/store/apps/details?id=com.skt.tmap.ku':'https://apps.apple.com/kr/app/id431589174';},2000);
};
const distKm=(a,b)=>{const R=6371,t=x=>x*Math.PI/180;const dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
// 이동 시간 추정: 직선거리 × 1.3(도로) ÷ 평균 40km/h, 최소 여유 시간 이상 · 10분 단위
const travelMin=(km,minBuf)=>Math.max(Number(minBuf)||0,Math.ceil(km*1.3/40*60/10)*10);
const hm2min=s=>{const[h,m]=String(s||'0:0').split(':').map(Number);return(h||0)*60+(m||0);};
const min2hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const WEEK=['일','월','화','수','목','금','토'];

// t분에 시작하는 방문이 그날 일정들과 (이동 시간 포함) 겹치지 않는지
const slotOk=(t,evs,st)=>{const visit=Number(st.visitMin)||60;return evs.every(e=>{const s=e.start.getHours()*60+e.start.getMinutes(),en=s+e.dur,tr=travelMin(e.dist,st.bufferMin);return t+visit+tr<=s||t>=en+tr;});};
// 추천 계산: events [{start:Date,dur,kind,name,dist}] → 날짜별 {date,events,nearest,kind:'near'|'none'|'far',slots:[분]}
// start부터 count일 (지난 날짜는 제외, 오늘은 지금 이후 시간만)
const planVisitDays=(events,st,now=new Date(),start=null,count=null)=>{
    const visit=Number(st.visitMin)||60,ws=hm2min(st.workStart),we=hm2min(st.workEnd);
    const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const s0=start||today;
    const days=[];
    for(let i=0;i<(count||Number(st.planDays)||14);i++){
        const d=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+i);
        if(d<today)continue;
        const evs=events.filter(e=>ymd(e.start)===ymd(d)).sort((a,b)=>a.start-b.start);
        const earliest=ymd(d)===ymd(today)?Math.ceil((now.getHours()*60+now.getMinutes()+30)/30)*30:ws;
        const slots=[];
        for(let t=Math.max(ws,earliest);t+visit<=we;t+=30)if(slotOk(t,evs,st))slots.push(t);
        const nearest=evs.length?Math.min(...evs.map(e=>e.dist)):Infinity;
        days.push({date:d,events:evs,nearest,slots,kind:!evs.length?'none':nearest<=(Number(st.nearKm)||15)?'near':'far'});
    }
    return days;
};

// ★ 방문 예약 추천 패널 (견적 수정 · 진행 상태 카드 아래)
// dur: 이번 방문의 예상 소요 시간(분) — 없으면 환경설정의 방문 소요 시간
function VisitPlanner({sb,estimateId,address,value,onPick,dur}){
    const[open,setOpen]=useState(false);
    const[busy,setBusy]=useState(false);
    const[err,setErr]=useState('');
    const[data,setData]=useState(null); // {st,events}
    const[weekOff,setWeekOff]=useState(0); // 0 = 이번 주 (월~일)

    const load=async()=>{
        setBusy(true);setErr('');
        try{
            const st=await loadSettings(sb);
            if(!address)throw new Error('고객 주소를 먼저 입력하세요.');
            const target=await geocode(st.kakaoKey,address);
            if(!target)throw new Error('주소를 지도에서 찾지 못했습니다: '+address);
            let{data:ests,error:qe}=await sb.from('estimates').select('id,client_name,client_address,status_dates,status_checked,deposit_amount,balance_paid,extra_visits,meta');
            if(qe)({data:ests}=await sb.from('estimates').select('*')); // meta 칸을 아직 안 만든 경우
            const now=new Date();const until=new Date(8640000000000000); // 주 단위로 넘겨 보므로 앞으로의 일정은 모두 불러옴
            const raw=[];
            (ests||[]).forEach(e=>{
                if(e.id===estimateId)return;
                const{sd,sc,lost,deleted,meta:em}=estStageInfo(e,0);
                if(lost||deleted)return; // 실주·휴지통 견적은 제외
                // 설치·공사: 하루 설치는 설치 소요 시간만큼, 며칠 걸리는 공사는 그 기간 동안 하루 종일 일정으로 계산
                if(sd['제작시작']&&!sc['설치완료']){const days=prodDays(sd)||1,one=days===1;
                    const s0=new Date(String(sd['제작시작']).slice(0,10)+'T00:00'),ws=hm2min(st.workStart),we=hm2min(st.workEnd);
                    for(let k=0;k<days;k++){const d=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+k,Math.floor(ws/60),ws%60);
                        if(d>=new Date(now.getFullYear(),now.getMonth(),now.getDate()))raw.push({start:d,dur:one?(Number(st.installMin)||240):we-ws,kind:one?'설치':'공사',name:e.client_name||'고객',address:e.client_address||'',geo:em.geo});}
                }
                [['방문상담 및 실측','방문',Number(st.visitMin)||60]].forEach(([k,kind,dur])=>{
                    if(!sd[k]||sc[k])return;const d=new Date(sd[k]);
                    if(isNaN(d)||d<new Date(now.getFullYear(),now.getMonth(),now.getDate())||d>=until)return;
                    raw.push({start:d,dur,kind,name:e.client_name||'고객',address:e.client_address||'',geo:em.geo});
                });
                pendingExtras(e).forEach(v=>{
                    const d=new Date(v.at);
                    if(isNaN(d)||d<new Date(now.getFullYear(),now.getMonth(),now.getDate())||d>=until)return;
                    raw.push({start:d,dur:Number(v.dur)||Number(st.visitMin)||60,kind:v.type,name:e.client_name||'고객',address:e.client_address||'',geo:em.geo});
                });
            });
            const events=[];
            // 좌표: 견적에 저장된 좌표(주소가 같을 때)를 먼저 쓰고, 없으면 카카오로 변환 (No.23 속도 개선)
            for(const ev of raw){const c=(ev.geo&&ev.geo.addr===ev.address&&ev.geo.lat)?ev.geo:await geocode(st.kakaoKey,ev.address);events.push({...ev,dist:c?distKm(target,c):999,noGeo:!c});}
            setData({st,events});
        }catch(e){setErr(e.message||String(e));setData(null);}
        finally{setBusy(false);}
    };
    // 주소가 바뀌면 다시 계산해야 함
    useEffect(()=>{setData(null);},[address]);
    // 방문 예정일을 고르면(직접 입력 포함) 그날 다른 지역 예약과 겹치는지 확인
    useEffect(()=>{if(value&&address&&!data&&!busy)load();},[value,address]);

    const pick=(d,t)=>onPick(ymd(d)+'T'+min2hm(t));
    const km=n=>n>=999?'위치 미확인':n<1?Math.round(n*1000)+'m':n.toFixed(1)+'km';
    const dayLabel=d=>`${d.getMonth()+1}/${d.getDate()}(${WEEK[d.getDay()]})`;
    // 이번 방문의 소요 시간을 반영해 빈 시간 계산 (소요 시간을 바꾸면 바로 다시 계산)
    const stEff=data?(Number(dur)>0?{...data.st,visitMin:Number(dur)}:data.st):null;
    // 주 단위 (월~일)
    const now=new Date();const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)+weekOff*7);
    const sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
    const days=data?planVisitDays(data.events,stEff,now,mon,7):[];

    // 선택한 날짜 경고
    let warn=null;
    if(data&&value){
        const v=new Date(value);const day=isNaN(v)?null:planVisitDays(data.events,stEff,now,new Date(v.getFullYear(),v.getMonth(),v.getDate()),1)[0];
        if(day&&day.events.length){
            const t=v.getHours()*60+v.getMinutes();
            const clash=!isNaN(t)&&!slotOk(t,day.events,stEff);
            const far=day.events.filter(e=>e.dist>(Number(stEff.nearKm)||15));
            if(far.length||clash)warn=<div style={{marginTop:8,fontSize:12,fontWeight:700,color:'#b45309',background:'#fef3c7',border:'1.5px solid #fcd34d',borderRadius:8,padding:'6px 10px'}}>
                ⚠ {dayLabel(v)} {far.length?`멀리 떨어진 예약이 있습니다: ${far.map(e=>`${e.name} ${km(e.dist)}`).join(', ')}`:''}{far.length&&clash?' · ':''}{clash?'다른 일정과 시간이 겹치거나 이동 시간이 부족합니다':''}</div>;
        }
    }

    const DayRow=({day,tone})=>(<div style={{border:'1.5px solid '+(tone==='near'?'#86efac':tone==='far'?'#fcd34d':'var(--border)'),background:tone==='near'?'#f0fdf4':tone==='far'?'#fffbeb':'#fff',borderRadius:10,padding:'8px 12px'}}>
        <div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}>
            <b style={{fontSize:13}}>{tone==='near'?'⭐':tone==='far'?'⚠':'○'} {dayLabel(day.date)}</b>
            <span style={{fontSize:12,color:'var(--text)'}}>{day.events.length?`가장 가까운 예약 ${km(day.nearest)} · 예약 ${day.events.length}건`:'예약 없음'}</span>
        </div>
        {day.events.length>0&&<div style={{fontSize:12,color:'#334155',margin:'4px 0'}}>{day.events.map((e,i)=><span key={i} style={{marginRight:10,whiteSpace:'nowrap'}}>{min2hm(e.start.getHours()*60+e.start.getMinutes())} {e.kind} {e.name} ({km(e.dist)})</span>)}</div>}
        <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:4}}>
            {day.slots.length===0?<span style={{fontSize:12,color:'var(--muted)'}}>빈 시간 없음</span>
            :day.slots.map(t=><button key={t} className="btn btn-outline btn-xs" onClick={()=>pick(day.date,t)}>{min2hm(t)}</button>)}
        </div>
    </div>);

    return(<div style={{marginTop:10}}>
        <button className="btn btn-outline btn-sm" disabled={busy} onClick={()=>{setOpen(o=>!o);if(!data&&!busy)load();}}>{busy?'📍 계산 중...':open?'📍 방문 추천 닫기':'📍 방문 추천 날짜 찾기'}</button>
        {err&&<div style={{marginTop:8,fontSize:12,color:'var(--red)',fontWeight:700}}>⚠ {err}</div>}
        {warn}
        {open&&data&&<div style={{marginTop:10,display:'flex',flexDirection:'column',gap:8}}>
            <div style={{fontSize:12,color:'var(--muted)'}}>방문 {durText(stEff.visitMin)} · 이동 시간은 직선거리 기준 추정(최소 {stEff.bufferMin}분) · 시간을 누르면 방문 예정에 입력됩니다</div>
            <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                <button className="btn btn-outline btn-sm" disabled={weekOff<=0} onClick={()=>setWeekOff(w=>w-1)}>◀ 이전 주</button>
                <b style={{fontSize:14,minWidth:150,textAlign:'center'}}>{dayLabel(mon)} ~ {dayLabel(sun)}</b>
                <button className="btn btn-outline btn-sm" onClick={()=>setWeekOff(w=>w+1)}>다음 주 ▶</button>
                {weekOff>0&&<button className="btn btn-outline btn-sm" onClick={()=>setWeekOff(0)}>이번 주</button>}
                <span style={{fontSize:11,color:'var(--muted)',marginLeft:6}}>⭐ {stEff.nearKm}km 이내 예약 있음 · ○ 예약 없음 · ⚠ 먼 예약 있음(피하면 좋은 날)</span>
            </div>
            {days.map(d=><DayRow key={ymd(d.date)} day={d} tone={d.kind}/>)}
            {!days.length&&<div style={{fontSize:12,color:'var(--muted)'}}>표시할 날짜가 없습니다.</div>}
        </div>}
    </div>);
}

function EstimateForm({sb,prodCats,mode,estimateId,onNavigate,onTotalChange,userProfile}){
    const[cats,setCats]=useState([]);  // {id,name,order}  — new: uid(), edit: DB uuid
    const[items,setItems]=useState([]); // {id,catId,name,spec,qty,unitPrice,laborCost,total,imgUrl}

    const updMeta=(k,v)=>setMeta(m=>({...m,[k]:typeof v==='function'?v(m[k]):v}));

    const loadedRef=useRef({updatedAt:null,createdAt:null}); // 동시 수정 감지·작성일 표시용
    const[loading,setLoading]=useState(mode==='edit');
    const[saving,setSaving]=useState(false);
    const[showPick,setShowPick]=useState(false);
    const[estNo,setEstNo]=useState(''); // 새 견적은 저장할 때 날짜+순번으로 부여, 수정 모드는 DB의 est_no
    const shownNo=estNo||(mode==='new'?'저장 시 부여':(estimateId||'').substr(0,8).toUpperCase()); // 견적번호가 없는 옛 견적만 내부 코드로 표시
    // ★ 현장사진 & 결제 정보

    const[photoView,setPhotoView]=useState(null); // 크게 보는 현장사진 번호
    const[paymentStatus,setPaymentStatus]=useState('입금전');
    const[depositAmount,setDepositAmount]=useState('');
    const[midAmount,setMidAmount]=useState('');
    const[balancePaid,setBalancePaid]=useState(false);
    const[statusChecked,setStatusChecked]=useState({}); // 진행상태 완료체크
    const[portItems,setPortItems]=useState([]);   // 첨부 포트폴리오
    const[extraVisits,setExtraVisits]=useState([]); // 추가 방문 (AS · 추가 설치)
    const[estMaterials,setEstMaterials]=useState([]); // 소요 자재
    const[estPrep,setEstPrep]=useState([]); // 공구·부자재
    // ★ 수정 모드: 화면 변경은 저장 버튼을 누를 때만 DB에 반영 (불러온 시점의 ID를 기억해 두었다가 저장 시 비교)
    const origCatIds=useRef(new Set());const origItemIds=useRef(new Set());const origChecked=useRef({});
    const catsRef=useRef([]);catsRef.current=cats;
    const[statusOpen,setStatusOpen]=useState(()=>typeof window==='undefined'||window.innerWidth>=768);
    const[showPortPick,setShowPortPick]=useState(false);
    const[lostForm,setLostForm]=useState(null); // 실주 처리 입력 중 {reason, memo}

    useEffect(()=>{if(sb)loadSettings(sb).then(s=>setSt(s));},[sb]);
    // 새 견적: 결제 조건을 환경설정 기본값으로 채움 (견적서마다 수정 가능)
    useEffect(()=>{if(mode==='new')setMeta(m=>m.terms?m:{...m,terms:{bank:st.bankAccount||'',depositRate:st.depositRate,asTerms:st.asTerms||''}});},[st]);
    // 담당자 선택 목록: 사용자 관리에서 승인된 직원(+관리자)의 프로필만
    const[staff,setStaff]=useState([]);
    useEffect(()=>{if(!sb)return;(async()=>{
        const[{data:profs},{data:ok}]=await Promise.all([sb.from('user_profiles').select('*').order('name'),sb.from('approved_users').select('email')]);
        const allowed=new Set([ADMIN_EMAIL,...(ok||[]).map(a=>a.email)].map(e=>(e||'').toLowerCase()));
        setStaff((profs||[]).filter(p=>p.name&&allowed.has((p.email||'').toLowerCase())));
    })();},[sb]);
    // 새 견적: 자동 입력된 담당자의 연락처가 비어 있으면 직원 목록에서 채움
    useEffect(()=>{if(mode==='new'&&staff.length)setClient(c=>{if(!c.manager||c.managerPhone)return c;const p=staff.find(s=>s.name===c.manager);return p&&p.phone?{...c,managerPhone:p.phone}:c;});},[staff,client.manager]);
    const pickManager=name=>{const p=staff.find(s=>s.name===name);setClient(c=>({...c,manager:name,managerPhone:p?(p.phone||''):c.managerPhone}));};

        }else if(sb){
            sb.auth.getUser().then(({data:{user}})=>{
                if(user){
                    const name=user.user_metadata?.full_name||user.email?.split('@')[0]||'';
                    setClient(p=>({...p,manager:p.manager||name}));
                }
            });
        }
    },[mode,userProfile]);

    // ★ edit: DB 로드
    useEffect(()=>{
        if(mode!=='edit'||!estimateId)return;
        (async()=>{
            setLoading(true);
            const{data:est}=await sb.from('estimates').select('*').eq('id',estimateId).single();
            if(est){setClient({name:est.client_name||'',phone:est.client_phone||'',address:est.client_address||'',model:est.client_model||'',caravan:est.client_caravan||'',manager:est.client_manager||'',managerPhone:est.manager_phone||''});
                // status_dates: TEXT(JSON문자열) 또는 JSONB 모두 처리
                let sd={};try{sd=typeof est.status_dates==='string'?JSON.parse(est.status_dates||'{}'):(est.status_dates||{});}catch(e){}
                setStatusDates(normStatusObj(sd));setEstNo(est.est_no||'');
                // ★ 현장사진 & 결제 정보 로드
                let sp=[];try{sp=typeof est.site_photos==='string'?JSON.parse(est.site_photos||'[]'):(est.site_photos||[]);}catch(e){}
                setSitePhotos(sp);
                setPaymentStatus(est.payment_status||'입금전');
                setDepositAmount(est.deposit_amount||'');
                setMidAmount(est.mid_amount||'');
                setBalancePaid(!!est.balance_paid);
                let sc={};try{sc=typeof est.status_checked==='string'?JSON.parse(est.status_checked||'{}'):(est.status_checked||{});}catch(e){}
                sc=normStatusObj(sc);if(normStatusObj(sd)['본견적발송']&&!sc['방문상담 및 실측'])sc={...sc,'방문상담 및 실측':true}; // 본견적을 보냈으면 방문함 체크
                setStatusChecked(sc);
                let pi=[];try{pi=typeof est.portfolio_items==='string'?JSON.parse(est.portfolio_items||'[]'):(est.portfolio_items||[]);}catch{}
                setPortItems(pi);
                setExtraVisits(extraVisitsOf(est));
                setMeta(parseJSON(est.meta,{}));setSendHistory(parseJSON(est.send_history,[]));
                loadedRef.current={updatedAt:est.updated_at||null,createdAt:est.created_at||null};
                let em=[];try{em=typeof est.est_materials==='string'?JSON.parse(est.est_materials||'[]'):(est.est_materials||[]);}catch{}
                const _ep=parseJSON(est.est_prep,[]);origChecked.current=sc;setEstMaterials(em);setEstPrep(_ep);}
            const{data:cd}=await sb.from('est_cats').select('*').eq('estimate_id',estimateId).order('display_order');
            const mc=(cd||[]).map(c=>({id:c.id,name:c.name,order:c.display_order}));setCats(mc);origCatIds.current=new Set(mc.map(c=>c.id));
            if(mc.length>0){const{data:id_}=await sb.from('est_items').select('*').in('cat_id',mc.map(c=>c.id)).order('display_order');const _mi=(id_||[]).map(i=>({id:i.id,catId:i.cat_id,name:i.name,spec:i.specification||'',qty:i.quantity||1,unitPrice:i.unit_price||0,laborCost:i.labor_cost||0,total:i.total_amount||0,imgUrl:i.image_url||''}));setItems(_mi);origItemIds.current=new Set(_mi.map(i=>i.id));}
            setLoading(false);
        })();
    },[estimateId]);

    // ★ 결제 계산

    const totalMat=items.reduce((s,i)=>s+(parseFloat(i.qty)||0)*(parseFloat(i.unitPrice)||0),0);
    const totalLab=items.reduce((s,i)=>s+(parseFloat(i.laborCost)||0),0);
    // 시공비 (설치비·운반비·철거비): 공급가액에 포함, 0원이면 인쇄에서 제외
    const costs=meta.costs||{};const costSum=COST_KEYS.reduce((s,[k])=>s+(Number(costs[k])||0),0);
    const grand=totalMat+totalLab+costSum;const vat=Math.round(grand*.1);const grandVat=grand+vat;
    const balanceAmount=grandVat-depositNum-midNum;

    useEffect(()=>{onTotalChange&&onTotalChange(grandVat);},[items]);
    const catTotal=cid=>items.filter(i=>i.catId===cid).reduce((s,i)=>s+(parseFloat(i.total)||0),0);
    const updClient=(k,v)=>setClient(p=>({...p,[k]:v}));
    // ★ 저장하지 않은 변경 감지: 불러온 직후 상태와 지금 상태를 비교 (새 견적의 자동 담당자 입력은 제외)
    const snapshot=JSON.stringify({cats,items,client:mode==='new'?{...client,manager:'',managerPhone:''}:client,statusDates,statusChecked,

    const baseRef=useRef(null);

    useEffect(()=>{

    // ★ 이번에 올린 사진·파일 추적: 저장하지 않고 나가면 저장소에서 삭제, 저장할 때는 결국 안 쓰게 된 것만 삭제
    const pendingUp=useRef([]);

    useEffect(()=>()=>removeFiles(pendingUp.current),[]); // 저장하지 않고 화면을 떠나면 이번에 올린 파일 삭제

    // ── 카테고리 / 품목 CRUD ── (화면에만 반영, 💾 저장 버튼을 눌러야 DB에 저장됩니다)
    const addCat=()=>{setCats(p=>[...p,{id:uid(),name:'새 카테고리',order:p.length}]);};
    const updCat=(id,name)=>setCats(p=>p.map(c=>c.id===id?{...c,name}:c));
    // 삭제된 품목에 딸린 소요자재/공구·부자재 정리 (itemId 우선, 없거나 어긋난 옛 데이터는 상품명으로 보완)
    const dropRowsOfItems=(delIds,delNames)=>{
        const stale=r=>!r.itemId||!items.some(x=>x.id===r.itemId);
        const gone=r=>(r.itemId&&delIds.includes(r.itemId))||(r.itemName&&stale(r)&&delNames.includes(r.itemName));

    const addItem=catId=>{

    const updItem=(id,field,value)=>{
        const cur=items.find(i=>i.id===id);
        setItems(prev=>prev.map(item=>{

            return ni;

        // 품목 수량이 바뀌면 그 품목의 소요자재 = 상품 1개 기준 수량(baseQty) × 품목 수량 (공구·부자재는 수량과 무관)
        if(field==='qty'&&cur){

                return{...r,baseQty:base,qty:Math.round(base*nq*10)/10};

        }

        if(field==='name'&&cur){

        if(status==='본견적발송'&&datetime)setStatusChecked(p=>p['방문상담 및 실측']?p:{...p,'방문상담 및 실측':true});
    };

    const updStatusChecked=(status,checked)=>{

`CREATE POLICY IF NOT EXISTS "allow_delete" ON storage.objects\n  FOR DELETE TO authenticated USING (bucket_id='lucky-star');`
    );

    // ★ meta 의 한 항목만 DB에 바로 저장 (다른 미저장 변경은 건드리지 않음) — 고객용 링크·재고 상태 등
    const persistMetaKey=async(k,v)=>{
        const{data:cur}=await sb.from('estimates').select('meta').eq('id',estimateId).maybeSingle();
        const{error}=await prepSafe(p=>sb.from('estimates').update(p).eq('id',estimateId),{meta:JSON.stringify({...parseJSON(cur&&cur.meta,{}),[k]:v})});
        if(error){alert('저장 실패: '+error.message+'\n\n(DB에 meta 칸이 없다면 supabase/batch2_columns.sql 을 먼저 실행하세요)');return false;}
        updMeta(k,v);
        if(baseRef.current){const b=JSON.parse(baseRef.current);b.meta={...(b.meta||{}),[k]:v};baseRef.current=JSON.stringify(b);}
        return true;
    };
    // ★ 재고 차감 / 되돌리기 — 입출고 기록에 남고, 견적서에 '차감 완료' 상태로 표시 (언제든 되돌리기 가능)
    const[stockBusy,setStockBusy]=useState(false);
    const deductStock=async(mats=estMaterials)=>{
        const lines=stockLinesOf(mats);if(!lines.length){alert('재고를 차감할 자재(자재관리에 등록된 자재)가 없습니다.');return;}
        setStockBusy(true);
        try{
            for(const l of lines)await adjustStock(sb,{materialId:l.material_id,delta:-l.qty,estimateId,reason:'설치 차감',memo:(estNo||'')+' '+(client.name||'')});
            await persistMetaKey('stock',{done:true,at:new Date().toISOString(),lines});
            toast('📦 재고 차감 완료 ('+lines.length+'종)');
        }catch(e){alert('재고 차감 중 오류: '+e.message+'\n일부 자재만 차감되었을 수 있습니다. 자재관리에서 확인하세요.');}
        finally{setStockBusy(false);}
    };
    const revertStock=async()=>{
        const lines=(meta.stock&&meta.stock.lines)||[];if(!lines.length)return;
        setStockBusy(true);
        try{
            for(const l of lines)await adjustStock(sb,{materialId:l.material_id,delta:l.qty,estimateId,reason:'차감 되돌리기',memo:(estNo||'')+' '+(client.name||'')});
            await persistMetaKey('stock',{done:false,revertedAt:new Date().toISOString()});
            toast('↩ 재고 차감을 되돌렸습니다');
        }catch(e){alert('되돌리기 중 오류: '+e.message);}
        finally{setStockBusy(false);}
    };
    // 저장 후: 설치함을 새로 체크했으면 차감 여부를 묻고, 설치함을 해제했는데 차감되어 있으면 되돌릴지 물음
    const stockAfterSave=async mats=>{
        const done=!!(meta.stock&&meta.stock.done);
        if(statusChecked['설치완료']&&!origChecked.current['설치완료']&&!done&&stockLinesOf(mats).length){
            if(window.confirm('설치완료로 저장되었습니다.\n소요된 자재를 재고에서 차감하시겠습니까? ('+stockLinesOf(mats).length+'종)\n\n(나중에 견적서의 📦 재고 차감 버튼으로 해도 됩니다)'))await deductStock(mats);
        }else if(!statusChecked['설치완료']&&origChecked.current['설치완료']&&done){
            if(window.confirm('설치함 체크를 해제했습니다.\n이 견적으로 차감했던 재고를 되돌릴까요?'))await revertStock();
        }
    };
    // ★ 저장 — opts.stay: 저장 후 이 화면에 머묾(인쇄·발송 처리 때) · opts.sd / history / estNo: 저장할 값 지정
    //   반환: {id, no} (실패하면 null)
    const doSave=async(opts={})=>{
        setSaving(true);
        try{
            const now=new Date().toISOString();
            const sdBase=opts.sd||statusDates;
            // 계약금이 처음 입력되면 계약금 입금일(없으면 오늘)을 제작중 날짜로 기록
            const depDate=pay.deposit&&pay.deposit.date;
            const sdSave=depositNum>0&&!sdBase['제작중']?{...sdBase,'제작중':depDate?new Date(depDate).toISOString():now}:sdBase;
            const scSave=opts.sc||statusChecked;
            const stageSave=getStage({sd:sdSave,sc:scSave,deposit:depositNum,balancePaid});
            const hist=opts.history||sendHistory;
            // 주소 좌표를 견적에 저장해 두면 방문 추천이 매번 변환하지 않아도 됨 (주소가 바뀔 때만 다시 변환)
            let metaSave=meta;
            if(client.address&&!(meta.geo&&meta.geo.addr===client.address)){
                try{const c=await geocode((_settingsCache||SETTINGS_DEFAULT).kakaoKey,client.address);if(c)metaSave={...meta,geo:{addr:client.address,lat:c.lat,lng:c.lng}};}catch(e){}
            }
            const common={
                client_name:client.name||'',client_phone:client.phone||'',client_address:client.address||'',
                client_model:client.model||'',client_caravan:client.caravan||'',
                client_manager:client.manager||'',manager_phone:client.managerPhone||'',
                status:stageSave,status_dates:JSON.stringify(sdSave),
                total_supply:grand,total_vat:vat,total_amount:grandVat,
                site_photos:JSON.stringify(sitePhotos),
                payment_status:balancePaid?'완료':depositNum>0?'계약':'입금전',
                deposit_amount:depositNum,mid_amount:midNum,balance_amount:balanceAmount,balance_paid:balancePaid,
                status_checked:JSON.stringify(scSave),
                portfolio_items:JSON.stringify(portItems),
                extra_visits:JSON.stringify(extraVisits),
                meta:JSON.stringify(metaSave),
                send_history:JSON.stringify(hist),
            };
            if(mode==='new'){
                // ── 1. 견적 헤더 저장 (견적번호: 날짜 + 그날 순번, 동시에 같은 번호가 나면 다음 번호로 다시 시도) ──
                let no=opts.estNo||await nextEstNo(sb),ed=null;
                for(let n=0;n<3;n++){
                    const r=await prepSafe(p=>sb.from('estimates').insert([p]).select(),{...common,est_no:no,
                        est_materials:JSON.stringify(estMaterials),est_prep:JSON.stringify(estPrep)});
                    if(!r.error){ed=r.data;break;}
                    if(String(r.error.code)!=='23505')throw new Error('[estimates] '+r.error.message+(r.error.code?' ('+r.error.code+')':''));
                    no=await nextEstNo(sb);
                }
                if(!ed||!ed[0]) throw new Error('견적 데이터가 반환되지 않았습니다');
                const eid=ed[0].id;
                const cidMap={};

                // ── 2. 카테고리 저장 ──
                for(let i=0;i<cats.length;i++){
                    const{data:cd,error:e2}=await sb.from('est_cats').insert([{
                        estimate_id:eid,name:cats[i].name,display_order:i
                    }]).select();
                    if(e2) throw new Error('[est_cats] '+e2.message);
                    if(!cd||!cd[0]) throw new Error('카테고리 데이터가 반환되지 않았습니다');
                    cidMap[cats[i].id]=cd[0].id;
                }

                // ── 3. 품목 저장 (순서 포함) ──
                const saveItems=items.filter(i=>cidMap[i.catId]);
                const irows=saveItems.map((i,n)=>({
                    cat_id:cidMap[i.catId],name:i.name,specification:i.spec||'',
                    quantity:Number(i.qty)||0,unit_price:Number(i.unitPrice)||0,
                    labor_cost:Number(i.laborCost)||0,total_amount:Number(i.total)||0,
                    image_url:i.imgUrl||'',display_order:n
                }));
                if(irows.length>0){
                    const{data:idt,error:e3}=await sb.from('est_items').insert(irows).select('id,display_order');
                    if(e3) throw new Error('[est_items] '+e3.message);
                    // ── 4. 소요자재·공구의 품목 연결을 임시 ID → DB ID로 교체 (수정 저장과 동일) ──
                    const itemIdMap={};(idt||[]).forEach(r=>{const it=saveItems[r.display_order];if(it)itemIdMap[it.id]=r.id;});
                    const remap=r=>(r.itemId&&itemIdMap[r.itemId])?{...r,itemId:itemIdMap[r.itemId]}:r;
                    if(Object.keys(itemIdMap).length&&(estMaterials.some(r=>r.itemId)||estPrep.some(r=>r.itemId))){
                        const{error:e4}=await prepSafe(p=>sb.from('estimates').update(p).eq('id',eid),{est_materials:JSON.stringify(estMaterials.map(remap)),est_prep:JSON.stringify(estPrep.map(remap))});
                        if(e4) throw new Error('[estimates 자재 연결] '+e4.message);
                    }
                }
                setEstNo(no);
                markSaved();
                return{id:eid,no};
            } else {
                // ── 동시 수정 확인: 이 견적서를 연 뒤에 다른 사람이 먼저 저장했는지 ──
                const{data:curRow}=await sb.from('estimates').select('updated_at,est_materials,est_prep').eq('id',estimateId).maybeSingle();
                if(curRow&&loadedRef.current.updatedAt&&curRow.updated_at&&curRow.updated_at!==loadedRef.current.updatedAt){
                    if(!window.confirm('⚠️ 이 견적서를 연 뒤에 다른 사람이 먼저 수정·저장했습니다.\n\n[확인] 지금 내 화면 내용으로 덮어쓰기\n[취소] 저장하지 않기 (새로고침해서 최신 내용을 먼저 확인하세요)'))return null;
                }
                // 시공 체크리스트의 체크는 체크리스트 화면에서 바로 저장되므로, 최신 체크 상태를 합쳐서 덮어쓰지 않음
                const chk=rows=>{const m={};parseJSON(rows,[]).forEach(r=>{if(r&&r.id)m[r.id]=!!r.checked;});return m;};
                const cm=chk(curRow&&curRow.est_materials),cp=chk(curRow&&curRow.est_prep);
                // ── 수정 저장 ── (화면에서 변경한 카테고리·품목·자재 등을 이 시점에 한꺼번에 DB에 반영)
                const catIdMap={};
                for(let i=0;i<cats.length;i++){
                    const c=cats[i];
                    if(origCatIds.current.has(c.id)){
                        const{error:ec}=await sb.from('est_cats').update({name:c.name,display_order:i}).eq('id',c.id);
                        if(ec) throw new Error('[est_cats] '+ec.message);
                        catIdMap[c.id]=c.id;
                    }else{
                        const{data:cd,error:ec}=await sb.from('est_cats').insert([{estimate_id:estimateId,name:c.name,display_order:i}]).select();
                        if(ec||!cd||!cd[0]) throw new Error('[est_cats] '+(ec?ec.message:'데이터 없음'));
                        catIdMap[c.id]=cd[0].id;
                    }
                }
                const itemIdMap={};
                for(let i=0;i<items.length;i++){
                    const it=items[i];const cid=catIdMap[it.catId];
                    if(!cid)continue;
                    const row={cat_id:cid,name:it.name,specification:it.spec||'',quantity:Number(it.qty)||0,unit_price:Number(it.unitPrice)||0,labor_cost:Number(it.laborCost)||0,total_amount:Number(it.total)||0,image_url:it.imgUrl||'',display_order:i};
                    if(origItemIds.current.has(it.id)){
                        const{error:ei}=await sb.from('est_items').update(row).eq('id',it.id);
                        if(ei) throw new Error('[est_items] '+ei.message);
                    }else{
                        const{data:idt,error:ei}=await sb.from('est_items').insert([row]).select();
                        if(ei||!idt||!idt[0]) throw new Error('[est_items] '+(ei?ei.message:'데이터 없음'));
                        itemIdMap[it.id]=idt[0].id;
                    }
                }
                // 화면에서 삭제한 품목/카테고리 정리
                const goneItems=[...origItemIds.current].filter(id=>!items.some(x=>x.id===id));
                if(goneItems.length){const{error:ed1}=await sb.from('est_items').delete().in('id',goneItems);if(ed1)throw new Error('[est_items 삭제] '+ed1.message);}
                const goneCats=[...origCatIds.current].filter(id=>!cats.some(c=>c.id===id));
                if(goneCats.length){
                    await sb.from('est_items').delete().in('cat_id',goneCats);
                    const{error:ed2}=await sb.from('est_cats').delete().in('id',goneCats);
                    if(ed2)throw new Error('[est_cats 삭제] '+ed2.message);
                }
                // 새로 추가한 품목의 임시 ID → DB ID로 교체하여 자재/공구 연결 유지 + 최신 체크 상태 합치기
                const remap=r=>(r.itemId&&itemIdMap[r.itemId])?{...r,itemId:itemIdMap[r.itemId]}:r;
                const mats=estMaterials.map(remap).map(r=>r.id in cm?{...r,checked:cm[r.id]}:r);
                const preps=estPrep.map(remap).map(r=>r.id in cp?{...r,checked:cp[r.id]}:r);
                const{data:ud,error:e4}=await prepSafe(p=>sb.from('estimates').update(p).eq('id',estimateId).select('updated_at'),
                    {...common,est_materials:JSON.stringify(mats),est_prep:JSON.stringify(preps),updated_at:now});
                if(e4) throw new Error('[estimates update] '+e4.message);
                loadedRef.current.updatedAt=(ud&&ud[0]&&ud[0].updated_at)||now;
                await stockAfterSave(mats);
                if(opts.stay){
                    // 이 화면에 머무는 경우: 임시 ID를 DB ID로 바꿔 두어야 다음 저장 때 중복 저장되지 않음
                    const nc=cats.map(c=>({...c,id:catIdMap[c.id]||c.id}));
                    const ni=items.map(it=>({...it,id:itemIdMap[it.id]||it.id,catId:catIdMap[it.catId]||it.catId}));
                    setCats(nc);setItems(ni);setEstMaterials(mats);setEstPrep(preps);setStatusDates(sdSave);setSendHistory(hist);setMeta(metaSave);
                    origCatIds.current=new Set(nc.map(c=>c.id));origItemIds.current=new Set(ni.map(i=>i.id));origChecked.current={...scSave};setStatusChecked(scSave);
                    rebase.current=true;settleUploads();
                }else markSaved();
                return{id:estimateId,no:estNo};
            }
        }catch(e){
            const msg=e.message||String(e);
            console.error('저장 실패:', msg);
            // RLS 오류 안내
            if(msg.includes('row-level security')||msg.includes('policy')||msg.includes('42501')){
                alert('⚠️ 저장 실패: 저장 권한이 없습니다 (보안 규칙)\n\n로그인한 계정이 사용자 관리에서 승인되어 있는지 확인하세요.\n승인된 계정인데도 계속 실패하면 관리자에게 알려주세요.');
            } else if(msg.includes('relation')||msg.includes('does not exist')||msg.includes('42P01')){
                alert('⚠️ 저장 실패: 테이블이 없습니다\n\n채팅 아래쪽에 안내된 SQL 3개를 Supabase SQL Editor에서 먼저 실행하세요.');
            } else {
                // 수정 저장은 여러 단계로 나뉘어 있어 중간에 실패하면 일부만 저장될 수 있음 → 다시 저장하면 맞춰짐
                alert('⚠️ 저장 실패\n\n오류 내용: '+msg+(mode==='edit'?'\n\n일부 내용만 저장되었을 수 있습니다. 인터넷 연결을 확인한 뒤 다시 💾 저장을 눌러 주세요.':'')+'\n\n브라우저 콘솔(F12)에서 자세한 내용을 확인하세요.');
            }
            return null;
        }finally{setSaving(false);}
    };
    const save=async()=>{
        const r=await doSave();
        if(r){toast(mode==='new'?'✅ 견적서가 저장되었습니다 ('+r.no+')':'✅ 견적서가 수정되었습니다');onNavigate('est-list');}
    };

    // 엑셀 — 인쇄 양식과 같은 순서: 상호·회사정보 / 제목·견적번호·작성일 / 고객·담당자 / 상품 / 가격 / 결제 조건 / 안내사항
    const exportExcel=()=>{
        const no=estNo||shownNo,tm=meta.terms||{},rate=Number(tm.depositRate)||0;
        const docStep=statusDates['본견적발송']?'본견적발송':statusDates['가견적발송']?'가견적발송':null;
        const date=(docStep&&statusDates[docStep])||loadedRef.current.createdAt||new Date().toISOString();
        const rows=[[st.company],...String(st.companyInfo||'').split('\n').filter(Boolean).map(l=>[l]),[],
            [docStep==='가견적발송'?'가견적서':'견적서','','','','견적번호',no],
            ['작성일',fmtD(date),'','','유효기간',st.validDays?st.validDays+'일':''],[],
            ['■ 고객 정보'],['고객명',client.name||'','연락처',client.phone||'','주소',client.address||''],
            ['■ 담당자 정보'],['담당자',client.manager||'','연락처',client.managerPhone||''],[],
            ['■ 상품 정보'],['No','카테고리','품목명','규격/재질','수량','단가(원)','금액(원)']];
        let n=0;
        cats.forEach(cat=>items.filter(i=>i.catId===cat.id).forEach(i=>rows.push([++n,cat.name,i.name,i.spec||'',Number(i.qty)||0,Number(i.unitPrice)||0,Number(i.total)||0])));
        COST_KEYS.forEach(([k,l])=>{const v=Number(costs[k])||0;if(v>0)rows.push([++n,'시공비',l,'',1,v,v]);});
        rows.push([],['■ 가격 정보'],['공급가액',grand,'부가세 (10%)',vat,'최종 견적금액 (VAT 포함)',grandVat]);
        if(tm.bank||rate||tm.asTerms){
            rows.push([],['■ 결제 조건']);
            if(tm.bank)rows.push(['입금계좌',tm.bank]);
            if(rate)rows.push(['계약금',`견적금액의 ${rate}% · ${fmt(Math.round(grandVat*rate/100))}원`]);
            if(tm.asTerms)rows.push(['A/S 조건',tm.asTerms]);
        }
        if(st.notes)rows.push([],['■ 안내사항'],...String(st.notes).split('\n').map(l=>[l]));
        const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(rows);
        ws['!cols']=[{wch:10},{wch:14},{wch:26},{wch:22},{wch:12},{wch:14},{wch:16}];
        XLSX.utils.book_append_sheet(wb,ws,'견적서');
        XLSX.writeFile(wb,`${no}_${client.name||'고객'}.xlsx`.replace(/[\\/:*?"<>|]/g,'_'));toast('📊 엑셀 저장됨');
    };

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;

    return(<div>
        {showPick&&<ProductPickModal sb={sb} prodCats={prodCats} cats={cats} onAddProduct={addProductToEst} onClose={()=>setShowPick(false)}/>}
        <div className="view-sticky">
        <div className="page-header">
            {/* 제목 옆에 견적 배지를 한 줄로 (상단 고정 영역 높이 절약) */}
            <div className="page-title-wrap" style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
                <h1 title={mode==='new'?'상품 선택 또는 직접 입력 · 작성 완료 후 저장 버튼을 눌러주세요':'변경 내용은 💾 저장 버튼을 눌러야 DB에 반영됩니다'}>{mode==='new'?'📋 새 견적서 작성':'✏️ 견적서 수정'}</h1>
                <div className="est-badge">
                    {[['견적번호',<span className="est-badge-num">{shownNo}</span>],['작성일',<span style={{color:'#fff',fontSize:13,fontWeight:600}}>{new Date().toLocaleDateString('ko-KR')}</span>],['상태',<StatusBadge status={currentStatus}/>]].map(([l,v],i)=><React.Fragment key={l}>{i>0&&<div className="est-badge-sep"/>}<div style={{display:'flex',alignItems:'center',gap:6}}><span className="est-badge-label" style={{marginBottom:0}}>{l}</span>{v}</div></React.Fragment>)}
                </div>
            </div>
            <div className="btn-row no-print">
                <button className="btn btn-outline" onClick={()=>leave('est-list')}>← 목록으로</button>
                <button className="btn btn-gold" onClick={exportExcel}>📊 엑셀</button>
                <button className="btn btn-outline" onClick={printEstimate}>🖨 인쇄</button>
                {mode==='edit'&&<button className="btn btn-outline" onClick={()=>leave('est-checklist',estimateId)}>✅ 시공 체크리스트</button>}
                <button className="btn btn-outline" style={{fontSize:11,padding:'6px 10px',color:'var(--muted)'}} onClick={showSqlGuide}>⚙️ DB 안내</button>
                <button className="btn btn-primary" onClick={save} disabled={saving}>{saving?'저장 중...':'💾 저장'}</button>
            </div>
        </div>

        {/* 고객 정보 / 담당자 정보 */}
        <div className="card"><div className="view-info">
            {[['고객 정보','view-info-client',[['name','고객명','홍길동'],['phone','연락처','010-0000-0000'],['address','주소/지역','경기도 파주시'],['source','유입 경로','']]],
              ['👤 담당자 정보','view-info-mgr',[['manager','담당자','담당자명'],['managerPhone','담당자연락처','010-0000-0000']]]].map(([title,cls,fields])=>(
            <div className={cls} key={cls}><div className="card-title">{title}</div>
                <div className="info-grid">{fields.map(([k,l,p])=>(
                        <div className="info-field" key={k}>
                            <label>{l}</label>
                            <div style={{display:'flex',gap:5,alignItems:'center'}}>
                                {k==='source'
                                    ?<select className="mgr-select" style={{flex:1}} value={(meta.site||{}).source||''} onChange={e=>updMeta('site',s=>({...(s||{}),source:e.target.value}))}>
                                        <option value="">선택</option>{SITE_SOURCES.map(s=><option key={s}>{s}</option>)}</select>
                                :k==='manager'
                                    ?<select className="mgr-select" style={{flex:1}} value={client.manager||''} onChange={e=>pickManager(e.target.value)}>
                                        <option value="">담당자 선택</option>
                                        {staff.map(s=><option key={s.email||s.name} value={s.name}>{s.name}</option>)}
                                        {client.manager&&!staff.some(s=>s.name===client.manager)&&<option value={client.manager}>{client.manager}</option>}
                                    </select>
                                    :<input style={{flex:1}} value={client[k]||''} onChange={e=>updClient(k,e.target.value)} placeholder={p}/>}
                                {k==='address'&&client.address&&(
                                    <div style={{display:'flex',gap:4,flexShrink:0}}>
                                        <button className="nav-btn" title="T맵으로 길안내"
                                            onClick={()=>openTmap(client.address)}>🗺T맵</button>
                                        <button className="nav-btn" style={{background:'var(--green)'}} title="카카오맵으로 길안내"
                                            onClick={()=>{const a=encodeURIComponent(client.address||'');window.open(`https://map.kakao.com/?q=${a}`,'_blank');}}>🗺카카오</button>
                                    </div>
                                )}
                            </div>
                        </div>
                ))}</div>
            </div>))}
        </div></div>
        </div>

        {/* ★ 진행 상태 관리 */}
        <div className="status-timeline-card">
            <div className="status-timeline-title" style={{color:'var(--navy)',cursor:'pointer',marginBottom:statusOpen?12:0}} onClick={()=>setStatusOpen(o=>!o)}>
                📊 진행 상태 관리 <StatusBadge status={currentStatus}/> <span style={{fontSize:11,color:'var(--muted)',fontWeight:400,textTransform:'none'}}>{statusOpen?'▲ 접기':'▼ 펼치기'}</span>
            </div>
            {/* 실주(진행 안 함) · 본견적 지연 */}
            {isLost?<div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',background:'#fee2e2',border:'1.5px solid #fca5a5',borderRadius:10,padding:'8px 12px',marginBottom:10,fontSize:13}}>
                <b style={{color:'#b91c1c'}}>❌ 실주 처리된 견적</b>
                <span>사유: <b>{meta.lost.reason||'-'}</b>{meta.lost.memo?' · '+meta.lost.memo:''} · {fmtD(meta.lost.at)}</span>
                <button className="btn btn-outline btn-xs" onClick={()=>{if(confirm('실주 처리를 되돌릴까요?'))updMeta('lost',undefined);}}>↩ 되돌리기</button>
            </div>
            :lostForm?<div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',background:'#fff7ed',border:'1.5px solid #fed7aa',borderRadius:10,padding:'8px 12px',marginBottom:10}}>
                <b style={{fontSize:12}}>❌ 실주 사유</b>
                <select className="status-dt-input" style={{width:'auto'}} value={lostForm.reason} onChange={e=>setLostForm(f=>({...f,reason:e.target.value}))}>{LOST_REASONS.map(r=><option key={r}>{r}</option>)}</select>
                <input className="status-dt-input" style={{flex:1,minWidth:160}} placeholder="메모 (선택)" value={lostForm.memo} onChange={e=>setLostForm(f=>({...f,memo:e.target.value}))}/>
                <button className="btn btn-sm" style={{background:'#b91c1c',color:'#fff'}} onClick={async()=>{
                    if(meta.stock&&meta.stock.done&&confirm('이 견적으로 차감한 재고를 되돌릴까요?'))await revertStock();
                    updMeta('lost',{reason:lostForm.reason,memo:lostForm.memo,at:new Date().toISOString()});setLostForm(null);toast('❌ 실주 처리됨 — 💾 저장을 눌러야 반영됩니다');}}>실주 처리</button>
                <button className="btn btn-outline btn-sm" onClick={()=>setLostForm(null)}>취소</button>
            </div>
            :<div style={{display:'flex',justifyContent:'flex-end',gap:8,alignItems:'center',marginBottom:statusOpen?6:0}}>
                {isLate&&<span style={{fontSize:12,fontWeight:700,color:'#b45309',background:'#fef3c7',borderRadius:8,padding:'3px 10px'}}>⚠ 방문 후 {st.delayDays}일이 지났는데 본견적을 아직 보내지 않았습니다</span>}
                <button className="btn btn-outline btn-xs" style={{color:'#b91c1c'}} onClick={()=>setLostForm({reason:LOST_REASONS[0],memo:''})}>❌ 실주 처리</button>
            </div>}
            {statusOpen&&<StatusTrack sd={statusDates} sc={statusChecked} stage={currentStage} hold={onHold} balancePaid={balancePaid} holdDays={holdDays}
                editable onDate={updStatusDate} onCheck={updStatusChecked} onBalance={confirmBalance}/>}
            {/* 📦 재고 차감 상태 (설치 후 소요 자재를 재고에서 차감 · 되돌리기 가능, 입출고 기록에 남음) */}
            {statusOpen&&mode==='edit'&&stockLinesOf(estMaterials).length>0&&<div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginTop:8,fontSize:12}}>
                <b style={{color:'var(--navy)'}}>📦 재고</b>
                {meta.stock&&meta.stock.done
                    ?<><span style={{color:'var(--green)',fontWeight:700}}>✅ 차감 완료 ({fmtD(meta.stock.at)} · {meta.stock.lines.length}종)</span>
                        <button className="btn btn-outline btn-xs" disabled={stockBusy} onClick={()=>{if(confirm('이 견적으로 차감한 재고를 되돌릴까요?'))revertStock();}}>↩ 차감 되돌리기</button></>
                    :<><span style={{color:'var(--muted)'}}>미차감 ({stockLinesOf(estMaterials).length}종)</span>
                        <button className="btn btn-outline btn-xs" disabled={stockBusy} onClick={()=>{if(confirm('소요 자재 '+stockLinesOf(estMaterials).length+'종을 재고에서 차감할까요?'))deductStock();}}>📦 재고 차감</button></>}
            </div>}
            {statusOpen&&<div style={{fontSize:11,color:'var(--muted)',marginTop:8}}>📤 가견적·📨 본견적 발송일은 🖨 인쇄할 때 확인하면 자동 기록 · 🔧 제작중은 계약금 입력 후 저장하면 자동 기록 · 🏠 방문·🎉 설치·공사 일정은 일정표에 표시 (하루 작업은 📅 당일)</div>}
            {statusOpen&&!statusChecked['방문상담 및 실측']&&<VisitPlanner sb={sb} estimateId={estimateId} address={client.address} value={statusDates['방문상담 및 실측']} onPick={v=>updStatusDate('방문상담 및 실측',v)}/>}
        </div>

        {/* ★ 추가 방문 (AS · 추가 설치) — 진행 상태와 별개, 💾 저장 시 반영 */}
        <div className="card">
            <div className="card-title">🔧 추가 방문 (AS · 추가 설치)</div>
            {extraVisits.length===0&&<div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>견적이 완료된 뒤에도 AS나 추가 설치로 방문할 일정을 등록합니다. 일정표와 방문 추천에 함께 반영됩니다.</div>}
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {extraVisits.map(v=>{
                    const upd=(k,val)=>setExtraVisits(p=>p.map(x=>x.id===v.id?{...x,[k]:val}:x));
                    const tp=EXTRA_TYPES[v.type]||EXTRA_TYPES['기타'];
                    return(<div key={v.id} style={{border:'1.5px solid '+(v.done?'#bbf7d0':tp.bg),background:v.done?'#f0fdf4':'#fff',borderRadius:10,padding:'8px 10px'}}>
                        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                            <select className="status-dt-input" value={v.type} onChange={e=>upd('type',e.target.value)} style={{fontWeight:700,color:tp.color,background:tp.bg,width:'auto'}}>
                                {Object.keys(EXTRA_TYPES).map(t=><option key={t} value={t}>{EXTRA_TYPES[t].icon} {t}</option>)}</select>
                            <input type="datetime-local" className={`status-dt-input ${v.at?'has-value':''}`} style={{width:'auto'}} value={dtLocal(v.at)} onChange={e=>upd('at',e.target.value)} title="방문 예정 일시"/>
                            <label style={{display:'flex',alignItems:'center',gap:4,fontSize:12,fontWeight:600,whiteSpace:'nowrap'}} title="예상 소요 시간 (방문 추천 계산에 사용, 0.5 = 30분)">⏱
                                <input type="number" min="0.5" step="0.5" className="status-dt-input" style={{width:68}} value={v.dur?Number(v.dur)/60:''} placeholder="1" onChange={e=>upd('dur',e.target.value?Math.round(Number(e.target.value)*60):'')}/>시간</label>
                            <input className="status-dt-input" style={{flex:1,minWidth:180}} value={v.reason||''} onChange={e=>upd('reason',e.target.value)} placeholder="방문 사유 (예: 문짝 휨 교체, 선반 2개 추가)"/>
                            <label style={{display:'flex',alignItems:'center',gap:4,fontSize:12,fontWeight:600,cursor:'pointer'}}><input type="checkbox" className="status-check" checked={!!v.done} onChange={e=>upd('done',e.target.checked)}/>방문함</label>
                            <button className="del-btn" title="삭제" onClick={()=>{if(confirm('이 추가 방문을 삭제할까요?'))setExtraVisits(p=>p.filter(x=>x.id!==v.id));}}>✕</button>
                        </div>
                        {!v.done&&<VisitPlanner sb={sb} estimateId={estimateId} address={client.address} value={v.at} dur={v.dur} onPick={val=>upd('at',val)}/>}
                    </div>);
                })}
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginTop:10}}>
                <button className="btn btn-outline btn-sm" onClick={()=>setExtraVisits(p=>[...p,{id:uid(),type:'AS',at:'',dur:60,reason:'',done:false}])}>＋ 추가 방문</button>
                {mode==='edit'&&<button className="btn btn-outline btn-sm" onClick={()=>{
                    if(!window.confirm((dirty?'저장하지 않은 변경 내용은 사라집니다.\n':'')+'이 고객 정보로 새 견적을 만들까요?'))return;
                    window.__estDirty=false;
                    sessionStorage.setItem('newEstClient',JSON.stringify({name:client.name,phone:client.phone,address:client.address,manager:client.manager,managerPhone:client.managerPhone}));
                    onNavigate('est-new');
                }}>📋 이 고객으로 새 견적 만들기</button>}
                {mode==='edit'&&<span style={{fontSize:11,color:'var(--muted)'}}>비용이 드는 추가 설치는 새 견적으로 만들면 금액·진행 상태를 따로 관리할 수 있습니다.</span>}
            </div>
        </div>


        {/* 카테고리 버튼 */}
        <div style={{marginBottom:12,display:'flex',gap:8,flexWrap:'wrap'}} className="no-print">
            <button className="btn btn-green" onClick={()=>setShowPick(true)}>🛍 상품 선택</button>
            <button className="btn btn-outline" onClick={addCat}>＋ 기타상품추가</button>
        </div>

        {/* 품목 테이블 */}
        {cats.length===0&&<div className="empty-state" style={{marginTop:20}}><div className="empty-icon">📋</div><div className="empty-text"><strong style={{color:'var(--blue)'}}>🛍 상품 선택</strong> 또는 <strong>기타상품추가</strong>로 시작하세요.</div></div>}
        {cats.map(cat=>{const ci=items.filter(i=>i.catId===cat.id);const sub=catTotal(cat.id);return(
            <div key={cat.id} className="cat-section">
                <div className="cat-header"><div className="cat-header-left"><div className="cat-bar"/><input className="cat-name-input" value={cat.name} onChange={e=>updCat(cat.id,e.target.value)}/><span className="cat-subtotal">소계 {fmt(sub)}원</span></div>
                <div style={{display:'flex',gap:8,alignItems:'center'}} className="no-print"><button className="btn btn-outline btn-sm" onClick={()=>addItem(cat.id)}>＋ 품목</button><button className="del-btn" onClick={()=>delCat(cat.id)}>🗑</button></div></div>
                <div className="table-wrap"><table>
                    <thead><tr><th className="tc" style={{width:52}}>사진</th><th style={{textAlign:'left',minWidth:130}}>품목/부품명</th><th style={{textAlign:'left',minWidth:100}}>규격/재질</th><th className="tr" style={{width:65}}>수량</th><th className="tr" style={{width:110}}>단가(원)</th><th className="tr" style={{width:115}}>합계(원)</th><th className="no-print" style={{width:34}}></th></tr></thead>
                    <tbody>
                        {ci.length===0&&<tr><td colSpan={7} style={{textAlign:'center',padding:16,color:'#94a3b8',fontSize:12}}>품목이 없습니다.</td></tr>}
                        {ci.map(item=><tr key={item.id}><td className="tc"><label className="img-lbl">{item.imgUrl?<img src={item.imgUrl} className="img-prev" alt=""/>:<div className="img-ph">+</div>}<input type="file" style={{display:'none'}} accept="image/*" onChange={e=>handleImg(e,item.id)}/></label></td><td><input className="cell-input" value={item.name} onChange={e=>updItem(item.id,'name',e.target.value)}/></td><td><input className="cell-input m" value={item.spec} onChange={e=>updItem(item.id,'spec',e.target.value)} placeholder="규격"/></td><td><input type="number" className="cell-input r" value={item.qty} onChange={e=>updItem(item.id,'qty',e.target.value)} min="0"/></td><td><input type="number" className="cell-input r" value={item.unitPrice} onChange={e=>updItem(item.id,'unitPrice',e.target.value)} min="0"/></td><td className="tr" style={{fontWeight:700,color:'var(--navy)'}}>{fmt(item.total)}</td><td className="tc no-print"><button className="del-btn" onClick={()=>delItem(item.id)}>✕</button></td></tr>)}
                        {ci.length>0&&<tr className="subtotal-row"><td colSpan={4}/><td className="tr subtotal-lbl">소 계</td><td className="tr subtotal-val">{fmt(sub)}원</td><td/></tr>}
                    </tbody>
                </table></div>
            </div>
        );})}

        {/* ★ 시공비 · 결제 조건 (견적서 인쇄에 표시, 시공비 0원은 인쇄 제외) */}
        <div className="card" style={{marginTop:16}}>
            <div className="card-title">🧾 시공비 · 결제 조건 <span style={{fontSize:11,color:'var(--muted)',fontWeight:400,textTransform:'none',letterSpacing:0}}>(견적서 인쇄에 표시 · 시공비는 공급가액에 포함, 0원이면 인쇄에서 빠짐)</span></div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:'8px 14px',marginBottom:10}}>
                {COST_KEYS.map(([k,l])=><div className="info-field" key={k}><label>{l} (원)</label><input type="number" min="0" value={costs[k]??''} placeholder="0" onChange={e=>updMeta('costs',c=>({...(c||{}),[k]:e.target.value}))}/></div>)}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'2fr 120px',gap:'8px 14px'}}>
                <div className="info-field"><label>입금계좌</label><input value={(meta.terms||{}).bank||''} placeholder="예) 농협 000-0000-0000-00 (예금주)" onChange={e=>updMeta('terms',t=>({...(t||{}),bank:e.target.value}))}/></div>
                <div className="info-field"><label>계약금 비율 (%)</label><input type="number" min="0" max="100" value={(meta.terms||{}).depositRate??''} onChange={e=>updMeta('terms',t=>({...(t||{}),depositRate:e.target.value}))}/></div>
            </div>
            <div className="info-field" style={{marginTop:8}}><label>A/S 조건</label><textarea rows={2} value={(meta.terms||{}).asTerms||''} placeholder="예) 설치 후 1년 무상 A/S (소모품 제외)" onChange={e=>updMeta('terms',t=>({...(t||{}),asTerms:e.target.value}))}
                style={{width:'100%',border:'1.5px solid var(--border)',borderRadius:7,padding:'8px 12px',fontSize:13,fontFamily:"'Noto Sans KR',sans-serif",resize:'vertical'}}/></div>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:6}}>기본값은 🔧 환경설정에서 바꿀 수 있습니다.</div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginTop:12,paddingTop:10,borderTop:'1px dashed var(--border)'}}>
                <button className="btn btn-outline btn-sm" onClick={shareLink}>🔗 고객용 링크 복사</button>
                <span style={{fontSize:11,color:'var(--muted)'}}>카톡·문자로 보내면 고객이 휴대폰에서 견적서를 열고 품목별 <b>시공 사례(포트폴리오)</b>를 바로 볼 수 있습니다. 링크를 만든 뒤 인쇄하면 견적서에도 주소가 표시됩니다.</span>
                {meta.shareToken&&<a href={shareUrlOf(meta.shareToken)} target="_blank" rel="noreferrer" style={{fontSize:12,color:'var(--blue)'}}>미리 보기 ↗</a>}
            </div>
        </div>

        {/* ★ 원가 분석 — 직원용 (인쇄·엑셀·고객용 링크에는 나가지 않음) */}
        {grand>0&&(()=>{const cost=estMaterials.reduce((s,m)=>s+(Number(m.unit_price)||0)*(Number(m.qty)||0),0);
            const margin=grand-cost,mr=grand?Math.round(margin/grand*1000)/10:0,low=mr<(Number(st.marginWarn)||0);
            return(<div className="no-print" style={{display:'flex',gap:18,flexWrap:'wrap',alignItems:'center',background:low?'#fef2f2':'#f0fdf4',border:'1.5px solid '+(low?'#fca5a5':'#bbf7d0'),borderRadius:10,padding:'10px 16px',marginTop:16,fontSize:13}}>
                <b>💹 원가 분석 <span style={{fontWeight:400,fontSize:11,color:'var(--muted)'}}>(직원용 · 인쇄 제외)</span></b>
                <span>자재 원가 <b>{fmt(cost)}</b>원</span><span>공급가액 <b>{fmt(grand)}</b>원</span>
                <span>마진 <b style={{color:low?'#b91c1c':'#15803d'}}>{fmt(margin)}</b>원</span>
                <span>마진율 <b style={{fontSize:16,color:low?'#b91c1c':'#15803d'}}>{mr}%</b>{low&&<span style={{color:'#b91c1c'}}> (기준 {st.marginWarn}% 미만)</span>}</span>
                {cost===0&&<span style={{fontSize:11,color:'var(--muted)'}}>소요 자재가 없으면 원가가 0으로 계산됩니다</span>}
            </div>);})()}

        {grand>0&&<div className="grand-card">
            <div><div className="grand-label">최종 견적금액 (VAT 포함)</div><div className="grand-val">{fmt(grandVat)}원</div><div className="grand-vat">공급가액 {fmt(grand)}원 + VAT {fmt(vat)}원</div></div>
            <div className="grand-breakdown">{[['공급가액',grand,false],['VAT 10%',vat,true]].map(([l,v,g])=><div className="bd-item" key={l}><div className="bd-label">{l}</div><div className="bd-val" style={g?{color:'var(--gold)'}:{}}>{fmt(v)}원</div></div>)}</div>
        </div>}
  
        {/* ★ 결제 정보 — 입금 내역 한 곳에서 관리, 결제 상태는 자동 (계약금 있음 = 계약, 잔금 입금 확인 = 완료) */}
        <div className="card" style={{marginTop:16}}>
            <div className="card-title">💳 결제 정보 <span className="status-badge" style={{marginLeft:6,background:paymentStatus==='완료'?'#dcfce7':paymentStatus==='계약'?'#fef9c3':'#fee2e2',color:paymentStatus==='완료'?'#15803d':paymentStatus==='계약'?'#854d0e':'#b91c1c',textTransform:'none',letterSpacing:0}}>{paymentStatus==='완료'?'✅ 완료':paymentStatus==='계약'?'📝 계약':'⏳ 입금전'}</span></div>
            <div className="pay-grid">
                {[['deposit','계약금',depositAmount,setDepositAmount],['mid','중도금',midAmount,setMidAmount]].map(([k,l,val,setVal])=>(
                <div className="pay-field" key={k}>
                    <div className="pay-label">{l}</div>
                    {/* 금액을 입력하면 입금일이 비어 있을 때 오늘 날짜로 자동 입력 */}
                    <input type="number" className="pay-input" value={val} min="0" onChange={e=>{setVal(e.target.value);if(e.target.value&&!(pay[k]||{}).date)updPay(k,'date',ymd(new Date()));}} placeholder="금액 입력"/>
                    <div className="pay-sub">{fmt(Number(val)||0)}원{k==='deposit'&&(meta.terms||{}).depositRate?` · 견적의 ${meta.terms.depositRate}% = ${fmt(Math.round(grandVat*meta.terms.depositRate/100))}원`:''}</div>
                    <PayMeta p={pay[k]||{}} onSet={(f,v)=>updPay(k,f,v)}/>
                </div>))}
                <div className="pay-field">
                    <div className="pay-label">잔금 (자동계산)</div>
                    <input readOnly className={'pay-input auto '+(balancePaid||balanceAmount<=0&&grandVat>0?'zero':'')}
                        value={balancePaid?'0원':(grandVat>0?fmt(Math.max(0,balanceAmount))+'원':'-')}/>
                    <div style={{display:'flex',gap:6,alignItems:'center',marginTop:6,fontSize:12,flexWrap:'wrap'}}>
                        <span>금액</span><input type="number" min="0" className="status-dt-input" style={{width:110,padding:'4px 6px'}} placeholder={String(Math.max(0,balanceAmount))} value={(pay.balance||{}).amount??''}
                            onChange={e=>{updPay('balance','amount',e.target.value);if(e.target.value&&!(pay.balance||{}).date)updPay('balance','date',ymd(new Date()));}}/>
                    </div>
                    <PayMeta p={pay.balance||{}} onSet={(f,v)=>updPay('balance',f,v)}/>
                    <div className="pay-check-row">
                        <input type="checkbox" id="bpaid" className="pay-check" checked={balancePaid} onChange={e=>confirmBalance(e.target.checked)}/>
                        <label htmlFor="bpaid" className={'pay-check-lbl'+(balancePaid?' on':'')} style={{cursor:'pointer'}}>잔금 입금 완료</label>
                    </div>
                </div>
            </div>
        </div>

        {/* ★ 견적 이력 — 가견적·본견적을 보낸 순간의 품목·금액 (다시 보기·재인쇄) */}
        {sendHistory.length>0&&<div className="card">
            <div className="card-title">📜 견적 이력</div>
            {sendHistory.slice().reverse().map((h,i,arr)=>{const prev=arr[i+1];return(
                <div key={h.id||i} style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',padding:'6px 0',borderBottom:'1px solid var(--border)',fontSize:13}}>
                    <StatusBadge status={h.step}/>
                    <span style={{fontWeight:700,minWidth:130}}>{fmtDT(h.at)}</span>
                    <span>공급가액 <b>{fmt(h.grand)}</b>원 · VAT 포함 <b>{fmt(h.grandVat)}</b>원</span>
                    {prev&&prev.grandVat!==h.grandVat&&<span style={{fontSize:12,color:h.grandVat>prev.grandVat?'#b91c1c':'#15803d'}}>({h.grandVat>prev.grandVat?'+':''}{fmt(h.grandVat-prev.grandVat)}원)</span>}

            <div className="card-title">📍 현장정보</div>

            <div className="site-photos-grid">
                {sitePhotos.map((photo,i)=>(
                    <div key={i} className="site-photo-item" onClick={()=>setPhotoView(i)} title="크게 보기">

                    <input type="file" accept="image/*" {...extra} style={{display:'none'}}
                        onChange={async e=>{
                            const files=Array.from(e.target.files);e.target.value='';
                            for(const f of files){
                                const url=await uploadTracked(f,'site-photos');
                                setSitePhotos(p=>[...p,url]);
                            }

                </label>))}
            </div>
            {sitePhotos.length===0&&<p style={{fontSize:12,color:'var(--muted)',marginTop:8}}>현장에서 휴대폰으로 바로 촬영하거나 앨범에서 고를 수 있습니다.</p>}
            {/* 첨부 파일 (스캔 PDF·도면·실측 파일 등 여러 개) */}
            <div style={{fontSize:12,fontWeight:700,color:'var(--navy)',margin:'14px 0 6px'}}>📎 첨부 파일</div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {((meta.site||{}).files||[]).map((f,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',border:'1px solid var(--border)',borderRadius:8,background:'#f8fafc'}}>
                    <span style={{fontSize:16}}>📄</span>
                    <a href={f.url} target="_blank" rel="noopener noreferrer" style={{flex:1,color:'var(--blue)',fontSize:13,textDecoration:'none',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name||'첨부파일'}</a>
                    <button className="del-btn" title="삭제" onClick={()=>{if(confirm('이 파일을 목록에서 뺄까요?'))updMeta('site',s=>({...(s||{}),files:((s||{}).files||[]).filter((_,j)=>j!==i)}));}}>✕</button>
                </div>)}
                <label style={{display:'block',cursor:'pointer',padding:'12px',textAlign:'center',border:'1px dashed var(--border)',borderRadius:8,color:'var(--muted)',fontSize:13}}>
                    📎 파일 첨부 (스캔 PDF · 도면 · 이미지 · 문서, 여러 개 가능)
                    <input type="file" multiple accept=".pdf,image/*,.doc,.docx,.xls,.xlsx,.hwp,.dwg,.dxf,.3dm" style={{display:'none'}} onChange={async e=>{
                        const files=Array.from(e.target.files);e.target.value='';
                        for(const f of files){const url=await uploadTracked(f,'site-files');updMeta('site',s=>({...(s||{}),files:[...((s||{}).files||[]),{url,name:f.name}]}));}
                    }}/>
                </label>
            </div>
            {/* 사진 크게 보기 (◀ ▶ 로 넘기기, 바깥 클릭·✕ 로 닫기) */}
            {photoView!==null&&sitePhotos[photoView]&&<div className="modal-overlay" style={{zIndex:2000,background:'rgba(0,0,0,.88)',flexDirection:'column',gap:10}} onClick={()=>setPhotoView(null)}>
                <img src={sitePhotos[photoView]} alt="" style={{maxWidth:'94vw',maxHeight:'82vh',objectFit:'contain',borderRadius:8}} onClick={e=>e.stopPropagation()}/>
                <div style={{display:'flex',gap:10,alignItems:'center'}} onClick={e=>e.stopPropagation()}>
                    <button className="btn btn-outline btn-sm" disabled={photoView<=0} onClick={()=>setPhotoView(v=>v-1)}>◀</button>
                    <span style={{color:'#fff',fontSize:13}}>{photoView+1} / {sitePhotos.length}</span>
                    <button className="btn btn-outline btn-sm" disabled={photoView>=sitePhotos.length-1} onClick={()=>setPhotoView(v=>v+1)}>▶</button>
                    <a className="btn btn-outline btn-sm" href={sitePhotos[photoView]} target="_blank" rel="noreferrer">원본 열기 ↗</a>
                    <button className="btn btn-outline btn-sm" onClick={()=>setPhotoView(null)}>✕ 닫기</button>
                </div>
            </div>}
        </div>

        {/* ★ 소요 자재 */}
        <SoyoJaeCard sb={sb} estMaterials={estMaterials} setEstMaterials={setEstMaterials} uid={uid} items={items} cats={cats}/>

        {/* ★ 공구 · 부자재 */}
        <PrepCard estPrep={estPrep} setEstPrep={setEstPrep} uid={uid} items={items} cats={cats}/>


        {/* ★ 포트폴리오 첨부 */}
        <div className="card">
            <div className="card-title">🖼 포트폴리오 첨부</div>
            <div style={{marginBottom:10,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                <button className="btn btn-outline btn-sm" onClick={()=>setShowPortPick(true)}>＋ 포트폴리오 선택</button>
                <span style={{fontSize:11,color:'var(--muted)'}}>※ 인쇄 시 이미지와 링크가 포함됩니다</span>
            </div>
            {portItems.length===0
                ?<p style={{fontSize:12,color:'var(--muted)'}}>첨부된 포트폴리오가 없습니다.</p>
                :<div className="est-port-grid">
                    {portItems.map((p,i)=>(
                        <div key={i} className="est-port-item">
                            {p.image_url?<img src={p.image_url} className="est-port-img" alt=""/>
                                :<div className="est-port-img" style={{display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,color:'#94a3b8'}}>🖼</div>}
                            <div className="est-port-info">
                                {p.title}
                                <div style={{display:'flex',gap:4,marginTop:4,flexWrap:'wrap'}}>
                                    {p.image_url&&<a href={p.image_url} target="_blank" rel="noreferrer"><button className="btn btn-outline btn-xs" style={{fontSize:10}}>🔗 열기</button></a>}
                                    {p.image_url&&<button className="btn btn-outline btn-xs" style={{fontSize:10}} onClick={()=>{navigator.clipboard?.writeText(p.image_url).then(()=>toast('📋 복사됨')).catch(()=>alert(p.image_url));}}>📋 복사</button>}
                                </div>
                            </div>
                            <button className="est-port-del no-print" onClick={()=>setPortItems(prev=>prev.filter((_,j)=>j!==i))}>✕</button>
                        </div>
                    ))}
                </div>}
        </div>

        {/* 포트폴리오 선택 팝업 */}
        {showPortPick&&<PortPickModal sb={sb} portItems={portItems} setPortItems={setPortItems} onClose={()=>setShowPortPick(false)}/>}

        <div style={{textAlign:'center',marginTop:18,fontSize:11,color:'#94a3b8',paddingBottom:40}}>★ 럭키스타 캠핑카라반 | 경기도 파주시 광탄면 | {new Date().toLocaleDateString('ko-KR')} 기준</div>
    </div>);
}
/* ═══════════════════════════════════════
   ★ 포트폴리오 선택 모달 (견적서용)

function PortPickModal({sb, portItems, setPortItems, onClose}){
    const[all,setAll]=useState([]);
    const[loading,setLoading]=useState(true);
    const[sel,setSel]=useState(portItems.map(p=>p.id));

    useEffect(()=>{
        if(!sb)return;
        sb.from('portfolios').select('*').order('created_at',{ascending:false})
          .then(({data})=>{if(data)setAll(data);setLoading(false);});
    },[sb]);

    const toggle=item=>setSel(p=>p.includes(item.id)?p.filter(id=>id!==item.id):[...p,item.id]);

    const confirm=()=>{
        setPortItems(all.filter(a=>sel.includes(a.id)).map(a=>({id:a.id,title:a.title,image_url:a.image_url})));
        onClose();
    };

    return(
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box lg" onClick={e=>e.stopPropagation()}>
                <div className="modal-header">
                    <div className="modal-title">🖼 포트폴리오 선택</div>
                    <button className="modal-close" onClick={onClose}>✕</button>
                </div>
                {loading?<div style={{textAlign:'center',padding:40}}>로딩 중...</div>
                :all.length===0?<div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>등록된 포트폴리오가 없습니다.<br/>먼저 포트폴리오 메뉴에서 추가하세요.</div>
                :<div className="port-pick-grid" style={{maxHeight:'60vh',overflowY:'auto',padding:'4px 2px'}}>
                    {all.map(item=>(
                        <div key={item.id} className={`port-pick-card ${sel.includes(item.id)?'selected':''}`} onClick={()=>toggle(item)}>
                            {item.image_url?<img src={item.image_url} alt=""/>:<div className="port-pick-card-ph">🖼</div>}
                            <div className="port-pick-info">
                                {sel.includes(item.id)&&<span style={{color:'var(--green)',marginRight:4}}>✅</span>}
                                {item.title}
                            </div>
                        </div>
                    ))}
                </div>}
                <div className="modal-btns">
                    <button className="modal-cancel" onClick={onClose}>취소</button>
                    <button className="modal-ok" onClick={confirm}>{sel.length}개 선택 완료</button>
                </div>
            </div>
        </div>
    );
}

/* ═══════════════════════════════════════
   ★ 포트폴리오 관리
═══════════════════════════════════════ */
function PortfolioModal({sb, prodCats, initial, onClose, onSave}){
    const blank={title:'',description:'',image_url:'',categories:'[]'};
    const[form,setForm]=useState(()=>{
        if(!initial)return{...blank,_cats:[]};
        let cats=[];try{cats=typeof initial.categories==='string'?JSON.parse(initial.categories||'[]'):(initial.categories||[]);}catch{}
        return{...initial,_cats:cats};
    });
    const[uploading,setUploading]=useState(false);
    const set=(k,v)=>setForm(p=>({...p,[k]:v}));
    const toggleCat=id=>setForm(p=>({...p,_cats:p._cats.includes(id)?p._cats.filter(c=>c!==id):[...p._cats,id]}));
    const pickImg=async e=>{
        const f=e.target.files[0];if(!f)return;
        setUploading(true);
        try{const url=await uploadImg(sb,f,'portfolio');set('image_url',url);}
        finally{setUploading(false);}
    };
    const ok=()=>{
        if(!form.title.trim()){alert('제목을 입력하세요');return;}
        const{_cats,...rest}=form;
        onSave({...rest,categories:JSON.stringify(_cats)});
    };
    return(
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
                <div className="modal-header">
                    <div className="modal-title">{initial?'포트폴리오 수정':'포트폴리오 추가'}</div>
                    <button className="modal-close" onClick={onClose}>✕</button>
                </div>
                <div className="mf">
                    <label className="ml">이미지 *</label>
                    <label className="img-area" style={{display:'block',cursor:'pointer'}}>
                        {uploading?<div className="img-placeholder"><span>⏳</span>업로드 중...</div>
                        :form.image_url?<img src={form.image_url} alt="" style={{maxHeight:160,maxWidth:'100%',borderRadius:8,objectFit:'cover'}}/>
                        :<div className="img-placeholder"><span>📷</span>이미지 업로드</div>}
                        <input type="file" accept="image/*" style={{display:'none'}} onChange={pickImg}/>
                    </label>
                </div>
                <div className="mf"><label className="ml">제목 *</label><input className="mi" value={form.title} onChange={e=>set('title',e.target.value)} placeholder="작업명 입력"/></div>
                <div className="mf"><label className="ml">설명</label><input className="mi" value={form.description||''} onChange={e=>set('description',e.target.value)} placeholder="작업 설명 (선택)"/></div>
                <div className="mf">
                    <label className="ml">상품 분류 (해당 항목 체크)</label>
                    <div className="cat-check-grid">
                        {prodCats.map(c=>(
                            <label key={c.id} className={`cat-check-item ${form._cats.includes(c.id)?'checked':''}`} onClick={()=>toggleCat(c.id)}>
                                {form._cats.includes(c.id)?'✅':'⬜'} {c.name}
                            </label>
                        ))}
                        {prodCats.length===0&&<span style={{fontSize:12,color:'var(--muted)'}}>상품분류를 먼저 등록해 주세요.</span>}
                    </div>
                </div>
                <div className="modal-btns"><button className="modal-cancel" onClick={onClose}>취소</button><button className="modal-ok" onClick={ok}>저장</button></div>
            </div>
        </div>
    );
}

function Portfolio({sb, prodCats}){
    const[items,setItems]=useState([]);const[loading,setLoading]=useState(true);
    const[showModal,setShowModal]=useState(false);const[editing,setEditing]=useState(null);
    const[filterCat,setFilterCat]=useState(null);

    useEffect(()=>{
        if(!sb)return;
        sb.from('portfolios').select('*').order('created_at',{ascending:false})
          .then(({data})=>{if(data)setItems(data);setLoading(false);});
    },[sb]);

    const getCats=item=>{try{return typeof item.categories==='string'?JSON.parse(item.categories||'[]'):(item.categories||[]);}catch{return[];}};
    const catName=id=>prodCats.find(c=>c.id===id)?.name||'';

    const save=async form=>{
        setShowModal(false);setEditing(null);
        if(editing){
            const{data}=await sb.from('portfolios').update(form).eq('id',editing.id).select();
            if(data)setItems(p=>p.map(x=>x.id===editing.id?data[0]:x));
            toast('✅ 수정됨');
        }else{
            const{data}=await sb.from('portfolios').insert([form]).select();
            if(data)setItems(p=>[data[0],...p]);
            toast('✅ 추가됨');
        }
    };
    const del=async id=>{
        if(!confirm('삭제하시겠습니까?'))return;
        await sb.from('portfolios').delete().eq('id',id);
        setItems(p=>p.filter(x=>x.id!==id));
        toast('🗑 삭제됨');
    };

    const filtered=filterCat?items.filter(x=>getCats(x).includes(filterCat)):items;
    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;

    return(<div>
        {showModal&&<PortfolioModal sb={sb} prodCats={prodCats} initial={editing} onClose={()=>{setShowModal(false);setEditing(null);}} onSave={save}/>}
        <div className="page-header">
            <div className="page-title-wrap"><h1>🖼 포트폴리오</h1><p>작업 이미지 관리 · 견적서에 첨부 가능</p></div>
            <div className="btn-row"><button className="btn btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>＋ 포트폴리오 추가</button></div>
        </div>
        <div className="cat-filter">
            <div className={`cat-tab ${!filterCat?'active':''}`} onClick={()=>setFilterCat(null)}>전체 <span className="cnt">{items.length}</span></div>
            {prodCats.map(c=><div key={c.id} className={`cat-tab ${filterCat===c.id?'active':''}`} onClick={()=>setFilterCat(c.id)}>{c.name} <span className="cnt">{items.filter(x=>getCats(x).includes(c.id)).length}</span></div>)}
        </div>
        {filtered.length===0
            ?<div className="empty-state"><div className="empty-icon">🖼</div><div className="empty-text">포트폴리오가 없습니다.<br/>+ 포트폴리오 추가 버튼으로 시작하세요.</div></div>
            :<div className="port-grid">
                {filtered.map(item=>{
                    const cats=getCats(item);
                    return(<div key={item.id} className="port-card">
                        {item.image_url?<img src={item.image_url} className="port-card-img" alt=""/>:<div className="port-card-img-ph">🖼</div>}
                        <div className="port-card-body">
                            <div className="port-card-title">{item.title}</div>
                            <div className="port-card-cats">{cats.map(id=><span key={id} className="port-cat-tag">{catName(id)}</span>)}</div>
                            {item.description&&<div className="port-card-desc">{item.description}</div>}
                            <div className="port-card-actions">
                                {item.image_url&&<button className="btn btn-outline btn-sm" onClick={()=>{navigator.clipboard?.writeText(item.image_url).then(()=>toast('📋 링크 복사됨')).catch(()=>alert(item.image_url));}}>📋 링크복사</button>}
                                <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(item);setShowModal(true);}}>✏️</button>
                                <button className="btn btn-sm" style={{background:'#fee2e2',color:'var(--red)',border:'none'}} onClick={()=>del(item.id)}>🗑</button>
                            </div>
                        </div>
                    </div>);
                })}
            </div>}
    </div>);
}
