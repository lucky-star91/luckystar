/* ═══════════════════════════════════════
   ★ 공구 · 부자재 카드 (견적서 하단)
═══════════════════════════════════════ */
const PREP_TYPES=[{key:'tool',label:'공구',icon:'🔧'},{key:'supply',label:'부자재',icon:'📎'}];

function PrepCard({estPrep,setEstPrep,uid,items,cats}){
    const[showAdd,setShowAdd]=useState(false);
    const[nf,setNf]=useState({type:'tool',name:'',qty:1});
    const groupsOf=type=>{
        const g={};
        estPrep.filter(r=>r.type===type).forEach(r=>{
            const k=r.type+'|'+r.name;
            if(!g[k])g[k]={key:k,name:r.name,qty:0,rows:[]};
            g[k].qty=Math.max(g[k].qty,Number(r.qty)||0); // 여러 상품에 같은 공구·부자재가 있어도 1줄, 수량은 가장 큰 값
            g[k].rows.push(r);
        });
        return Object.values(g).map(x=>({...x,prods:collectProds(x.rows,items,cats)}));
    };
    // 수량을 고치면 같은 공구·부자재 행 모두 그 수량으로 (0이면 삭제)
    const setQty=(g,q)=>setEstPrep(prev=>prev.map(r=>(r.type+'|'+r.name)===g.key?{...r,qty:q}:r).filter(r=>!((r.type+'|'+r.name)===g.key&&!(Number(r.qty)>0))));
    const del=g=>setEstPrep(prev=>prev.filter(r=>(r.type+'|'+r.name)!==g.key));
    const add=()=>{
        const name=nf.name.trim();
        if(!name){alert('이름을 입력하세요');return;}
        setEstPrep(p=>[...p,{id:uid(),type:nf.type,name,qty:Number(nf.qty)||1,itemId:null,itemName:'',checked:false}]);
        setNf(p=>({...p,name:'',qty:1}));
    };
    return(
        <div className="card">
            <div className="card-title">🧰 공구 · 부자재
                <span style={{fontSize:11,color:'var(--muted)',fontWeight:400,marginLeft:6}}>(상품 담을 때 자동 포함 · 시공 체크리스트에 출력)</span>
            </div>
            {PREP_TYPES.map(t=>{
                const list=groupsOf(t.key);
                return(<div key={t.key} style={{marginBottom:14}}>
                    <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1.5,textTransform:'uppercase',marginBottom:8}}>{t.icon} {t.label} ({list.length})</div>
                    {list.length===0
                        ?<p style={{fontSize:12,color:'var(--muted)'}}>항목이 없습니다.</p>
                        :<div className="table-wrap"><table style={{minWidth:520}}>
                            <thead><tr><th style={{textAlign:'left'}}>{t.label}명</th><th style={{textAlign:'left'}}>상품분류</th><th style={{textAlign:'left'}}>상품명</th><th className="tr" style={{width:100}}>수량</th><th style={{width:36}}></th></tr></thead>
                            <tbody>{list.map(g=>(
                                <tr key={g.key}>
                                    <td style={{fontWeight:700}}>{g.name}</td>
                                    {prodTds(g.prods)}
                                    <td className="tr" style={{padding:'4px 8px'}}>
                                        <input type="number" min="0" value={g.qty} onChange={e=>setQty(g,Number(e.target.value)||0)}
                                            style={{width:70,padding:'5px 8px',border:'1.5px solid var(--border)',borderRadius:6,fontSize:14,fontWeight:800,textAlign:'right'}}/>
                                    </td>
                                    <td style={{textAlign:'center'}}><button className="btn-icon" onClick={()=>del(g)}>✕</button></td>
                                </tr>
                            ))}</tbody>
                        </table></div>}
                </div>);
            })}
            {!showAdd
                ?<button className="btn btn-outline btn-sm" onClick={()=>setShowAdd(true)}>＋ 공구/부자재 직접 추가</button>
                :<div style={{background:'var(--bg)',borderRadius:10,padding:12}}>
                    <div style={{display:'grid',gridTemplateColumns:'110px minmax(0,2fr) 70px',gap:8,marginBottom:8}}>
                        <div><label className="ml">구분</label>
                            <select className="mi" value={nf.type} onChange={e=>setNf(p=>({...p,type:e.target.value}))}>
                                {PREP_TYPES.map(t=><option key={t.key} value={t.key}>{t.label}</option>)}
                            </select></div>
                        <div><label className="ml">이름</label><input className="mi" value={nf.name} autoFocus placeholder="이름 입력" onChange={e=>setNf(p=>({...p,name:e.target.value}))} onKeyDown={e=>{if(e.key==='Enter')add();}}/></div>
                        <div><label className="ml">수량</label><input className="mi" type="number" min="1" value={nf.qty} style={{textAlign:'right'}} onChange={e=>setNf(p=>({...p,qty:e.target.value}))}/></div>
                    </div>
                    <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                        <button className="btn btn-outline btn-sm" onClick={()=>setShowAdd(false)}>닫기</button>
                        <button className="btn btn-primary btn-sm" onClick={add}>추가</button>
                    </div>
                </div>}
        </div>
    );
}

/* ═══════════════════════════════════════
   ★ 시공 체크리스트 (필요자재 · 공구 · 부자재 + 체크 + 인쇄)
═══════════════════════════════════════ */
function ChecklistPage({sb,estimateId,onNavigate}){
    const[est,setEst]=useState(null);
    const[mats,setMats]=useState([]);
    const[prep,setPrep]=useState([]);
    const[loading,setLoading]=useState(true);

    useEffect(()=>{
        if(!sb||!estimateId){setLoading(false);return;}
        (async()=>{
            const{data}=await sb.from('estimates').select('*').eq('id',estimateId).single();
            if(data){setEst(data);setMats(parseJSON(data.est_materials,[]));setPrep(parseJSON(data.est_prep,[]));}
            setLoading(false);
        })();
    },[sb,estimateId]);

    const persist=async(col,rows)=>{
        const{error}=await sb.from('estimates').update({[col]:JSON.stringify(rows)}).eq('id',estimateId);
        if(error)toast('저장 실패: '+error.message);
    };
    const matKey=r=>r.material_id||r.name;
    const prepKey=r=>r.type+'|'+r.name;
    // 자재는 합산, 공구·부자재(once)는 같은 이름 1줄·가장 큰 수량
    const group=(rows,keyFn,once)=>{
        const g={};
        rows.forEach(r=>{const k=keyFn(r);if(!k)return;if(!g[k])g[k]={key:k,name:r.name,qty:0,rows:[]};g[k].qty=once?Math.max(g[k].qty,Number(r.qty)||0):Math.round((g[k].qty+(Number(r.qty)||0))*10)/10;g[k].rows.push(r);});
        return Object.values(g).filter(x=>x.qty>0);
    };
    const isOn=g=>g.rows.every(r=>r.checked);

    const sections=[
        {title:'📦 필요 자재',groups:group(mats,matKey),toggle:g=>{const v=!isOn(g);const next=mats.map(r=>matKey(r)===g.key?{...r,checked:v}:r);setMats(next);persist('est_materials',next);},reset:()=>{const n=mats.map(r=>({...r,checked:false}));setMats(n);persist('est_materials',n);}},
        {title:'🔧 공구',groups:group(prep.filter(r=>r.type==='tool'),prepKey,true),toggle:g=>{const v=!isOn(g);const next=prep.map(r=>prepKey(r)===g.key?{...r,checked:v}:r);setPrep(next);persist('est_prep',next);},reset:()=>{const n=prep.map(r=>r.type==='tool'?{...r,checked:false}:r);setPrep(n);persist('est_prep',n);}},
        {title:'📎 부자재',groups:group(prep.filter(r=>r.type==='supply'),prepKey,true),toggle:g=>{const v=!isOn(g);const next=prep.map(r=>prepKey(r)===g.key?{...r,checked:v}:r);setPrep(next);persist('est_prep',next);},reset:()=>{const n=prep.map(r=>r.type==='supply'?{...r,checked:false}:r);setPrep(n);persist('est_prep',n);}},
    ];
    const total=sections.reduce((s,x)=>s+x.groups.length,0);
    const done=sections.reduce((s,x)=>s+x.groups.filter(isOn).length,0);

    const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const printList=()=>{
        const blocks=sections.map(sec=>`<h3>${sec.title} (${sec.groups.length})</h3>
            ${sec.groups.length===0?'<p class="none">항목 없음</p>':`<table><tbody>${sec.groups.map(g=>`<tr><td class="ck"><span class="box">${isOn(g)?'✓':''}</span></td><td>${esc(g.name)}</td><td class="q">× ${g.qty}</td></tr>`).join('')}</tbody></table>`}`).join('');
        const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>시공 체크리스트</title>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
        <style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Noto Sans KR',sans-serif;padding:28px;color:#1e293b;font-size:14px;}
        h1{font-size:22px;font-weight:900;color:#0f1923;margin-bottom:4px;}.sub{font-size:12px;color:#64748b;margin-bottom:14px;}
        .info{background:#f4f6fa;border-radius:8px;padding:12px 16px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;}
        .info b{color:#475569;margin-right:6px;}
        h3{font-size:14px;font-weight:900;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid #0f1923;}
        table{width:100%;border-collapse:collapse;}td{padding:8px 6px;border-bottom:1px solid #e2e8f0;font-size:14px;}
        td.ck{width:38px;text-align:center;}td.q{width:80px;text-align:right;font-weight:700;}
        .box{display:inline-block;width:20px;height:20px;border:2px solid #0f1923;border-radius:4px;line-height:16px;text-align:center;font-weight:900;font-size:15px;}
        .none{font-size:12px;color:#94a3b8;padding:6px 0;}
        .ft{text-align:center;margin-top:18px;font-size:11px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:8px;}
        @media print{body{padding:14px;}}</style></head><body>
        <h1>시공 준비 체크리스트</h1><div class="sub">럭키스타 캠핑카라반 · 견적번호 ${esc(est?.est_no||'')} · 출력일 ${new Date().toLocaleDateString('ko-KR')}</div>
        <div class="info"><div><b>고객명</b>${esc(est?.client_name||'-')}</div><div><b>연락처</b>${esc(est?.client_phone||'-')}</div>
        <div><b>주소</b>${esc(est?.client_address||'-')}</div><div><b>담당자</b>${esc(est?.client_manager||'-')}</div></div>
        ${blocks}
        <div class="ft">★ 럭키스타 캠핑카라반 | 경기도 파주시 광탄면</div>
        <script>window.onload=()=>{window.print();}<\/script></body></html>`;
        const w=window.open('','_blank','width=800,height=900');
        if(w){w.document.write(html);w.document.close();}
    };

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    if(!est)return<div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">견적서를 찾을 수 없습니다.<br/><button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={()=>onNavigate('est-list')}>목록으로</button></div></div>;

    return(<div>
        <div className="page-header">
            <div className="page-title-wrap"><h1>✅ 시공 체크리스트</h1>
                <p>{est.client_name||'고객'} · {est.est_no||''} · 체크하면 바로 저장됩니다</p></div>
            <div className="btn-row no-print">
                <button className="btn btn-outline" onClick={()=>onNavigate('est-edit',estimateId)}>← 견적서</button>
                <button className="btn btn-outline" onClick={()=>onNavigate('est-list')}>목록</button>
                <button className="btn btn-primary" onClick={printList}>🖨 체크리스트 인쇄</button>
            </div>
        </div>
        <div className="est-badge">
            <div><div className="est-badge-label">준비 현황</div><span className="est-badge-num">{done} / {total}</span></div>
            <div className="est-badge-sep"/>
            <div style={{color:'rgba(255,255,255,.7)',fontSize:13}}>{total>0&&done===total?'🎉 모두 준비 완료!':'준비 중'}</div>
        </div>
        {sections.map(sec=>{
            const n=sec.groups.filter(isOn).length;
            return(<div className="card" key={sec.title}>
                <div className="card-title">{sec.title} <span style={{fontWeight:400,color:'var(--muted)',textTransform:'none'}}>({n}/{sec.groups.length})</span>
                    {sec.groups.length>0&&<button className="btn btn-outline btn-xs no-print" style={{marginLeft:8}} onClick={sec.reset}>전체 해제</button>}</div>
                {sec.groups.length===0
                    ?<p style={{fontSize:12,color:'var(--muted)'}}>항목이 없습니다.</p>
                    :sec.groups.map(g=>{const on=isOn(g);return(
                        <label key={g.key} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 4px',borderBottom:'1px solid var(--border)',cursor:'pointer'}}>
                            <input type="checkbox" className="status-check" style={{width:22,height:22}} checked={on} onChange={()=>sec.toggle(g)}/>
                            <span style={{flex:1,fontWeight:700,fontSize:14,textDecoration:on?'line-through':'none',color:on?'var(--muted)':'var(--navy)'}}>{g.name}</span>
                            <span style={{fontFamily:'Bebas Neue,sans-serif',fontSize:18,letterSpacing:1,color:'var(--navy)'}}>× {g.qty}</span>
                        </label>);})}
            </div>);
        })}
    </div>);
}

/* ═══════════════════════════════════════
   ★ 공구 / 부자재 관리
═══════════════════════════════════════ */
function ToolModal({sb,toolCats,initial,onClose,onSave}){
    const blank={category_id:'',name:'',specification:'',category_extra:'',memo:'',image_url:''};
    const[form,setForm]=useState(initial?{...blank,...initial}:blank);
    const set=(k,v)=>setForm(p=>({...p,[k]:v}));
    const ok=()=>{
        if(!(form.name||'').trim()){alert('품명을 입력하세요');return;}
        onSave({category_id:form.category_id||null,name:form.name.trim(),specification:form.specification||'',category_extra:form.category_extra||'',memo:form.memo||'',image_url:form.image_url||''});
    };
    return(<div className="modal-overlay" onClick={onClose}>
        <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><div className="modal-title">{initial?'공구/부자재 수정':'새 공구/부자재 등록'}</div><button className="modal-close" onClick={onClose}>✕</button></div>
            <div className="mf"><label className="ml">사진</label><ImgUpload sb={sb} folder="tools" value={form.image_url} onChange={v=>set('image_url',v)}/></div>
            <div className="modal-grid">
                <div className="mf"><label className="ml">분류</label>
                    <select className="mi" value={form.category_id||''} onChange={e=>set('category_id',e.target.value)}>
                        <option value="">분류 선택</option>
                        {toolCats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select></div>
                <div className="mf"><label className="ml">품명 *</label><input className="mi" value={form.name||''} onChange={e=>set('name',e.target.value)} placeholder="품명 입력" autoFocus/></div>
                <div className="mf"><label className="ml">규격/재질</label><input className="mi" value={form.specification||''} onChange={e=>set('specification',e.target.value)} placeholder="규격 입력"/></div>
                <div className="mf"><label className="ml">기타구분</label><input className="mi" value={form.category_extra||''} onChange={e=>set('category_extra',e.target.value)} placeholder="예: 전동, 소모품"/></div>
                <div className="mf full"><label className="ml">메모</label><input className="mi" value={form.memo||''} onChange={e=>set('memo',e.target.value)} placeholder="기타 메모"/></div>
            </div>
            <div className="modal-btns"><button className="modal-cancel" onClick={onClose}>취소</button><button className="modal-ok" onClick={ok}>저장</button></div>
        </div>
    </div>);
}

function ToolList({sb,toolCats,onAddToolCat,initialCatId}){
    const[tools,setTools]=useState([]);const[loading,setLoading]=useState(true);
    const[dbErr,setDbErr]=useState('');
    const[activeCat,setActiveCat]=useState(initialCatId||null);
    const[showModal,setShowModal]=useState(false);const[editing,setEditing]=useState(null);
    const[search,setSearch]=useState('');

    useEffect(()=>{setActiveCat(initialCatId||null);},[initialCatId]);
    useEffect(()=>{
        if(!sb)return;
        sb.from('tools').select('*').order('name',{ascending:true}).then(({data,error})=>{
            if(error)setDbErr(error.message);else if(data)setTools(data);
            setLoading(false);
        });
    },[sb]);

    const fail=e=>alert('저장 실패: '+e.message+(/relation|does not exist|schema cache/.test(e.message)?'\n\nSupabase SQL Editor에서 아래를 실행하세요:\n\n'+SQL_TOOLS:''));
    const save=async form=>{
        if(editing){
            const{data,error}=await sb.from('tools').update(form).eq('id',editing.id).select();
            if(error){fail(error);return;}
            if(data)setTools(p=>p.map(x=>x.id===editing.id?data[0]:x).sort((a,b)=>a.name.localeCompare(b.name,'ko')));
            toast('✅ 수정됨');
        }else{
            const{data,error}=await sb.from('tools').insert([form]).select();
            if(error){fail(error);return;}
            if(data)setTools(p=>[...p,data[0]].sort((a,b)=>a.name.localeCompare(b.name,'ko')));
            toast('✅ 등록됨');
        }
        setShowModal(false);setEditing(null);
    };
    const del=async id=>{if(!confirm('삭제?'))return;await sb.from('tools').delete().eq('id',id);setTools(p=>p.filter(x=>x.id!==id));toast('🗑 삭제됨');};
    const catName=id=>toolCats.find(c=>c.id===id)?.name||'미분류';
    const q=search.toLowerCase();
    const filtered=tools
        .filter(x=>!activeCat||x.category_id===activeCat)
        .filter(x=>!q||(x.name||'').toLowerCase().includes(q)||(x.specification||'').toLowerCase().includes(q)||(x.category_extra||'').toLowerCase().includes(q)||(x.memo||'').toLowerCase().includes(q));

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    if(dbErr)return(<div>
        <div className="page-header"><div className="page-title-wrap"><h1>🧰 공구/부자재 관리</h1><p>DB 테이블 설정이 필요합니다</p></div></div>
        <div className="card">
            <div className="card-title">⚙️ 먼저 한 번만 실행하세요</div>
            <p style={{fontSize:13,color:'var(--muted)',marginBottom:10}}>Supabase → SQL Editor에 아래 내용을 붙여넣고 실행한 뒤 새로고침하세요.</p>
            <pre style={{background:'var(--bg)',borderRadius:8,padding:14,fontSize:12,overflowX:'auto',whiteSpace:'pre-wrap'}}>{SQL_TOOLS}</pre>
            <button className="btn btn-outline btn-sm" style={{marginTop:10}} onClick={()=>{navigator.clipboard?.writeText(SQL_TOOLS).then(()=>toast('📋 SQL 복사됨')).catch(()=>alert(SQL_TOOLS));}}>📋 SQL 복사</button>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:10}}>오류 내용: {dbErr}</div>
        </div>
    </div>);

    return(<div>
        {showModal&&<ToolModal sb={sb} toolCats={toolCats} initial={editing} onClose={()=>{setShowModal(false);setEditing(null);}} onSave={save}/>}

/* ── 📌 오늘 할 일(오늘 일정) · 📅 1주일 할 일(내일부터 7일 안 일정 + 연락할 일) · 💰 잔금 미입금 — 견적 목록·일정표 공용 ── */
function TodoPanels({estimates,st,onEdit}){
    const[open,setOpen]=useState(true);
    const now=new Date(),today=ymd(now);
    const weekEnd=ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()+7)); // 오늘부터 7일 뒤까지
    const todayList=[],weekList=[],unpaid=[];
    const sched=(e,kind,d,detail)=>{const k=ymd(new Date(d));if(k===today)todayList.push([e,kind,detail]);else if(k>today&&k<=weekEnd)weekList.push([e,kind,fmtDT(d).split(' ').slice(0,2).join(' ')+' '+(detail||''),new Date(d)]);};
    estimates.forEach(e=>{
        const i=estStageInfo(e,st.holdDays,st.delayDays);if(i.lost||i.deleted)return;
        if(i.sd['방문상담 및 실측']&&!i.sc['방문상담 및 실측'])sched(e,'🏠 방문',i.sd['방문상담 및 실측'],fmtDT(i.sd['방문상담 및 실측']).split(' ').slice(2).join(' '));
        if(i.sd['제작시작']&&!i.sc['설치완료']){const s0=new Date(String(i.sd['제작시작']).slice(0,10)+'T09:00'),days=prodDays(i.sd)||1;
            for(let k=0;k<days;k++)sched(e,days>1?'🔨 설치·공사':'🎉 설치',new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+k,9),days>1?`${k+1}/${days}일`:'');}
        pendingExtras(e).forEach(v=>sched(e,'🔧 '+v.type,v.at,v.reason||''));
        // 연락·처리할 일은 1주일 할 일에
        if(i.delayed)weekList.push([e,'⚠ 본견적 지연','방문 '+fmtD(i.sd['방문상담 및 실측'])]);
        if(!i.hold&&(i.stage==='가견적발송'||i.stage==='본견적발송')&&Number(st.holdDays)>0){
            const left=Math.ceil((lastSentAt(i.sd)+Number(st.holdDays)*86400000-Date.now())/86400000);
            if(left>=0&&left<=5)weekList.push([e,'⏳ 곧 보류',left+'일 남음 · 연락 필요']);
        }
        if(i.stage==='설치완료')unpaid.push([e,'💰 잔금',fmt(Math.max(0,(Number(e.total_amount)||0)-(Number(e.deposit_amount)||0)-(Number(e.mid_amount)||0)))+'원']);
    });
    weekList.sort((a,b)=>(a[3]||Infinity)-(b[3]||Infinity));
    return(<>
        <div style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',marginBottom:6}} onClick={()=>setOpen(o=>!o)}>
            <b style={{fontSize:13,color:'var(--navy)'}}>할 일</b><span style={{fontSize:11,color:'var(--muted)'}}>{open?'▲ 접기':'▼ 펼치기'}</span></div>
        {open&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:12,marginBottom:14}}>
            {[['📌 오늘 할 일','#b45309','#fffbeb','#fcd34d',todayList,'오늘 일정이 없습니다'],
              ['📅 1주일 할 일','#1d4ed8','#eff6ff','#bfdbfe',weekList,'앞으로 7일 안 일정·연락할 일이 없습니다'],
              ['💰 잔금 미입금','#b91c1c','#fef2f2','#fecaca',unpaid,'잔금 미입금 견적이 없습니다']].map(([title,color,bg,bd,list,empty])=>(
            <div key={title} style={{background:bg,border:'1.5px solid '+bd,borderRadius:12,padding:'10px 14px'}}>
                <b style={{color}}>{title} {list.length>0&&<span>{list.length}건</span>}</b>
                <div style={{display:'flex',flexDirection:'column',gap:4,marginTop:6,maxHeight:220,overflowY:'auto'}}>
                    {list.length===0?<span style={{fontSize:12,color:'var(--muted)'}}>{empty}</span>
                    :list.map(([e,kind,detail],i)=><div key={i} style={{display:'flex',gap:8,alignItems:'baseline',fontSize:13,cursor:'pointer',flexWrap:'wrap'}} onClick={()=>onEdit(e.id)}>
                        <span style={{fontWeight:800,whiteSpace:'nowrap'}}>{kind}</span><span style={{fontWeight:700,color:'var(--blue)'}}>{e.client_name||'고객'}</span><span style={{color:'var(--muted)',fontSize:12}}>{detail}</span></div>)}
                </div>
            </div>))}
        </div>}
    </>);
}

function EstimateList({sb,onEdit,onNew,onChecklist,isAdmin}){
    const[estimates,setEstimates]=useState([]);
    const[loading,setLoading]=useState(true);
    const[statusFilter,setStatusFilter]=useState(null);
    const[payFilter,setPayFilter]=useState(null);
    const[q,setQ]=useState('');
    const[st,setSt]=useState(SETTINGS_DEFAULT);
    const[sortKey,setSortKey]=useState('created'); // created · amount · name · status
    const[period,setPeriod]=useState('all');       // all · thisMonth · lastMonth · custom
    const[range,setRange]=useState({from:'',to:''});
    const[delDlg,setDelDlg]=useState(null);        // 삭제 버튼을 누른 견적 (실주 처리 / 휴지통 선택)
    const[lostReason,setLostReason]=useState(LOST_REASONS[0]);

    useEffect(()=>{
        if(!sb)return;
        (async()=>{
            setLoading(true);
            const{data}=await sb.from('estimates').select('*').order('created_at',{ascending:false});
            let rows=data||[];
            // 휴지통에서 30일이 지난 견적은 관리자가 목록을 열 때 영구 삭제
            if(isAdmin){
                const old=rows.filter(e=>{const d=parseJSON(e.meta,{}).deletedAt;return d&&Date.now()-new Date(d).getTime()>30*86400000;});
                if(old.length){await sb.from('estimates').delete().in('id',old.map(e=>e.id));rows=rows.filter(e=>!old.includes(e));toast('🗑 휴지통에서 30일 지난 견적 '+old.length+'건을 영구 삭제했습니다');}
            }
            setEstimates(rows);setLoading(false);
        })();
        loadSettings(sb).then(setSt);
    },[sb]);

    const info=Object.fromEntries(estimates.map(e=>[e.id,estStageInfo(e,st.holdDays,st.delayDays)]));
    const live=estimates.filter(e=>!info[e.id].deleted);
    const labels=Object.fromEntries(estimates.map(e=>[e.id,info[e.id].label]));
    const hasExtra=e=>pendingExtras(e).length>0;

    // 견적 meta 고치기 (실주·휴지통): DB와 화면 모두
    const patchMeta=async(est,fn)=>{
        const m=fn(parseJSON(est.meta,{}));
        const{error}=await prepSafe(p=>sb.from('estimates').update(p).eq('id',est.id),{meta:JSON.stringify(m)});
        if(error){alert('저장 실패: '+error.message);return false;}
        setEstimates(p=>p.map(e=>e.id===est.id?{...e,meta:JSON.stringify(m)}:e));return true;
    };
    // 이 견적으로 재고를 차감했다면 되돌릴지 물어봄 (실주·휴지통 이동 시)
    const revertStockOf=async(est,m)=>{
        const s=m.stock;if(!(s&&s.done&&(s.lines||[]).length))return m;
        if(!confirm('이 견적으로 차감한 재고('+s.lines.length+'종)를 되돌릴까요?'))return m;
        for(const l of s.lines)await adjustStock(sb,{materialId:l.material_id,delta:l.qty,estimateId:est.id,reason:'차감 되돌리기',memo:(est.est_no||'')+' '+(est.client_name||'')});
        toast('↩ 재고 차감을 되돌렸습니다');return{...m,stock:{done:false,revertedAt:new Date().toISOString()}};
    };
    const markLost=async est=>{const m0=await revertStockOf(est,parseJSON(est.meta,{}));if(await patchMeta(est,()=>({...m0,lost:{reason:lostReason,memo:'',at:new Date().toISOString()}})))toast('❌ 실주 처리됨');setDelDlg(null);};
    const toTrash=async est=>{const m0=await revertStockOf(est,parseJSON(est.meta,{}));if(await patchMeta(est,()=>({...m0,deletedAt:new Date().toISOString()})))toast('🗑 휴지통으로 이동 (30일 뒤 영구 삭제)');setDelDlg(null);};
    const restore=async est=>{if(await patchMeta(est,m=>{const{deletedAt,...r}=m;return r;}))toast('↩ 복구됨');};
    const purge=async est=>{
        if(!confirm('['+(est.client_name||'고객')+'] 견적을 영구 삭제합니다. 되돌릴 수 없습니다.\n삭제하시겠습니까?'))return;
        await sb.from('estimates').delete().eq('id',est.id);setEstimates(p=>p.filter(e=>e.id!==est.id));toast('🗑 영구 삭제됨');
    };

    // ── 기간 필터 (작성일 기준) ──
    const now=new Date();
    const pr=period==='thisMonth'?[new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,1)]
        :period==='lastMonth'?[new Date(now.getFullYear(),now.getMonth()-1,1),new Date(now.getFullYear(),now.getMonth(),1)]
        :period==='custom'?[range.from?new Date(range.from):null,range.to?new Date(new Date(range.to).getTime()+86400000):null]:[null,null];
    const inPeriod=e=>{const c=new Date(e.created_at);return(!pr[0]||c>=pr[0])&&(!pr[1]||c<pr[1]);};

    const STATUS_DASH=['가견적발송','방문상담 및 실측','본견적발송','제작중','설치완료','보류','실주','추가방문'];
    const PAY_DASH=['입금전','계약'];
    const sCount=s=>s==='추가방문'?live.filter(hasExtra).length:live.filter(e=>labels[e.id]===s).length;
    const pCount=p=>live.filter(e=>(e.payment_status||'입금전')===p).length;
    const STATUS_DASH_STYLE={...Object.fromEntries(STATUS_DASH.map(s=>[s,{color:STATUS_COLOR[s],bg:STATUS_BG[s]}])),'추가방문':{color:EXTRA_TYPES['AS'].color,bg:EXTRA_TYPES['AS'].bg}};
    const DASH_TEXT={...STATUS_TEXT,'추가방문':'추가 방문 예정'};const DASH_ICON={...STATUS_ICON,'추가방문':'🔧'};
    const PAY_STYLE={'입금전':{color:'#b91c1c',bg:'#fee2e2'},'계약':{color:'#854d0e',bg:'#fef9c3'}};

    // 검색: 고객명·연락처·주소·견적번호 (검색 중에는 보류·실주 견적도 표시)
    const qs=q.trim().toLowerCase();const qd=qs.replace(/[^0-9]/g,'');
    const matchQ=e=>!qs||[e.client_name,e.client_address,e.est_no].some(v=>(v||'').toLowerCase().includes(qs))||(qd.length>=3&&(e.client_phone||'').replace(/[^0-9]/g,'').includes(qd));
    const trashMode=statusFilter==='휴지통';
    const filtered=(trashMode?estimates.filter(e=>info[e.id].deleted):live).filter(e=>{
        if(trashMode)return matchQ(e);
        if(statusFilter==='추가방문'){if(!hasExtra(e))return false;}
        else if(statusFilter&&labels[e.id]!==statusFilter)return false;
        if(!statusFilter&&!qs&&(labels[e.id]==='보류'||labels[e.id]==='실주'))return false; // 보류·실주는 기본으로 숨김
        if(payFilter&&(e.payment_status||'입금전')!==payFilter)return false;
        if(!inPeriod(e))return false;
        return matchQ(e);
    });
    const ORDER=['작성중','가견적발송','방문상담 및 실측','본견적발송','제작중','설치완료','완료','보류','실주'];
    const sorted=[...filtered].sort((a,b)=>sortKey==='amount'?(Number(b.total_supply)||0)-(Number(a.total_supply)||0)
        :sortKey==='name'?String(a.client_name||'').localeCompare(String(b.client_name||''),'ko')
        :sortKey==='status'?ORDER.indexOf(labels[a.id])-ORDER.indexOf(labels[b.id])
        :new Date(b.created_at)-new Date(a.created_at));
    const sumSupply=filtered.reduce((s,e)=>s+(Number(e.total_supply)||0),0),sumTotal=filtered.reduce((s,e)=>s+(Number(e.total_amount)||0),0);
    const hiddenCnt=!statusFilter&&!qs?live.filter(e=>inPeriod(e)&&(labels[e.id]==='보류'||labels[e.id]==='실주')).length:0;
    // 기간 안에 작성된 견적 기준 — 본견적발송률: 가견적 보낸 것 중 본견적까지 간 비율 · 계약률: 본견적 보낸 것 중 계약(계약금 입금)된 비율
    const periodLive=live.filter(inPeriod);
    const isWon=e=>['제작중','설치완료','완료'].includes(info[e.id].stage);
    const gaSent=periodLive.filter(e=>info[e.id].sd['가견적발송']);
    const gaToBon=gaSent.filter(e=>info[e.id].sd['본견적발송']);
    const bonRate=gaSent.length?Math.round(gaToBon.length/gaSent.length*100):0;
    const sent=periodLive.filter(e=>info[e.id].sd['본견적발송']);
    const won=sent.filter(isWon);
    const rate=sent.length?Math.round(won.length/sent.length*100):0;
    const periodName=period==='all'?'전체 기간':period==='thisMonth'?'이번 달':period==='lastMonth'?'지난 달':'선택 기간';

    const toggleSF=s=>setStatusFilter(p=>p===s?null:s);
    const togglePF=p=>setPayFilter(p2=>p2===p?null:p);
    const resetAll=()=>{setStatusFilter(null);setPayFilter(null);setQ('');setPeriod('all');};

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;

    const sel={border:'1.5px solid var(--border)',borderRadius:8,padding:'8px 10px',fontSize:13,fontFamily:"'Noto Sans KR',sans-serif",background:'#fff'};
    return(<div>
        {delDlg&&<div className="modal-overlay" onClick={()=>setDelDlg(null)}>
            <div className="modal-box sm" onClick={e=>e.stopPropagation()}>
                <div className="modal-header"><div className="modal-title">🗑 {delDlg.client_name||'고객'} 견적 삭제</div><button className="modal-close" onClick={()=>setDelDlg(null)}>✕</button></div>
                <div style={{fontSize:13,lineHeight:1.7,marginBottom:12}}>삭제하면 견적 기록이 사라져 계약률 등을 확인할 수 없습니다.<br/><b>고객이 진행하지 않기로 했다면 '실주 처리'를 권장합니다.</b></div>
                <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:12}}>
                    <span style={{fontSize:12,fontWeight:700}}>실주 사유</span>
                    <select style={sel} value={lostReason} onChange={e=>setLostReason(e.target.value)}>{LOST_REASONS.map(r=><option key={r}>{r}</option>)}</select>
                </div>
                <div className="modal-btns">
                    <button className="modal-cancel" onClick={()=>setDelDlg(null)}>취소</button>
                    {isAdmin&&<button className="modal-cancel" style={{color:'var(--red)'}} onClick={()=>toTrash(delDlg)}>🗑 휴지통으로 이동</button>}
                    <button className="modal-ok" style={{background:'#b91c1c'}} onClick={()=>markLost(delDlg)}>❌ 실주 처리</button>
                </div>
                {!isAdmin&&<div style={{fontSize:11,color:'var(--muted)',marginTop:8}}>견적 삭제(휴지통 이동)는 관리자만 할 수 있습니다.</div>}
            </div>
        </div>}
        <div className="page-header">
            <div className="page-title-wrap"><h1>📂 견적 목록</h1><p>카드 클릭으로 필터링 · 진행 상태는 견적서에서 자동으로 바뀝니다</p></div>
            <div className="btn-row"><button className="btn btn-primary" onClick={onNew}>＋ 새 견적서</button></div>
        </div>

        <TodoPanels estimates={live} st={st} onEdit={onEdit}/>

        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:16,flexWrap:'wrap'}}>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 고객명 · 연락처 · 주소 · 견적번호 검색 (보류·실주 포함)"
                style={{flex:1,minWidth:220,maxWidth:420,border:'1.5px solid var(--border)',borderRadius:8,padding:'10px 14px',fontSize:13,fontFamily:"'Noto Sans KR',sans-serif",outline:'none',background:'#fff'}}/>
            {q&&<button className="btn btn-outline btn-sm" onClick={()=>setQ('')}>✕ 지우기</button>}
            <select style={sel} value={period} onChange={e=>setPeriod(e.target.value)} title="작성일 기준 기간">
                <option value="all">전체 기간</option><option value="thisMonth">이번 달</option><option value="lastMonth">지난 달</option><option value="custom">기간 직접 선택</option></select>
            {period==='custom'&&<><input type="date" style={sel} value={range.from} onChange={e=>setRange(r=>({...r,from:e.target.value}))}/><span>~</span><input type="date" style={sel} value={range.to} onChange={e=>setRange(r=>({...r,to:e.target.value}))}/></>}
            <select style={sel} value={sortKey} onChange={e=>setSortKey(e.target.value)} title="정렬">
                <option value="created">작성일 최신순</option><option value="amount">금액 큰 순</option><option value="name">고객명 순</option><option value="status">진행 단계 순</option></select>
        </div>

        <div className="dash-section-title">진행상태</div>
        <div className="dash-grid" style={{marginBottom:10}}>
            {STATUS_DASH.map(s=>{
                const sty=STATUS_DASH_STYLE[s]||{};const isActive=statusFilter===s;
                return(<div key={s} className={`dash-card ${isActive?'active':''}`}
                    style={{color:sty.color,background:isActive?sty.bg:'#fff',borderColor:isActive?sty.color:'var(--border)'}}
                    onClick={()=>toggleSF(s)}>
                    <div className="dash-card-num">{sCount(s)}</div>
                    <div className="dash-card-label">{DASH_ICON[s]} {DASH_TEXT[s]||s}</div>
                </div>);
            })}
            {isAdmin&&<div className={`dash-card ${trashMode?'active':''}`} style={{color:'#6b7280',background:trashMode?'#f3f4f6':'#fff',borderColor:trashMode?'#6b7280':'var(--border)'}} onClick={()=>toggleSF('휴지통')}>
                <div className="dash-card-num">{estimates.length-live.length}</div><div className="dash-card-label">🗑 휴지통</div></div>}
        </div>

        <div className="dash-section-title" style={{marginTop:4}}>결제상태 · 계약률</div>
        <div className="dash-grid" style={{gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',marginBottom:18}}>
            {PAY_DASH.map(p=>{
                const sty=PAY_STYLE[p]||{};const isActive=payFilter===p;
                return(<div key={p} className={`dash-card ${isActive?'active':''}`}
                    style={{color:sty.color,background:isActive?sty.bg:'#fff',borderColor:isActive?sty.color:'var(--border)'}}
                    onClick={()=>togglePF(p)}>
                    <div className="dash-card-type">결제상태</div>
                    <div className="dash-card-num">{pCount(p)}</div>
                    <div className="dash-card-label">{p==='입금전'?'⏳':'📝'} {p}</div>
                </div>);
            })}
            <div className="dash-card" style={{color:'#1d4ed8',cursor:'default'}} title="선택한 기간에 작성된 견적 중 가견적을 보낸 견적 대비 본견적까지 보낸 견적 비율">
                <div className="dash-card-type">본견적발송률 ({periodName})</div>
                <div className="dash-card-num">{bonRate}%</div>
                <div className="dash-card-label">본견적 {gaToBon.length} / 가견적 {gaSent.length}</div>
            </div>
            <div className="dash-card" style={{color:'#15803d',cursor:'default'}} title="선택한 기간에 작성된 견적 중 본견적을 보낸 견적 대비 계약(계약금 입금)된 견적 비율">
                <div className="dash-card-type">계약률 ({periodName})</div>
                <div className="dash-card-num">{rate}%</div>
                <div className="dash-card-label">계약 {won.length} / 본견적 {sent.length}</div>
            </div>
        </div>

        {(statusFilter||payFilter||period!=='all')&&(
            <div className="filter-active-bar">
                <span>🔍 필터:</span>
                {statusFilter&&<span style={{color:STATUS_DASH_STYLE[statusFilter]?.color||'var(--navy)',fontWeight:800}}>{trashMode?'🗑 휴지통':(DASH_ICON[statusFilter]+' '+(DASH_TEXT[statusFilter]||statusFilter))}</span>}
                {payFilter&&<span style={{color:PAY_STYLE[payFilter]?.color,fontWeight:800}}>{payFilter}</span>}
                {period!=='all'&&<span style={{fontWeight:800}}>{period==='thisMonth'?'이번 달':period==='lastMonth'?'지난 달':(range.from||'…')+' ~ '+(range.to||'…')}</span>}
                <span style={{marginLeft:'auto',color:'var(--muted)',fontSize:11}}>{filtered.length}건</span>
                <button onClick={()=>{setStatusFilter(null);setPayFilter(null);setPeriod('all');}}>✕</button>
            </div>
        )}

        {hiddenCnt>0&&<div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>⏸ 보류·❌ 실주 견적 {hiddenCnt}건은 숨겨져 있습니다 — 위의 '보류'·'실주' 카드를 누르거나 검색하면 볼 수 있습니다.</div>}
        {trashMode&&<div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>🗑 휴지통의 견적은 30일이 지나면 영구 삭제됩니다. 복구하면 원래대로 목록에 나옵니다.</div>}
        {estimates.length===0
            ?<div className="empty-state"><div className="empty-icon">📂</div><div className="empty-text">저장된 견적서가 없습니다.</div></div>
            :filtered.length===0
            ?<div className="empty-state"><div className="empty-icon">🔍</div><div className="empty-text">해당 조건의 견적서가 없습니다.<br/><button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={resetAll}>필터 초기화</button></div></div>
            :<div className="est-list-wrap" style={{overflowX:'auto'}}><table style={{minWidth:600}}>
                <thead><tr>
                    <th style={{textAlign:'left'}}>견적번호</th>
                    <th style={{textAlign:'left'}}>고객명</th>
                    <th style={{textAlign:'left'}}>연락처</th>
                    <th className="tr">공급가액(원)</th>
                    <th style={{textAlign:'left',minWidth:180}}>진행상태</th>
                    <th style={{textAlign:'left'}}>결제</th>
                    <th style={{textAlign:'left'}}>작성일</th>
                    <th className="tc" style={{width:110}}>관리</th>
                </tr></thead>
                <tbody>
                    {sorted.map(est=>{
                        const ps=est.payment_status||'입금전';
                        const pst=PAY_STYLE[ps]||{};const i=info[est.id];
                        return(<tr key={est.id} style={trashMode?{opacity:.75}:undefined}>
                            <td><div className="est-no">{est.est_no||est.id?.substr(0,8).toUpperCase()}</div></td>
                            <td><div className="est-client" title="견적서 수정" style={{cursor:'pointer',color:'var(--blue)',textDecoration:'underline',textUnderlineOffset:3}} onClick={()=>onEdit(est.id)}>{est.client_name||'-'}</div></td>
                            <td style={{fontSize:12}}>{est.client_phone?<a href={'tel:'+est.client_phone.replace(/[^0-9+]/g,'')} title="전화 걸기" style={{color:'var(--blue)',textDecoration:'none',fontWeight:600,whiteSpace:'nowrap'}}>📞 {est.client_phone}</a>:<span style={{color:'var(--muted)'}}>-</span>}</td>
                            <td className="tr"><div className="est-amount">{fmt(est.total_supply||0)}</div></td>
                            <td><StatusBadge status={labels[est.id]}/>
                                {i.delayed&&<span className="status-badge" style={{marginLeft:4,background:'#fef3c7',color:'#b45309'}}>⚠ 본견적 지연</span>}
                                {i.lost&&i.meta.lost.reason&&<span style={{marginLeft:4,fontSize:11,color:'#b91c1c'}}>({i.meta.lost.reason})</span>}
                                {pendingExtras(est).map(v=>{const tp=EXTRA_TYPES[v.type]||EXTRA_TYPES['기타'];return<span key={v.id} className="status-badge" title={v.reason||''} style={{marginLeft:4,background:tp.bg,color:tp.color}}>{tp.icon} {v.type} {fmtDT(v.at).split(' ').slice(0,2).join(' ')}</span>;})}</td>
                            <td><span style={{fontSize:11,fontWeight:700,color:pst.color,background:pst.bg,padding:'2px 8px',borderRadius:10,whiteSpace:'nowrap'}}>{ps==='입금전'?'⏳':ps==='계약'?'📝':'✅'} {ps}</span></td>
                            <td style={{fontSize:12,color:'var(--muted)'}}>{est.created_at?new Date(est.created_at).toLocaleDateString('ko-KR'):'-'}</td>
                            <td className="tc" style={{whiteSpace:'nowrap'}}>
                                {trashMode?<>
                                    <button className="btn btn-outline btn-xs" onClick={()=>restore(est)}>↩ 복구</button>
                                    <button className="btn-icon" title="영구 삭제" onClick={()=>purge(est)}>🗑</button>
                                </>:<>
                                    {onChecklist&&<button className="btn-icon" title="시공 체크리스트" onClick={()=>onChecklist(est.id)}>✅</button>}
                                    <button className="btn-icon" onClick={()=>onEdit(est.id)}>✏️</button>
                                    <button className="btn-icon" title="삭제 / 실주 처리" onClick={()=>{setLostReason(LOST_REASONS[0]);setDelDlg(est);}}>🗑</button>
                                </>}
                            </td>
                        </tr>);
                    })}
                </tbody>
                <tfoot><tr style={{background:'#f8faff',borderTop:'2px solid var(--border)'}}>
                    <td colSpan={3} style={{fontSize:12,fontWeight:700,color:'var(--muted)'}}>합계 ({filtered.length}건)</td>
                    <td className="tr" style={{fontWeight:900,color:'var(--navy)'}}>{fmt(sumSupply)}</td>
                    <td colSpan={4} style={{fontSize:12,color:'var(--muted)'}}>VAT 포함 <b style={{color:'var(--navy)'}}>{fmt(sumTotal)}</b>원</td>
                </tr></tfoot>
            </table></div>}
    </div>);
}


/* ═══════════════════════════════════════
   ★ 일정표
═══════════════════════════════════════ */
// 일정표에는 현장에 가야 하는 예정만 표시: 방문상담·실측 예정, 설치·공사 일정
const PROD_STYLE={color:'#7c2d12',bg:'#fed7aa'}; // 며칠 걸리는 설치·공사 색 (기간 동안 매일 같은 색)
const SCHED_MAP={'방문상담 및 실측':{label:'🏠 방문상담',color:'#c2410c',bg:'#ffedd5'}};
const INSTALL_STYLE={color:'#15803d',bg:'#dcfce7'}; // 하루 설치 (설치·공사 시작=완료)

function Schedule({sb,view,onSetView,onEditEst}){
    const[base,setBase]=useState(new Date());
    const[estimates,setEstimates]=useState([]);
    const[loading,setLoading]=useState(true);
    const[popup,setPopup]=useState(null);
    const[popItems,setPopItems]=useState(null); // 팝업 견적의 상품 목록 (null = 불러오는 중)
    const[popExtra,setPopExtra]=useState(null); // 추가 방문 일정을 눌렀을 때 그 방문 정보
    const[selDay,setSelDay]=useState(()=>new Date()); // 달력에서 고른 날 → 달력 아래에 그날 일정 목록
    const[st,setSt]=useState(SETTINGS_DEFAULT);

    // 팝업을 열면 해당 견적의 상품 목록을 불러옴
    useEffect(()=>{
        if(!popup){setPopItems(null);return;}
        let alive=true;
        (async()=>{
            const{data:cd}=await sb.from('est_cats').select('*').eq('estimate_id',popup.id).order('display_order');
            const cs=cd||[];let its=[];
            if(cs.length){const{data:idt}=await sb.from('est_items').select('*').in('cat_id',cs.map(c=>c.id)).order('display_order');its=idt||[];}
            if(alive)setPopItems(cs.map(c=>({name:c.name,items:its.filter(i=>i.cat_id===c.id)})).filter(c=>c.items.length));
        })();
        return()=>{alive=false;};
    },[popup]);

    useEffect(()=>{
        if(!sb)return;
        (async()=>{setLoading(true);const{data}=await sb.from('estimates').select('*').order('created_at',{ascending:false});if(data)setEstimates(data);setLoading(false);})();
        loadSettings(sb).then(setSt);
    },[sb]);

    const getEvents=()=>{
        const evts=[];
        estimates.forEach(est=>{
            const{sd,sc,lost,deleted,stage}=estStageInfo(est,0);
            if(lost||deleted)return; // 실주·휴지통 견적은 일정에서 제외
            // 설치·공사: 하루 작업은 '설치' 하나, 며칠 걸리는 공사는 시작~완료 매일 같은 색으로 표시 (설치함 체크된 견적은 제외)
            if(sd['제작시작']&&!sc['설치완료']&&stage!=='완료'){
                const s0=new Date(String(sd['제작시작']).slice(0,10)+'T00:00'),days=prodDays(sd)||1;
                for(let k=0;k<days;k++){
                    const d=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+k,8,0);
                    evts.push({date:d,label:days>1?`🔨 설치·공사 ${k+1}/${days}일`:'🎉 설치',color:(days>1?PROD_STYLE:INSTALL_STYLE).color,bg:(days>1?PROD_STYLE:INSTALL_STYLE).bg,span:days>1?(k===0?'start':k===days-1?'end':'mid'):null,
                        clientName:est.client_name||'고객',time:days>1?(k===0?'시작':k===days-1?'완료':''):'당일',est});
                }
            }
            // 예정일이 입력되면 바로 표시 · 방문함/설치함 체크된(끝난) 일정은 표시하지 않음
            Object.keys(SCHED_MAP).forEach(key=>{
                if(!sd[key]||sc[key])return;
                const info=SCHED_MAP[key];const d=new Date(sd[key]);
                if(!isNaN(d))evts.push({date:d,label:info.label,color:info.color,bg:info.bg,clientName:est.client_name||'고객',time:d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),est});
            });
            // 추가 방문 (AS · 추가 설치) — 방문함 체크 전까지 표시
            pendingExtras(est).forEach(v=>{
                const tp=EXTRA_TYPES[v.type]||EXTRA_TYPES['기타'];const d=new Date(v.at);
                if(!isNaN(d))evts.push({date:d,label:tp.icon+' '+v.type,color:tp.color,bg:tp.bg,clientName:est.client_name||'고객',time:d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),est,extra:v});
            });
        });
        return evts;
    };

    const events=getEvents();
    const forDay=d=>events.filter(e=>e.date.getFullYear()===d.getFullYear()&&e.date.getMonth()===d.getMonth()&&e.date.getDate()===d.getDate()).sort((a,b)=>a.date-b.date);

    // 달력 칸에는 최소 정보만: 아이콘 + 고객명 한 줄 (자세한 내용은 날짜를 누르면 달력 아래 목록에)
    const MAX_CHIPS=3;
    const EventChip=({ev})=>(<div className="cal-event cal-mini" title={ev.label+' · '+ev.clientName+(ev.time?' · '+ev.time:'')}
        style={{background:ev.bg,color:ev.color,...(ev.span?{borderLeft:ev.span==="start"?"4px solid "+ev.color:"none",borderRight:ev.span==="end"?"4px solid "+ev.color:"none",fontWeight:700}:{})}}>
        <span className="cal-ico">{String(ev.label).split(' ')[0]} </span>{ev.clientName}
    </div>);
    const CellEvents=({evts})=>(<>{evts.slice(0,MAX_CHIPS).map((ev,j)=><EventChip key={j} ev={ev}/>)}
        {evts.length>MAX_CHIPS&&<div className="cal-more">외 {evts.length-MAX_CHIPS}건</div>}</>);
    const isSel=day=>day.toDateString()===selDay.toDateString();
    // 고른 날의 일정 목록 (달력 아래) — 시간·종류·고객·주소·연락처·사유와 바로가기 버튼
    const DayList=()=>{
        const evts=forDay(selDay);
        return(<div className="card" style={{marginTop:14}}>
            <div className="card-title">📋 {selDay.getMonth()+1}월 {selDay.getDate()}일({WEEK[selDay.getDay()]}) 일정 {evts.length}건</div>
            {evts.length===0?<div style={{fontSize:13,color:'var(--muted)'}}>이날 일정이 없습니다. 달력에서 다른 날짜를 눌러 보세요.</div>
            :<div style={{display:'flex',flexDirection:'column'}}>{evts.map((ev,i)=>{const e=ev.est;const tel=(e.client_phone||'').replace(/[^0-9+]/g,'');return(
                <div key={i} style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
                    <span style={{fontWeight:800,minWidth:64,fontSize:13}}>{ev.time||''}</span>
                    <span className="status-badge" style={{background:ev.bg,color:ev.color}}>{ev.label}</span>
                    <div style={{flex:1,minWidth:200}}>
                        <div style={{fontWeight:800,color:'var(--navy)'}}>{ev.clientName}{e.est_no&&<span style={{fontWeight:400,fontSize:11,color:'var(--muted)',marginLeft:6}}>{e.est_no}</span>}</div>
                        <div style={{fontSize:12,color:'var(--text)'}}>{e.client_address||'주소 없음'}{ev.extra&&ev.extra.reason?' · 사유: '+ev.extra.reason:''}</div>
                    </div>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                        {tel&&<a className="btn btn-outline btn-xs" href={'tel:'+tel} style={{textDecoration:'none'}}>📞 전화</a>}
                        {e.client_address&&<button className="nav-btn" onClick={()=>openTmap(e.client_address)}>🗺T맵</button>}
                        {e.client_address&&<button className="nav-btn" style={{background:'var(--green)'}} onClick={()=>window.open('https://map.kakao.com/?q='+encodeURIComponent(e.client_address),'_blank')}>🗺카카오</button>}
                        <button className="btn btn-outline btn-xs" onClick={()=>{setPopExtra(ev.extra||null);setPopup(e);}}>📋 상세</button>
                        <button className="btn btn-primary btn-xs" onClick={()=>onEditEst(e.id)}>✏️ 견적서</button>
                    </div>
                </div>);})}</div>}
        </div>);
    };

    const DAY_NAMES=['월','화','수','목','금','토','일'];

    const renderBiweek=()=>{
        const today=new Date(base);const dow=today.getDay();const mon=new Date(today);mon.setDate(today.getDate()-(dow===0?6:dow-1));
        const days=Array.from({length:14},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
        return(<div className="biweek-wrap">
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,minmax(0,1fr))'}}>
                {DAY_NAMES.map((d,i)=><div key={i} className={`biweek-hd ${i>=5?'weekend':''}`}>{d}</div>)}
            </div>
            <div className="biweek-grid">
                {days.map((day,i)=>{const isToday=day.toDateString()===new Date().toDateString();const evts=forDay(day);return(
                    <div key={i} className={`biweek-cell ${isToday?'today':''} ${i%7>=5?'weekend':''} ${isSel(day)?'cal-sel':''}`} onClick={()=>setSelDay(day)}>
                        <div className="biweek-date">{day.getDate()}</div>
                        <CellEvents evts={evts}/>
                    </div>);})}
            </div>
        </div>);
    };

    const renderMonth=()=>{
        const y=base.getFullYear(),m=base.getMonth();const first=new Date(y,m,1);
        const start=new Date(first);const fd=first.getDay();start.setDate(first.getDate()-(fd===0?6:fd-1));
        const days=[];const d=new Date(start);const last=new Date(y,m+1,0);
        while(d<=last||days.length%7!==0){days.push(new Date(d));d.setDate(d.getDate()+1);if(days.length>42)break;}
        return(<div className="month-wrap">
            <div className="month-grid">
                {DAY_NAMES.map((d,i)=><div key={i} className={`month-hd ${i>=5?'weekend':''}`}>{d}</div>)}
                {days.map((day,i)=>{const isToday=day.toDateString()===new Date().toDateString();const other=day.getMonth()!==m;const evts=forDay(day);return(
                    <div key={i} className={`month-cell ${isToday?'today':''} ${other?'other-month':''} ${i%7>=5?'weekend':''} ${isSel(day)?'cal-sel':''}`} onClick={()=>setSelDay(day)}>
                        <div className="month-date">{day.getDate()}</div>
                        <CellEvents evts={evts}/>
                    </div>);})}
            </div>
        </div>);
    };

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;

    return(<div>
        {popup&&(<div className="modal-overlay" onClick={()=>setPopup(null)}>
            <div className="modal-box sm" onClick={e=>e.stopPropagation()}>
                <div className="modal-header"><div className="modal-title">📋 {popup.client_name||'고객'} 견적서</div><button className="modal-close" onClick={()=>setPopup(null)}>✕</button></div>
                {(()=>{
                    const tel=(popup.client_phone||'').replace(/[^0-9+]/g,'');const mtel=(popup.manager_phone||'').replace(/[^0-9+]/g,'');
                    const telA=(t,label)=>t?<a href={'tel:'+t} style={{color:'var(--blue)',fontWeight:700,textDecoration:'none'}}>📞 {label}</a>:'-';
                    const row=(l,v)=><div key={l} style={{display:'flex',gap:12,fontSize:13,alignItems:'baseline'}}>
                        <span style={{color:'var(--muted)',fontWeight:700,minWidth:64,fontSize:11,flexShrink:0}}>{l}</span>
                        <span style={{fontWeight:600,color:'var(--navy)',minWidth:0}}>{v}</span></div>;
                    return(<div style={{display:'flex',flexDirection:'column',gap:10,padding:'4px 0 8px',maxHeight:'65vh',overflowY:'auto'}}>
                        <div style={{display:'flex',alignItems:'center',gap:8}}><StatusBadge status={estStageInfo(popup,0).stage}/><span style={{fontSize:12,color:'var(--muted)'}}>{popup.est_no}</span></div>
                        {popExtra&&(()=>{const tp=EXTRA_TYPES[popExtra.type]||EXTRA_TYPES['기타'];return(
                            <div style={{border:'1.5px solid '+tp.color,background:tp.bg,borderRadius:10,padding:'8px 12px',fontSize:13}}>
                                <div style={{fontWeight:800,color:tp.color}}>{tp.icon} {popExtra.type} 방문 · {fmtDT(popExtra.at)}{popExtra.dur?` · ⏱ ${durText(popExtra.dur)}`:''}</div>
                                <div style={{marginTop:2,color:'var(--navy)',fontWeight:600}}>사유: {popExtra.reason||'-'}</div>
                            </div>);})()}                        <div style={{border:'1.5px solid var(--border)',borderRadius:10,padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
                            <div style={{fontSize:11,fontWeight:700,color:'var(--blue)'}}>고객 정보</div>
                            {row('고객명',popup.client_name||'-')}
                            {row('연락처',telA(tel,popup.client_phone))}
                            {row('주소',popup.client_address||'-')}
                            {popup.client_address&&<div style={{display:'flex',gap:6}}>
                                <button className="nav-btn" onClick={()=>openTmap(popup.client_address)}>🗺T맵 길안내</button>
                                <button className="nav-btn" style={{background:'var(--green)'}} onClick={()=>window.open('https://map.kakao.com/?q='+encodeURIComponent(popup.client_address),'_blank')}>🗺카카오 길안내</button>
                            </div>}
                        </div>
                        <div style={{border:'1.5px solid #f6dc9c',background:'#fff8e6',borderRadius:10,padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
                            <div style={{fontSize:11,fontWeight:700,color:'#b07800'}}>👤 담당자 정보</div>
                            {row('담당자',popup.client_manager||'-')}
                            {row('연락처',telA(mtel,popup.manager_phone))}
                        </div>
                        <div style={{border:'1.5px solid var(--border)',borderRadius:10,padding:'10px 12px'}}>
                            <div style={{fontSize:11,fontWeight:700,color:'var(--blue)',marginBottom:6}}>🛍 상품 목록</div>
                            {popItems===null?<div style={{fontSize:12,color:'var(--muted)'}}>불러오는 중...</div>
                            :popItems.length===0?<div style={{fontSize:12,color:'var(--muted)'}}>등록된 상품이 없습니다.</div>
                            :popItems.map(c=><div key={c.name} style={{marginBottom:6}}>
                                <div style={{fontSize:11,fontWeight:700,color:'var(--muted)'}}>{c.name}</div>
                                {c.items.map(i=><div key={i.id} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:13,padding:'2px 0'}}>
                                    <span style={{fontWeight:600,color:'var(--navy)'}}>{i.name}{i.specification?<span style={{fontWeight:400,color:'var(--muted)',fontSize:12}}> · {i.specification}</span>:''}</span>
                                    <span style={{fontWeight:700,whiteSpace:'nowrap'}}>× {i.quantity}</span></div>)}
                            </div>)}
                            <div style={{borderTop:'1px solid var(--border)',marginTop:6,paddingTop:6,display:'flex',justifyContent:'space-between',fontSize:13}}>
                                <span style={{color:'var(--muted)',fontWeight:700,fontSize:11}}>공급가액 · 결제</span>
                                <span style={{fontWeight:700}}>{fmt(popup.total_supply||0)}원 · {popup.payment_status||'입금전'}</span></div>
                        </div>
                    </div>);
                })()}
                <div className="modal-btns">
                    <button className="modal-cancel" onClick={()=>setPopup(null)}>닫기</button>
                    <button className="modal-ok" onClick={()=>{setPopup(null);onEditEst(popup.id);}}>✏️ 견적서 수정</button>
                </div>
            </div>
        </div>)}

        <div className="page-header">
            <div className="page-title-wrap"><h1>📅 일정표</h1><p>견적 진행 일정 · 이벤트 클릭 시 견적서 열기</p></div>
            <div className="btn-row">
                <button className={`btn ${view==='biweek'?'btn-primary':'btn-outline'}`} onClick={()=>onSetView('biweek')}>2주간</button>
                <button className={`btn ${view==='month'?'btn-primary':'btn-outline'}`} onClick={()=>onSetView('month')}>월간</button>
                <button className="btn btn-outline" onClick={()=>setBase(new Date())}>오늘</button>
            </div>
        </div>

        <TodoPanels estimates={estimates} st={st} onEdit={onEditEst}/>

        <div className="cal-legend" style={{marginBottom:12}}>
            {Object.values(SCHED_MAP).map(info=>(<span key={info.label} className="cal-legend-item" style={{background:info.bg,color:info.color}}>● {info.label}</span>))}
            <span className="cal-legend-item" style={{background:INSTALL_STYLE.bg,color:INSTALL_STYLE.color}}>🎉 설치</span>
            <span className="cal-legend-item" style={{background:PROD_STYLE.bg,color:PROD_STYLE.color}}>🔨 설치·공사(기간)</span>
            {Object.entries(EXTRA_TYPES).map(([t,tp])=>(<span key={t} className="cal-legend-item" style={{background:tp.bg,color:tp.color}}>{tp.icon} {t}</span>))}
            <span style={{fontSize:11,color:'var(--muted)',alignSelf:'center'}}>※ 방문상담·설치·공사·추가 방문 예정 표시 (며칠 걸리는 공사는 기간 동안 같은 색) · 방문함/설치함 체크된 일정은 숨김</span>
        </div>

        <div className="cal-header" style={{marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',gap:0,flex:1,justifyContent:'center'}}>
                <button className="cal-nav" style={{borderRadius:'8px 0 0 8px',borderRight:'none'}}
                    onClick={()=>{const d=new Date(base);view==='biweek'?d.setDate(d.getDate()-14):d.setMonth(d.getMonth()-1);setBase(d);}}>◀</button>
                <span className="cal-title" style={{padding:'0 20px',background:'#fff',border:'1.5px solid var(--border)',height:38,display:'flex',alignItems:'center',fontSize:16}}>
                    {view==='biweek'?(()=>{const d=new Date(base);const dow=d.getDay();d.setDate(d.getDate()-(dow===0?6:dow-1));const e=new Date(d);e.setDate(d.getDate()+13);return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric'})+' ~ '+e.toLocaleDateString('ko-KR',{month:'long',day:'numeric'});})():base.getFullYear()+'년 '+(base.getMonth()+1)+'월'}
                </span>
                <button className="cal-nav" style={{borderRadius:'0 8px 8px 0',borderLeft:'none'}}
                    onClick={()=>{const d=new Date(base);view==='biweek'?d.setDate(d.getDate()+14):d.setMonth(d.getMonth()+1);setBase(d);}}>▶</button>
            </div>
        </div>
        {view==='biweek'?renderBiweek():renderMonth()}
        <DayList/>
    </div>);
}

/* ═══════════════════════════════════════
   ★ 환경설정 (상호 · 견적서 공통내용)
═══════════════════════════════════════ */
/* ★ 카카오톡 할 일 알림 — 매일 아침 9시 서버 함수(supabase/functions/kakao)가 선택한 직원에게 '친구에게 보내기'로 발송
   보내는 계정(사장님)이 카카오 로그인하면 토큰은 kakao_sender 표에 저장(화면에서는 못 읽음). 받는 직원은 카카오 개발자 앱 팀원 + 한 번 '알림 받기 동의' + 서로 카톡 친구 */
const KAKAO_REST_KEY='2dc628e1327819fb2a62692f92f8112e';
let _kakaoCbDone=false; // 카카오 로그인 코드는 한 번만 쓸 수 있음
function KakaoNotify({sb,cb}){
    const[me,setMe]=useState('');
    const[stt,setStt]=useState(undefined); // 서버 함수 상태 (undefined=불러오는 중, null=함수 없음/오류)
    const[err,setErr]=useState('');
    const[cfg,setCfg]=useState({recipients:[],sendToMe:true,enabled:true});
    const[members,setMembers]=useState([]);
    const[friends,setFriends]=useState(null);
    const[busy,setBusy]=useState('');
    const[preview,setPreview]=useState(null);
    const redirectUri=()=>window.location.origin+'/kakao-callback';
    const call=async(action,extra)=>{
        const{data,error}=await sb.functions.invoke('kakao',{body:{action,...(extra||{})}});
        if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error;}catch(e){}throw new Error(m);}
        if(data&&data.error)throw new Error(data.error);
        return data;
    };
    const load=async()=>{
        try{setStt(await call('status'));setErr('');}catch(e){setStt(null);setErr(e.message);}
        const{data}=await sb.from('app_settings').select('value').eq('key','kakao_notify').maybeSingle();
        if(data)setCfg(c=>({...c,...parseJSON(data.value,{})}));
        const{data:mm}=await sb.from('kakao_members').select('*').order('updated_at',{ascending:false});setMembers(mm||[]);
    };
    useEffect(()=>{
        if(!sb)return;
        sb.auth.getUser().then(({data})=>setMe((data&&data.user&&data.user.email)||''));
        (async()=>{
            if(cb&&!_kakaoCbDone){
                _kakaoCbDone=true;
                const saved=sessionStorage.getItem('kakao_state');sessionStorage.removeItem('kakao_state');
                if(cb.err)alert('카카오 연결 실패: '+cb.err);
                else if(!saved||saved!==cb.state)alert('카카오 연결 확인값이 맞지 않습니다. 다시 시도해 주세요.');
                else{
                    setBusy('exchange');
                    try{const r=await call('exchange',{code:cb.code,redirect_uri:redirectUri(),role:String(cb.state).split(':')[0]});
                        toast(r.role==='sender'?'✅ 보내는 계정 연결됨: '+r.nickname:'✅ 알림 받기 동의 완료: '+r.nickname);}
                    catch(e){alert('카카오 연결 실패: '+e.message);}
                    setBusy('');
                }
            }
            load();
        })();
    },[sb]);
    const connect=role=>{
        const state=role+':'+Math.random().toString(36).slice(2);
        sessionStorage.setItem('kakao_state',state);
        window.location.href='https://kauth.kakao.com/oauth/authorize?response_type=code&client_id='+KAKAO_REST_KEY+'&redirect_uri='+encodeURIComponent(redirectUri())+'&scope=talk_message,friends&state='+encodeURIComponent(state);
    };
    const loadFriends=async()=>{setBusy('friends');try{setFriends((await call('friends')).friends||[]);}catch(e){alert('친구 목록 불러오기 실패: '+e.message);}setBusy('');};
    const toggleR=f=>setCfg(c=>{const has=(c.recipients||[]).some(r=>r.uuid===f.uuid);return{...c,recipients:has?c.recipients.filter(r=>r.uuid!==f.uuid):[...(c.recipients||[]),{uuid:f.uuid,nickname:f.nickname}]};});
    const saveCfg=async()=>{
        const{data}=await sb.from('app_settings').select('value').eq('key','kakao_notify').maybeSingle(); // 서버가 적은 마지막 발송 기록은 유지
        const v={...parseJSON(data&&data.value,{}),recipients:cfg.recipients||[],sendToMe:!!cfg.sendToMe,enabled:cfg.enabled!==false};
        const{error}=await sb.from('app_settings').upsert({key:'kakao_notify',value:JSON.stringify(v),updated_at:new Date().toISOString()});
        if(error){alert('저장 실패: '+error.message);return;}toast('✅ 카카오 알림 설정 저장됨');
    };
    const doPreview=async()=>{setBusy('preview');try{setPreview((await call('preview')).messages||[]);}catch(e){alert('미리보기 실패: '+e.message);}setBusy('');};
    const doTest=async()=>{
        if(!window.confirm('지금 할 일 요약을 선택한 직원에게 카카오톡으로 보낼까요?\n(먼저 💾 알림 설정 저장을 눌러야 바뀐 받는 사람이 반영됩니다)'))return;
        setBusy('test');
        try{const r=await call('test');setPreview(r.messages||[]);
            alert('발송 완료: 메시지 '+(r.messages||[]).length+'개 → 직원 '+r.sentTo+'명'+(r.sendToMe?' + 나에게':'')+(r.fails&&r.fails.length?'\n\n일부 실패: '+r.fails.join('\n'):''));load();}
        catch(e){alert('발송 실패: '+e.message);}
        setBusy('');
    };
    const isAdmin=me===ADMIN_EMAIL;
    const s=stt&&stt.sender;
    const leftDays=s&&s.refresh_expires_at?Math.floor((new Date(s.refresh_expires_at)-Date.now())/86400000):null;
    const sel=(cfg.recipients||[]);
    return(<div className="card"><div className="card-title">💬 카카오톡 할 일 알림</div>
        <div style={{fontSize:12,color:'var(--muted)',marginBottom:10,lineHeight:1.7}}>매일 아침 9시에 오늘·1주일 할 일과 잔금 미입금을 선택한 직원에게 카카오톡으로 보냅니다 (PC가 꺼져 있어도 발송).<br/>받는 직원은 ① 카카오 개발자 앱 팀원 ② 아래 '알림 받기 동의' 한 번 ③ 보내는 계정과 카톡 친구여야 합니다.</div>
        {busy==='exchange'&&<div style={{fontWeight:700,color:'var(--blue)',marginBottom:8}}>⏳ 카카오 연결 중...</div>}
        {stt===undefined?<div style={{fontSize:13,color:'var(--muted)'}}>불러오는 중...</div>
        :stt===null?<div style={{fontSize:13,color:'var(--red)'}}>⚠ 알림 서버 함수에 연결할 수 없습니다 ({err}). 서버 함수(kakao)가 아직 설치되지 않았을 수 있습니다.</div>
        :<>
            {!stt.secretSet&&<div style={{fontSize:13,color:'var(--red)',marginBottom:8}}>⚠ Supabase 서버 함수 비밀값 KAKAO_CLIENT_SECRET 이 아직 없습니다.</div>}
            {!stt.cronSet&&<div style={{fontSize:13,color:'#b45309',marginBottom:8}}>⚠ 매일 9시 자동 발송 설정(CRON_SECRET)이 아직 없습니다. 테스트 발송은 됩니다.</div>}
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:8}}>
                <b style={{fontSize:13}}>보내는 계정</b>
                {s?<span style={{fontSize:13}}>{s.nickname} <span style={{color:'var(--muted)',fontSize:12}}>· 로그인 만료 {fmtD(s.refresh_expires_at)}{leftDays!==null&&leftDays<14&&<b style={{color:'var(--red)'}}> ({leftDays}일 남음 — 다시 연결해 주세요)</b>}</span></span>
                  :<span style={{fontSize:13,color:'var(--muted)'}}>연결 안 됨</span>}
                {isAdmin&&<button className="btn btn-outline btn-sm" disabled={!!busy} onClick={()=>connect('sender')}>{s?'🔄 다시 연결':'🔗 보내는 카카오 계정 연결'}</button>}
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
                <b style={{fontSize:13}}>알림 받기 동의</b>
                <span style={{fontSize:13}}>{members.length?members.map(m=>m.nickname).join(', '):<span style={{color:'var(--muted)'}}>아직 없음</span>}</span>
                <button className="btn btn-outline btn-sm" disabled={!!busy} onClick={()=>connect('member')}>🙋 내 카카오로 알림 받기 동의</button>
            </div>
            <div style={{borderTop:'1px solid var(--border)',paddingTop:10}}>
                <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:6}}>
                    <b style={{fontSize:13}}>받는 직원</b>
                    <span style={{fontSize:13}}>{sel.length?sel.map(r=>r.nickname).join(', '):<span style={{color:'var(--muted)'}}>선택 안 됨</span>}</span>
                    <button className="btn btn-outline btn-sm" disabled={!!busy||!s} onClick={loadFriends}>{busy==='friends'?'⏳ 불러오는 중':'👥 친구 목록에서 고르기'}</button>
                </div>
                {friends&&(friends.length===0?<div style={{fontSize:12,color:'var(--muted)',marginBottom:6}}>고를 수 있는 친구가 없습니다. 직원이 '알림 받기 동의'를 했는지, 보내는 계정과 카톡 친구인지 확인해 주세요.</div>
                  :<div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>{friends.map(f=>{const on=sel.some(r=>r.uuid===f.uuid);return(
                    <label key={f.uuid} style={{display:'flex',alignItems:'center',gap:5,border:'1.5px solid '+(on?'var(--blue)':'var(--border)'),background:on?'#eff6ff':'#fff',borderRadius:20,padding:'4px 10px',fontSize:13,cursor:'pointer'}}>
                        <input type="checkbox" checked={on} onChange={()=>toggleR(f)}/>{f.img&&<img src={f.img} alt="" style={{width:20,height:20,borderRadius:'50%'}}/>}{f.nickname}</label>);})}</div>)}
                <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,margin:'4px 0'}}><input type="checkbox" checked={!!cfg.sendToMe} onChange={e=>setCfg(c=>({...c,sendToMe:e.target.checked}))}/>보내는 계정(나)에게도 보내기</label>
                <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,margin:'4px 0'}}><input type="checkbox" checked={cfg.enabled!==false} onChange={e=>setCfg(c=>({...c,enabled:e.target.checked}))}/>매일 아침 9시 자동 발송</label>
                {cfg.lastSent&&<div style={{fontSize:12,color:'var(--muted)'}}>마지막 발송 {fmtDT(cfg.lastSent)}{cfg.lastError&&<span style={{color:'var(--red)'}}> · 일부 실패: {cfg.lastError}</span>}</div>}
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
                    <button className="btn btn-primary btn-sm" disabled={!!busy} onClick={saveCfg}>💾 알림 설정 저장</button>
                    <button className="btn btn-outline btn-sm" disabled={!!busy} onClick={doPreview}>{busy==='preview'?'⏳':'👀'} 메시지 미리보기</button>
                    <button className="btn btn-outline btn-sm" disabled={!!busy||!s} onClick={doTest}>{busy==='test'?'⏳ 보내는 중':'📤 지금 테스트 발송'}</button>
                </div>
                {preview&&<div style={{marginTop:8,display:'flex',flexDirection:'column',gap:6}}>{preview.map((m,i)=><pre key={i} style={{background:'#fef9c3',border:'1px solid #fde68a',borderRadius:8,padding:10,fontSize:12,whiteSpace:'pre-wrap',margin:0}}>{m}</pre>)}</div>}
            </div>
        </>}
    </div>);
}

function SettingsPage({sb,kakaoCb}){

    const[saving,setSaving]=useState(false);
    useEffect(()=>{if(sb)loadSettings(sb).then(setSt);},[sb]);
    const upd=(k,v)=>setSt(p=>({...p,[k]:v}));
    const save=async()=>{
        setSaving(true);
        const{_error,...v}=st;
        const{error}=await sb.from('app_settings').upsert({key:'estimate',value:JSON.stringify(v),updated_at:new Date().toISOString()});
        setSaving(false);
        if(error){alert('저장 실패: '+error.message+'\n\nSupabase SQL Editor에서 아래를 실행하세요:\n\n'+SQL_SETTINGS);return;}
        setSt(v);toast('✅ 환경설정 저장됨');
    };
    if(!st)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    const ta={width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'10px 14px',fontSize:13,fontFamily:"'Noto Sans KR',sans-serif",lineHeight:1.6,outline:'none',resize:'vertical'};
    return(<div style={{maxWidth:860}}>
        <div className="page-header">
            <div className="page-title-wrap"><h1>🔧 환경설정</h1><p>견적서 인쇄에 들어가는 상호·공통 문구와 진행 상태 설정을 관리합니다</p></div>
            <div className="btn-row"><button className="btn btn-primary" disabled={saving} onClick={save}>{saving?'저장 중...':'💾 저장'}</button></div>
        </div>
        {st._error&&<div className="card" style={{borderColor:'#fca5a5',background:'#fef2f2'}}>
            <div style={{fontWeight:700,color:'var(--red)',marginBottom:8}}>⚠️ 설정 테이블이 아직 없습니다 — Supabase SQL Editor에서 아래를 한 번 실행하세요</div>
            <pre style={{background:'#fff',border:'1px solid #fecaca',borderRadius:8,padding:12,fontSize:12,whiteSpace:'pre-wrap'}}>{SQL_SETTINGS}</pre>
            <button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={()=>{navigator.clipboard.writeText(SQL_SETTINGS);toast('📋 SQL 복사됨');}}>📋 SQL 복사</button>

            <div className="field"><label>회사 정보 (상호 아래 표시)</label><textarea rows={3} style={ta} value={st.companyInfo} onChange={e=>upd('companyInfo',e.target.value)} placeholder={'주소 · 전화 · 사업자등록번호 등'}/></div>
            <div className="field" style={{maxWidth:200}}><label>견적 유효기간 (일)</label><input type="number" min="0" value={st.validDays} onChange={e=>upd('validDays',e.target.value)}/></div>
        </div>
        <div className="card"><div className="card-title">진행 상태</div>
            <div className="field" style={{maxWidth:260}}><label>자동 보류 기간 (일)</label><input type="number" min="0" value={st.holdDays} onChange={e=>upd('holdDays',e.target.value)}/></div>

            <div style={{fontSize:12,color:'var(--muted)'}}>방문함을 체크한 뒤 이 기간이 지나도 본견적을 보내지 않으면 '⚠ 본견적 지연'으로 표시하고 견적 목록의 '오늘 할 일'에 보여줍니다. 0이면 쓰지 않습니다.</div>

        </div>
        <div className="card"><div className="card-title">📍 방문 예약 추천</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:'0 14px'}}>

                    <div className="field" key={k}><label>{l}</label><input type={t} min="0" value={st[k]} onChange={e=>upd(k,e.target.value)}/></div>)}

            <div style={{fontSize:12,color:'var(--muted)'}}>견적 수정의 🏠 방문 예정 아래 '📍 방문 추천 날짜 찾기'에서 사용합니다. 이동 시간은 주소 사이 직선거리로 추정하며, 최소 이동 여유보다 짧게 잡지 않습니다.</div>
        </div>
        <div className="card"><div className="card-title">견적서 공통내용 (하단 안내사항)</div>
            <textarea rows={10} style={ta} value={st.notes} onChange={e=>upd('notes',e.target.value)} placeholder={'예)\n· 입금 계좌: OO은행 000-0000-0000 (예금주)\n· 계약금 입금 후 제작이 시작됩니다.\n· 현장 상황에 따라 금액이 변동될 수 있습니다.'}/>
            <div style={{fontSize:12,color:'var(--muted)',marginTop:6}}>모든 견적서 인쇄물의 맨 아래에 그대로 표시됩니다. 비워두면 표시하지 않습니다.</div>
        </div>
        <KakaoNotify sb={sb} cb={kakaoCb}/>
        <StorageCleanup sb={sb}/>
    </div>);
}

// ★ 안 쓰는 파일 정리 (관리자): 저장소의 사진·파일 중 어떤 견적·자재·상품·공구·포트폴리오·공급사·외주에도 연결되지 않은 것을 찾아 삭제
//   (사진을 올린 뒤 저장하지 않고 브라우저를 닫은 경우 등에 남는 파일)
function StorageCleanup({sb}){
    const[isAdmin,setIsAdmin]=useState(false);
    const[scan,setScan]=useState(null); // {orphans:[{path,size}], total}
    const[busy,setBusy]=useState(false);
    useEffect(()=>{if(sb)sb.auth.getUser().then(({data})=>setIsAdmin((data&&data.user&&data.user.email)===ADMIN_EMAIL));},[sb]);
    if(!isAdmin)return null;
    const FOLDERS=['uploads','files','materials','products','tools','portfolio','site-photos','site-files','est-items','supplier-cards','outsourcing','out-quotes','quotes'];
    const doScan=async()=>{
        setBusy(true);setScan(null);
        try{
            const files=[];
            for(const f of FOLDERS){
                for(let off=0;;off+=1000){
                    const{data,error}=await sb.storage.from(BUCKET).list(f,{limit:1000,offset:off});
                    if(error||!data||!data.length)break;
                    data.filter(x=>x.id).forEach(x=>files.push({path:f+'/'+x.name,size:(x.metadata&&x.metadata.size)||0,at:x.created_at}));
                    if(data.length<1000)break;
                }
            }
            // 모든 표의 내용을 한 문자열로 모아, 파일 경로가 어디에도 없으면 '안 쓰는 파일'
            let refs='';
            for(const t of ['estimates','est_items','materials','products','tools','portfolios','suppliers','outsourcing_items']){
                const{data}=await sb.from(t).select('*');refs+=JSON.stringify(data||[]);
            }
            const dayAgo=Date.now()-86400000; // 지금 누군가 작성 중일 수 있으니 하루 안에 올린 파일은 제외
            const orphans=files.filter(x=>!refs.includes(x.path)&&!refs.includes(encodeURI(x.path))&&(!x.at||new Date(x.at).getTime()<dayAgo));
            setScan({orphans,total:files.length});
        }catch(e){alert('검사 실패: '+e.message);}
        finally{setBusy(false);}
    };
    const doDelete=async()=>{
        if(!scan||!scan.orphans.length)return;
        if(!confirm('안 쓰는 파일 '+scan.orphans.length+'개를 저장소에서 삭제합니다.\n삭제한 파일은 되돌릴 수 없습니다. 진행할까요?'))return;
        setBusy(true);
        const paths=scan.orphans.map(x=>x.path);
        for(let i=0;i<paths.length;i+=100){const{error}=await sb.storage.from(BUCKET).remove(paths.slice(i,i+100));if(error){alert('삭제 실패: '+error.message);break;}}
        setBusy(false);toast('🗑 안 쓰는 파일 '+paths.length+'개 삭제');setScan(null);
    };
    const mb=b=>(b/1048576).toFixed(1)+'MB';
    return(<div className="card"><div className="card-title">🧹 안 쓰는 파일 정리 (관리자)</div>
        <div style={{fontSize:12,color:'var(--muted)',marginBottom:10}}>사진·파일을 올린 뒤 저장하지 않고 브라우저를 닫으면 저장소에 파일만 남습니다. 어디에도 연결되지 않은 파일을 찾아 정리합니다 (최근 하루 안에 올린 파일은 제외).</div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <button className="btn btn-outline btn-sm" disabled={busy} onClick={doScan}>{busy&&!scan?'검사 중...':'🔍 안 쓰는 파일 찾기'}</button>
            {scan&&<span style={{fontSize:13}}>전체 {scan.total}개 중 <b>{scan.orphans.length}개</b> ({mb(scan.orphans.reduce((s,x)=>s+x.size,0))})</span>}
            {scan&&scan.orphans.length>0&&<button className="btn btn-sm" style={{background:'#b91c1c',color:'#fff'}} disabled={busy} onClick={doDelete}>🗑 삭제</button>}
        </div>
    </div>);
}

                    {(outCats||[]).map(c=><SSI key={c.id} label={c.name} isActive={page==='out-list'&&activeCatId?.out===c.id} onNav={()=>goOut(c.id)} onEdit={()=>onEditOutCat(c)} onDel={()=>onDelOutCat(c.id)}/>)}

            <div className={`nav-row ${activeGroup==='tool'?'active':''} ${open==='tool'?'open':''}`}>

                <SI label="🛠 외주업체" isActive={page==='supplier-list'&&activeCatId?.sup==='outsourcing'} onNav={()=>goSup('outsourcing')}/>

            <div className={`nav-row ${activeGroup==='portfolio'?'active':''} ${open==='portfolio'?'open':''}`}>
                <div className="nav-label" onClick={()=>toggle('portfolio')}><span className="nav-icon">🖼</span>포트폴리오<span className="nav-arrow">▶</span></div>
            </div>
            <div className={`nav-sub ${open==='portfolio'?'open':''}`}>
                <SI label="포트폴리오 관리" isActive={page==='portfolio'} onNav={()=>go('portfolio')}/>

            <div className={`nav-row ${page==='settings'?'active':''}`} style={{marginTop:8}}>

                    </div>

        </nav>
        <div className="sb-footer">
            <div className="sb-total-label">총 견적 (VAT포함)</div>
            <div className="sb-total-val">{fmt(grandWithVat)}원</div>

    </aside>);
}
