// 일정표에는 현장에 가야 하는 예정만 표시: 방문상담·실측 예정, 설치 예정
const SCHED_MAP={'방문상담 및 실측':{label:'방문상담',color:'#c2410c',bg:'#ffedd5'},'설치완료':{label:'설치',color:'#15803d',bg:'#dcfce7'}};

function Schedule({sb,view,onSetView,onEditEst,onViewEst}){
    const[base,setBase]=useState(new Date());
    const[estimates,setEstimates]=useState([]);
    const[loading,setLoading]=useState(true);
    const[popup,setPopup]=useState(null);
    const[popItems,setPopItems]=useState(null); // 팝업 견적의 상품 목록 (null = 불러오는 중)
    const[popExtra,setPopExtra]=useState(null); // 추가 방문 일정을 눌렀을 때 그 방문 정보

    // 팝업을 열면 해당 견적의 상품 목록을 불러옴
    useEffect(()=>{
        if(!popup){setPopItems(null);return;}
        let alive=true;
        (async()=>{
            const{data:cd}=await sb.from('est_cats').select('*').eq('estimate_id',popup.id).order('display_order');
            const cs=cd||[];let its=[];
            if(cs.length){const{data:idt}=await sb.from('est_items').select('*').in('cat_id',cs.map(c=>c.id)).order('display_order');its=idt||[];}
            if(alive)setPopItems(cs.map(c=>({name:c.name,items:its.filter(i=>i.cat_id===c.id)})).filter(c=>c.items.length));
        })();
        return()=>{alive=false;};
    },[popup]);

    useEffect(()=>{
        if(!sb)return;
        (async()=>{setLoading(true);const{data}=await sb.from('estimates').select('*').order('created_at',{ascending:false});if(data)setEstimates(data);setLoading(false);})();
    },[sb]);

    const getEvents=()=>{
        const evts=[];
        estimates.forEach(est=>{
            const{sd,sc}=estStageInfo(est,0);
            // 예정일이 입력되면 바로 표시 · 방문함/설치함 체크된(끝난) 일정은 표시하지 않음
            Object.keys(SCHED_MAP).forEach(key=>{
                if(!sd[key]||sc[key])return;
                const info=SCHED_MAP[key];const d=new Date(sd[key]);
                if(!isNaN(d))evts.push({date:d,label:info.label,color:info.color,bg:info.bg,clientName:est.client_name||'고객',time:d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),est});
            });
            // 추가 방문 (AS · 추가 설치) — 방문함 체크 전까지 표시
            pendingExtras(est).forEach(v=>{
                const tp=EXTRA_TYPES[v.type]||EXTRA_TYPES['기타'];const d=new Date(v.at);
                if(!isNaN(d))evts.push({date:d,label:tp.icon+' '+v.type,color:tp.color,bg:tp.bg,clientName:est.client_name||'고객',time:d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),est,extra:v});
            });
        });
        return evts;
    };

    const events=getEvents();
    const forDay=d=>events.filter(e=>e.date.getFullYear()===d.getFullYear()&&e.date.getMonth()===d.getMonth()&&e.date.getDate()===d.getDate()).sort((a,b)=>a.date-b.date);

    const EventChip=({ev})=>(<div className="cal-event" style={{background:ev.bg,color:ev.color}} onClick={()=>{setPopExtra(ev.extra||null);setPopup(ev.est);}}>
        <span className="cal-event-time">{ev.time}</span>
        <span className="cal-event-label">{ev.label}</span>
        <span className="cal-event-client">{ev.clientName}</span>
    </div>);

    const DAY_NAMES=['월','화','수','목','금','토','일'];

    const renderBiweek=()=>{
        const today=new Date(base);const dow=today.getDay();const mon=new Date(today);mon.setDate(today.getDate()-(dow===0?6:dow-1));
        const days=Array.from({length:14},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
        return(<div className="biweek-wrap">
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
                {DAY_NAMES.map((d,i)=><div key={i} className={`biweek-hd ${i>=5?'weekend':''}`}>{d}</div>)}
            </div>
            <div className="biweek-grid">
                {days.map((day,i)=>{const isToday=day.toDateString()===new Date().toDateString();const evts=forDay(day);return(
                    <div key={i} className={`biweek-cell ${isToday?'today':''} ${i%7>=5?'weekend':''}`}>
                        <div className="biweek-date">{day.getDate()}</div>
                        {evts.map((ev,j)=><EventChip key={j} ev={ev}/>)}
                    </div>);})}
            </div>
        </div>);
    };

    const renderMonth=()=>{
        const y=base.getFullYear(),m=base.getMonth();const first=new Date(y,m,1);
        const start=new Date(first);const fd=first.getDay();start.setDate(first.getDate()-(fd===0?6:fd-1));
        const days=[];const d=new Date(start);const last=new Date(y,m+1,0);
        while(d<=last||days.length%7!==0){days.push(new Date(d));d.setDate(d.getDate()+1);if(days.length>42)break;}
        return(<div className="month-wrap">
            <div className="month-grid">
                {DAY_NAMES.map((d,i)=><div key={i} className={`month-hd ${i>=5?'weekend':''}`}>{d}</div>)}
                {days.map((day,i)=>{const isToday=day.toDateString()===new Date().toDateString();const other=day.getMonth()!==m;const evts=forDay(day);return(
                    <div key={i} className={`month-cell ${isToday?'today':''} ${other?'other-month':''} ${i%7>=5?'weekend':''}`}>
                        <div className="month-date">{day.getDate()}</div>
                        {evts.map((ev,j)=><EventChip key={j} ev={ev}/>)}
                    </div>);})}
            </div>
        </div>);
    };

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;

    return(<div>
        {popup&&(<div className="modal-overlay" onClick={()=>setPopup(null)}>
            <div className="modal-box sm" onClick={e=>e.stopPropagation()}>
                <div className="modal-header"><div className="modal-title">📋 {popup.client_name||'고객'} 견적서</div><button className="modal-close" onClick={()=>setPopup(null)}>✕</button></div>
                {(()=>{
                    const tel=(popup.client_phone||'').replace(/[^0-9+]/g,'');const mtel=(popup.manager_phone||'').replace(/[^0-9+]/g,'');
                    const telA=(t,label)=>t?<a href={'tel:'+t} style={{color:'var(--blue)',fontWeight:700,textDecoration:'none'}}>📞 {label}</a>:'-';
                    const row=(l,v)=><div key={l} style={{display:'flex',gap:12,fontSize:13,alignItems:'baseline'}}>
                        <span style={{color:'var(--muted)',fontWeight:700,minWidth:64,fontSize:11,flexShrink:0}}>{l}</span>
                        <span style={{fontWeight:600,color:'var(--navy)',minWidth:0}}>{v}</span></div>;
                    return(<div style={{display:'flex',flexDirection:'column',gap:10,padding:'4px 0 8px',maxHeight:'65vh',overflowY:'auto'}}>
                        <div style={{display:'flex',alignItems:'center',gap:8}}><StatusBadge status={estStageInfo(popup,0).stage}/><span style={{fontSize:12,color:'var(--muted)'}}>{popup.est_no}</span></div>
                        {popExtra&&(()=>{const tp=EXTRA_TYPES[popExtra.type]||EXTRA_TYPES['기타'];return(
                            <div style={{border:'1.5px solid '+tp.color,background:tp.bg,borderRadius:10,padding:'8px 12px',fontSize:13}}>
                                <div style={{fontWeight:800,color:tp.color}}>{tp.icon} {popExtra.type} 방문 · {fmtDT(popExtra.at)}</div>
                                <div style={{marginTop:2,color:'var(--navy)',fontWeight:600}}>사유: {popExtra.reason||'-'}</div>
                            </div>);})()}                        <div style={{border:'1.5px solid var(--border)',borderRadius:10,padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
                            <div style={{fontSize:11,fontWeight:700,color:'var(--blue)'}}>고객 정보</div>
                            {row('고객명',popup.client_name||'-')}
                            {row('연락처',telA(tel,popup.client_phone))}
                            {row('주소',popup.client_address||'-')}
                            {popup.client_address&&<div style={{display:'flex',gap:6}}>
                                <button className="nav-btn" onClick={()=>window.open('https://tmap.life/'+encodeURIComponent(popup.client_address),'_blank')}>🗺T맵 길안내</button>
                                <button className="nav-btn" style={{background:'var(--green)'}} onClick={()=>window.open('https://map.kakao.com/?q='+encodeURIComponent(popup.client_address),'_blank')}>🗺카카오 길안내</button>
                            </div>}
                        </div>
                        <div style={{border:'1.5px solid #f6dc9c',background:'#fff8e6',borderRadius:10,padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
                            <div style={{fontSize:11,fontWeight:700,color:'#b07800'}}>👤 담당자 정보</div>
                            {row('담당자',popup.client_manager||'-')}
                            {row('연락처',telA(mtel,popup.manager_phone))}
                        </div>
                        <div style={{border:'1.5px solid var(--border)',borderRadius:10,padding:'10px 12px'}}>
                            <div style={{fontSize:11,fontWeight:700,color:'var(--blue)',marginBottom:6}}>🛍 상품 목록</div>
                            {popItems===null?<div style={{fontSize:12,color:'var(--muted)'}}>불러오는 중...</div>
                            :popItems.length===0?<div style={{fontSize:12,color:'var(--muted)'}}>등록된 상품이 없습니다.</div>
                            :popItems.map(c=><div key={c.name} style={{marginBottom:6}}>
                                <div style={{fontSize:11,fontWeight:700,color:'var(--muted)'}}>{c.name}</div>
                                {c.items.map(i=><div key={i.id} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:13,padding:'2px 0'}}>
                                    <span style={{fontWeight:600,color:'var(--navy)'}}>{i.name}{i.specification?<span style={{fontWeight:400,color:'var(--muted)',fontSize:12}}> · {i.specification}</span>:''}</span>
                                    <span style={{fontWeight:700,whiteSpace:'nowrap'}}>× {i.quantity}</span></div>)}
                            </div>)}
                            <div style={{borderTop:'1px solid var(--border)',marginTop:6,paddingTop:6,display:'flex',justifyContent:'space-between',fontSize:13}}>
                                <span style={{color:'var(--muted)',fontWeight:700,fontSize:11}}>공급가액 · 결제</span>
                                <span style={{fontWeight:700}}>{fmt(popup.total_supply||0)}원 · {popup.payment_status||'입금전'}</span></div>
                        </div>
                    </div>);
                })()}
                <div className="modal-btns">
                    <button className="modal-cancel" onClick={()=>setPopup(null)}>닫기</button>
                    {onViewEst&&<button className="modal-cancel" style={{background:'#e0e7ff',color:'var(--blue)',fontWeight:700}} onClick={()=>{setPopup(null);onViewEst(popup.id);}}>📄 견적서 보기</button>}
                    <button className="modal-ok" onClick={()=>{setPopup(null);onEditEst(popup.id);}}>✏️ 견적서 수정</button>
                </div>
            </div>
        </div>)}

        <div className="page-header">
            <div className="page-title-wrap"><h1>📅 일정표</h1><p>견적 진행 일정 · 이벤트 클릭 시 견적서 열기</p></div>
            <div className="btn-row">
                <button className={`btn ${view==='biweek'?'btn-primary':'btn-outline'}`} onClick={()=>onSetView('biweek')}>2주간</button>
                <button className={`btn ${view==='month'?'btn-primary':'btn-outline'}`} onClick={()=>onSetView('month')}>월간</button>
                <button className="btn btn-outline" onClick={()=>setBase(new Date())}>오늘</button>
            </div>
        </div>

        <div className="cal-legend" style={{marginBottom:12}}>
            {Object.values(SCHED_MAP).map(info=>(<span key={info.label} className="cal-legend-item" style={{background:info.bg,color:info.color}}>● {info.label}</span>))}
            {Object.entries(EXTRA_TYPES).map(([t,tp])=>(<span key={t} className="cal-legend-item" style={{background:tp.bg,color:tp.color}}>{tp.icon} {t}</span>))}
            <span style={{fontSize:11,color:'var(--muted)',alignSelf:'center'}}>※ 방문상담·설치·추가 방문 예정만 표시 · 방문함/설치함 체크된 일정은 숨김</span>
        </div>

        <div className="cal-header" style={{marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',gap:0,flex:1,justifyContent:'center'}}>
                <button className="cal-nav" style={{borderRadius:'8px 0 0 8px',borderRight:'none'}}
                    onClick={()=>{const d=new Date(base);view==='biweek'?d.setDate(d.getDate()-14):d.setMonth(d.getMonth()-1);setBase(d);}}>◀</button>
                <span className="cal-title" style={{padding:'0 20px',background:'#fff',border:'1.5px solid var(--border)',height:38,display:'flex',alignItems:'center',fontSize:16}}>
                    {view==='biweek'?(()=>{const d=new Date(base);const dow=d.getDay();d.setDate(d.getDate()-(dow===0?6:dow-1));const e=new Date(d);e.setDate(d.getDate()+13);return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric'})+' ~ '+e.toLocaleDateString('ko-KR',{month:'long',day:'numeric'});})():base.getFullYear()+'년 '+(base.getMonth()+1)+'월'}
                </span>
                <button className="cal-nav" style={{borderRadius:'0 8px 8px 0',borderLeft:'none'}}
                    onClick={()=>{const d=new Date(base);view==='biweek'?d.setDate(d.getDate()+14):d.setMonth(d.getMonth()+1);setBase(d);}}>▶</button>
            </div>
        </div>
        {view==='biweek'?renderBiweek():renderMonth()}
    </div>);
}

/* ═══════════════════════════════════════
   ★ 환경설정 (상호 · 견적서 공통내용)
═══════════════════════════════════════ */
function SettingsPage({sb}){
    const[st,setSt]=useState(null);
    const[saving,setSaving]=useState(false);
    useEffect(()=>{if(sb)loadSettings(sb).then(setSt);},[sb]);
    const upd=(k,v)=>setSt(p=>({...p,[k]:v}));
    const save=async()=>{
        setSaving(true);
        const{_error,...v}=st;
        const{error}=await sb.from('app_settings').upsert({key:'estimate',value:JSON.stringify(v),updated_at:new Date().toISOString()});
        setSaving(false);
        if(error){alert('저장 실패: '+error.message+'\n\nSupabase SQL Editor에서 아래를 실행하세요:\n\n'+SQL_SETTINGS);return;}
        setSt(v);toast('✅ 환경설정 저장됨');
    };
    if(!st)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    const ta={width:'100%',border:'1.5px solid var(--border)',borderRadius:8,padding:'10px 14px',fontSize:13,fontFamily:"'Noto Sans KR',sans-serif",lineHeight:1.6,outline:'none',resize:'vertical'};
    return(<div style={{maxWidth:860}}>
        <div className="page-header">
            <div className="page-title-wrap"><h1>🛠 환경설정</h1><p>견적서 인쇄에 들어가는 상호·공통 문구와 진행 상태 설정을 관리합니다</p></div>
            <div className="btn-row"><button className="btn btn-primary" disabled={saving} onClick={save}>{saving?'저장 중...':'💾 저장'}</button></div>
        </div>
        {st._error&&<div className="card" style={{borderColor:'#fca5a5',background:'#fef2f2'}}>
            <div style={{fontWeight:700,color:'var(--red)',marginBottom:8}}>⚠️ 설정 테이블이 아직 없습니다 — Supabase SQL Editor에서 아래를 한 번 실행하세요</div>
            <pre style={{background:'#fff',border:'1px solid #fecaca',borderRadius:8,padding:12,fontSize:12,whiteSpace:'pre-wrap'}}>{SQL_SETTINGS}</pre>
            <button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={()=>{navigator.clipboard.writeText(SQL_SETTINGS);toast('📋 SQL 복사됨');}}>📋 SQL 복사</button>
        </div>}
        <div className="card"><div className="card-title">견적서 상단</div>
            <div className="field"><label>상호</label><input value={st.company} onChange={e=>upd('company',e.target.value)} placeholder="LUCKYSTAR CARAVAN"/></div>
            <div className="field"><label>회사 정보 (상호 아래 표시)</label><textarea rows={3} style={ta} value={st.companyInfo} onChange={e=>upd('companyInfo',e.target.value)} placeholder={'주소 · 전화 · 사업자등록번호 등'}/></div>
            <div className="field" style={{maxWidth:200}}><label>견적 유효기간 (일)</label><input type="number" min="0" value={st.validDays} onChange={e=>upd('validDays',e.target.value)}/></div>
        </div>
        <div className="card"><div className="card-title">진행 상태</div>
            <div className="field" style={{maxWidth:260}}><label>자동 보류 기간 (일)</label><input type="number" min="0" value={st.holdDays} onChange={e=>upd('holdDays',e.target.value)}/></div>
            <div style={{fontSize:12,color:'var(--muted)'}}>가견적·본견적을 발송한 뒤 이 기간 동안 방문 예정·재발송·계약금 입력이 없으면 견적이 자동으로 ⏸ 보류됩니다. 0이면 자동 보류를 쓰지 않습니다.</div>
        </div>
        <div className="card"><div className="card-title">📍 방문 예약 추천</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:'0 14px'}}>
                {[['visitMin','방문 소요 시간 (분)','number'],['installMin','설치 소요 시간 (분)','number'],['bufferMin','최소 이동 여유 (분)','number'],['workStart','방문 가능 시작','time'],['workEnd','방문 가능 종료','time'],['planDays','추천 기간 (일)','number'],['nearKm','가까운 거리 기준 (km)','number']].map(([k,l,t])=>
                    <div className="field" key={k}><label>{l}</label><input type={t} min="0" value={st[k]} onChange={e=>upd(k,e.target.value)}/></div>)}
            </div>
            <div className="field"><label>카카오 JavaScript 키</label><input value={st.kakaoKey} onChange={e=>upd('kakaoKey',e.target.value)}/></div>
            <div style={{fontSize:12,color:'var(--muted)'}}>견적 수정의 🏠 방문 예정 아래 '📍 방문 추천 날짜 찾기'에서 사용합니다. 이동 시간은 주소 사이 직선거리로 추정하며, 최소 이동 여유보다 짧게 잡지 않습니다.</div>
        </div>
        <div className="card"><div className="card-title">견적서 공통내용 (하단 안내사항)</div>
            <textarea rows={10} style={ta} value={st.notes} onChange={e=>upd('notes',e.target.value)} placeholder={'예)\n· 입금 계좌: OO은행 000-0000-0000 (예금주)\n· 계약금 입금 후 제작이 시작됩니다.\n· 현장 상황에 따라 금액이 변동될 수 있습니다.'}/>
            <div style={{fontSize:12,color:'var(--muted)',marginTop:6}}>모든 견적서 인쇄물의 맨 아래에 그대로 표시됩니다. 비워두면 표시하지 않습니다.</div>
        </div>
    </div>);
}

/* ═══════════════════════════════════════
   ★ 사이드바
═══════════════════════════════════════ */
function Sidebar({user,page,setPage,matCats,prodCats,onAddMatCat,onDelMatCat,onEditMatCat,onEditToolCat,onEditProdCat,onAddProdCat,onDelProdCat,toolCats,onAddToolCat,onDelToolCat,activeCatId,setActiveCatId,grandWithVat,onLogout,sbOpen,onClose}){
    const[open,setOpen]=useState(()=>page.startsWith('mat')?'material':page.startsWith('tool')?'tool':page.startsWith('prod')?'product':page.startsWith('port')?'portfolio':page.startsWith('sched')?'schedule':'estimate');
    const[openSub,setOpenSub]=useState({mat:true,prod:true,tool:true});
    const toggle=id=>setOpen(o=>o===id?null:id);
    const _grp=page.startsWith('mat')?'material':page.startsWith('tool')?'tool':page.startsWith('prod')?'product':page.startsWith('port')?'portfolio':page.startsWith('sched')?'schedule':'estimate';
    useEffect(()=>{setOpen(_grp);},[_grp]);
    const toggleSub=key=>setOpenSub(p=>({...p,[key]:!p[key]}));
    const uname=user?.user_metadata?.full_name||user?.email?.split('@')[0]||'사용자';
    const avatar=user?.user_metadata?.avatar_url;
    const activeGroup=page.startsWith('mat')?'material':page.startsWith('tool')?'tool':page.startsWith('prod')?'product':page.startsWith('port')?'portfolio':page.startsWith('sched')?'schedule':'estimate';
    const goMat=(catId=null)=>{setPage('mat-list');setActiveCatId({mat:catId,prod:null});if(onClose)onClose();};
    const goProd=(catId=null)=>{setPage('prod-list');setActiveCatId({mat:null,prod:catId});if(onClose)onClose();};
    const goTool=(catId=null)=>{setPage('tool-list');setActiveCatId({mat:null,prod:null,tool:catId});if(onClose)onClose();};
    const go=p=>{setPage(p);if(onClose)onClose();};

    const SI=({label,isActive,onNav})=>(<div className={`nav-sub-item ${isActive?'active':''}`} onClick={onNav}><span className="nav-sub-dot"/><span className="nav-sub-label">{label}</span></div>);
    const SSI=({label,isActive,onNav,onDel,onEdit})=>(<div className={`ssi ${isActive?'active':''}`} onClick={onNav}><span className="ssi-dot"/><span className="ssi-label">{label}</span>{onEdit&&<button className="ssi-edit" title="분류명 수정" onClick={e=>{e.stopPropagation();onEdit();}}>✎</button>}{onDel&&<button className="ssi-del" onClick={e=>{e.stopPropagation();onDel();}}>✕</button>}</div>);

    return(<aside className={`sidebar ${sbOpen?'sb-open':''}`} onClick={e=>e.stopPropagation()}>
        <div className="sb-header"><div className="sb-logo">LUCKY<span>STAR</span></div><div className="sb-sub">CARAVAN MANAGER v2.0</div></div>
        <div className="sb-user">
            <div className="sb-avatar">{avatar?<img src={avatar} alt=""/>:uname[0]?.toUpperCase()}</div>
            <div className="sb-username">{uname}</div>
            <button className="sb-logout" onClick={onLogout} title="로그아웃">⏻</button>
        </div>
        <nav className="sb-nav">
            <div className={`nav-row ${activeGroup==='material'?'active':''} ${open==='material'?'open':''}`}>
                <div className="nav-label" onClick={()=>toggle('material')}><span className="nav-icon">📦</span>자재관리<span className="nav-arrow">▶</span></div>
            </div>
            <div className={`nav-sub ${open==='material'?'open':''}`}>
                <div className={`nav-grp-hd ${openSub.mat?'open':''}`} onClick={()=>toggleSub('mat')}>
                    <span>📁 자재분류</span>
                    <button style={{background:'none',border:'none',color:'rgba(255,255,255,.35)',cursor:'pointer',fontSize:14,lineHeight:1,padding:'0 6px'}} onClick={e=>{e.stopPropagation();onAddMatCat();}}>＋</button>
                    <span className="nav-grp-arrow">▶</span>
                </div>
                <div className={`nav-sub-sub ${openSub.mat?'open':''}`}>
                    <SSI label="전체 자재" isActive={page==='mat-list'&&activeCatId?.mat===null} onNav={()=>goMat(null)}/>
                    {matCats.map(c=><SSI key={c.id} label={c.name} isActive={page==='mat-list'&&activeCatId?.mat===c.id} onNav={()=>goMat(c.id)} onEdit={()=>onEditMatCat(c)} onDel={()=>onDelMatCat(c.id)}/>)}
                    <div className="ssi-add" onClick={onAddMatCat}>＋ 분류 추가</div>
                </div>
                <SI label="🏭 재고 현황" isActive={page==='mat-stock'} onNav={()=>go('mat-stock')}/>
                <SI label="🏢 공급사 관리" isActive={page==='supplier-list'} onNav={()=>go('supplier-list')}/>
            </div>

            <div className={`nav-row ${activeGroup==='tool'?'active':''} ${open==='tool'?'open':''}`}>
                <div className="nav-label" onClick={()=>toggle('tool')}><span className="nav-icon">🧰</span>공구/부자재<span className="nav-arrow">▶</span></div>
            </div>
            <div className={`nav-sub ${open==='tool'?'open':''}`}>
                <div className={`nav-grp-hd ${openSub.tool?'open':''}`} onClick={()=>toggleSub('tool')}>
                    <span>📁 분류</span>
                    <button style={{background:'none',border:'none',color:'rgba(255,255,255,.35)',cursor:'pointer',fontSize:14,lineHeight:1,padding:'0 6px'}} onClick={e=>{e.stopPropagation();onAddToolCat();}}>＋</button>
                    <span className="nav-grp-arrow">▶</span>
                </div>
                <div className={`nav-sub-sub ${openSub.tool?'open':''}`}>
                    <SSI label="전체 공구/부자재" isActive={page==='tool-list'&&(activeCatId?.tool??null)===null} onNav={()=>goTool(null)}/>
                    {(toolCats||[]).map(c=><SSI key={c.id} label={c.name} isActive={page==='tool-list'&&activeCatId?.tool===c.id} onNav={()=>goTool(c.id)} onEdit={()=>onEditToolCat(c)} onDel={()=>onDelToolCat(c.id)}/>)}
                    <div className="ssi-add" onClick={onAddToolCat}>＋ 분류 추가</div>
                </div>
            </div>

            <div className={`nav-row ${activeGroup==='product'?'active':''} ${open==='product'?'open':''}`}>
                <div className="nav-label" onClick={()=>toggle('product')}><span className="nav-icon">🛍</span>상품관리<span className="nav-arrow">▶</span></div>
            </div>
            <div className={`nav-sub ${open==='product'?'open':''}`}>
                <div className={`nav-grp-hd ${openSub.prod?'open':''}`} onClick={()=>toggleSub('prod')}>
                    <span>📁 상품분류</span>
                    <button style={{background:'none',border:'none',color:'rgba(255,255,255,.35)',cursor:'pointer',fontSize:14,lineHeight:1,padding:'0 6px'}} onClick={e=>{e.stopPropagation();onAddProdCat();}}>＋</button>
                    <span className="nav-grp-arrow">▶</span>
                </div>
                <div className={`nav-sub-sub ${openSub.prod?'open':''}`}>
                    <SSI label="전체 상품" isActive={page==='prod-list'&&activeCatId?.prod===null} onNav={()=>goProd(null)}/>
                    {prodCats.map(c=><SSI key={c.id} label={c.name} isActive={page==='prod-list'&&activeCatId?.prod===c.id} onNav={()=>goProd(c.id)} onEdit={()=>onEditProdCat(c)} onDel={()=>onDelProdCat(c.id)}/>)}
                    <div className="ssi-add" onClick={onAddProdCat}>＋ 카테고리 추가</div>
                </div>
            </div>

            <div className={`nav-row ${activeGroup==='portfolio'?'active':''} ${open==='portfolio'?'open':''}`}>
                <div className="nav-label" onClick={()=>toggle('portfolio')}><span className="nav-icon">🖼</span>포트폴리오<span className="nav-arrow">▶</span></div>
            </div>
            <div className={`nav-sub ${open==='portfolio'?'open':''}`}>
                <SI label="포트폴리오 관리" isActive={page==='portfolio'} onNav={()=>go('portfolio')}/>
            </div>

            <div className={`nav-row ${activeGroup==='estimate'?'active':''} ${open==='estimate'?'open':''}`}>
                <div className="nav-label" onClick={()=>toggle('estimate')}><span className="nav-icon">📋</span>견적관리<span className="nav-arrow">▶</span></div>
            </div>
            <div className={`nav-sub ${open==='estimate'?'open':''}`}>
                <SI label="새 견적서" isActive={page==='est-new'} onNav={()=>go('est-new')}/>
                <SI label="견적 목록" isActive={page==='est-list'} onNav={()=>go('est-list')}/>
            </div>

            <div className={`nav-row ${activeGroup==='schedule'?'active':''} ${open==='schedule'?'open':''}`}>
                <div className="nav-label" onClick={()=>toggle('schedule')}><span className="nav-icon">📅</span>일정표<span className="nav-arrow">▶</span></div>
            </div>
            <div className={`nav-sub ${open==='schedule'?'open':''}`}>
                <SI label="2주간 일정" isActive={page==='sched-biweek'} onNav={()=>go('sched-biweek')}/>
                <SI label="월간 일정" isActive={page==='sched-month'} onNav={()=>go('sched-month')}/>
            </div>
            <div className={`nav-row ${page==='settings'?'active':''}`} style={{marginTop:8}}>
                <div className="nav-label" onClick={()=>go('settings')}><span className="nav-icon">🛠</span>환경설정</div>
            </div>
            {/* 관리자 전용 메뉴 */}
            {user?.email===ADMIN_EMAIL&&(
                <div className={`nav-row ${page==='user-approval'?'active':''}`} style={{marginTop:8}}>
                    <div className="nav-label" onClick={()=>go('user-approval')}>
                        <span className="nav-icon">⚙️</span>사용자 관리
                    </div>
                </div>
            )}
        </nav>
        <div className="sb-footer">
            <div className="sb-total-label">총 견적 (VAT포함)</div>
            <div className="sb-total-val">{fmt(grandWithVat)}원</div>
            <div className="sb-status"><span className="dot-green"/>클라우드 연결됨</div>
        </div>
    </aside>);
}

/* ═══════════════════════════════════════
   ★ 앱
═══════════════════════════════════════ */
function App(){
    const[config,setConfig]=useState(()=>{
        const SUPABASE_URL='https://ubxoyogkygwzdlmfrtfn.supabase.co';
        const SUPABASE_KEY='sb_publishable_vKyoKH8lAH5m4zZu5fYn_w_aUjVVSV2';
        if(SUPABASE_URL&&SUPABASE_KEY)return{url:SUPABASE_URL,key:SUPABASE_KEY};
        try{return JSON.parse(localStorage.getItem('supabase_config'));}catch{return null;}
    });
    const[sb,setSb]=useState(null);
    const[user,setUser]=useState(null);
    const[authLoading,setAuthLoading]=useState(true);
    const[isApproved,setIsApproved]=useState(false);
    const[pfParam]=useState(()=>{try{return new URLSearchParams(window.location.search).get('pf');}catch(e){return null;}});
    const[initRoute]=useState(()=>{try{return parseHash(window.location.hash,false);}catch(e){return null;}});
    const[openMatId,setOpenMatId]=useState(()=>{
        try{const id=new URLSearchParams(window.location.search).get('mat');
            if(id)window.history.replaceState(null,'',window.location.pathname);
            return id||null;}catch(e){return null;}
    });
    const[page,setPage]=useState(()=>openMatId?'mat-list':(initRoute?initRoute.page:'sched-biweek')); // 첫 화면: 2주간 일정 (자재 링크로 열면 자재관리)
    const[sbOpen,setSbOpen]=useState(false);
    const[editEstId,setEditEstId]=useState(()=>(initRoute&&initRoute.estId)||null);
    const[matCats,setMatCats]=useState([]);
    const[prodCats,setProdCats]=useState([]);
    const[addMatModal,setAddMatModal]=useState(false);
    const[addProdModal,setAddProdModal]=useState(false);
    const[toolCats,setToolCats]=useState([]);
    const[addToolModal,setAddToolModal]=useState(false);
    const[editMatCat,setEditMatCat]=useState(null);
    const[editToolCat,setEditToolCat]=useState(null);
    const[editProdCat,setEditProdCat]=useState(null);
    const[activeCatId,setActiveCatId]=useState(()=>initRoute&&initRoute.listKey?{mat:null,prod:null,tool:null,[initRoute.listKey]:initRoute.catId}:{mat:null,prod:null,tool:null});
    const[grandWithVat,setGrandWithVat]=useState(0);
    const[suppliers,setSuppliers]=useState([]); // 공급사 목록
    const[userProfile,setUserProfile]=useState(null); // 담당자 프로필
    const[showProfileSetup,setShowProfileSetup]=useState(false);

    useEffect(()=>{
        if(!config)return setAuthLoading(false);
        const client=window.supabase.createClient(config.url,config.key);
        setSb(client);
        const checkApproval=async(u,cl)=>{
            if(!u){setIsApproved(false);return;}
            try{
                if(u.email===ADMIN_EMAIL){setIsApproved(true);return;}
                const{data,error}=await cl.from('approved_users').select('email').eq('email',u.email).maybeSingle();
                if(error){console.error('approved_users 오류:',error.message);setIsApproved(false);}
                else{setIsApproved(!!data);}
            }catch(e){console.error('승인 체크 오류:',e);setIsApproved(false);}
        };
        client.auth.getSession().then(async({data:{session}})=>{
            const u=session?.user??null;
            setUser(u);
            await checkApproval(u,client);
            setAuthLoading(false); // ★ 항상 실행
        }).catch(e=>{console.error('세션 로드 오류:',e);setAuthLoading(false);});
        client.auth.onAuthStateChange(async(_,session)=>{
            const u=session?.user??null;setUser(u);
            await checkApproval(u,client);
        });
    },[config]);

    useEffect(()=>{
        if(!sb||!user)return;
        sb.from('material_categories').select('*').order('display_order').then(({data})=>{if(data)setMatCats(data);});
        sb.from('suppliers').select('*').order('name').then(({data})=>{if(data)setSuppliers(data);});
        sb.from('product_categories').select('*').order('display_order').then(({data})=>{if(data)setProdCats(data);});
        sb.from('tool_categories').select('*').order('display_order').then(({data})=>{if(data)setToolCats(data);});
        // ★ 담당자 프로필 로드 (오류 무시 - 핵심 기능 영향 없음)
        (async()=>{
            try{
                const uname=user.user_metadata?.full_name||user.email?.split('@')[0]||'';
                const{data:prof,error:e1}=await sb.from('user_profiles').select('*').eq('email',user.email).maybeSingle();
                if(e1){console.warn('user_profiles 로드 실패:',e1.message);return;}
                if(prof){setUserProfile(prof);if(!prof.phone)setShowProfileSetup(true);}
                else{
                    const{data:np,error:e2}=await sb.from('user_profiles').insert([{email:user.email,name:uname,phone:''}]).select().maybeSingle();
                    if(e2){console.warn('user_profiles 생성 실패:',e2.message);return;}
                    if(np)setUserProfile(np);
                    setShowProfileSetup(true);
                }
            }catch(e){console.warn('프로필 로드 오류:',e);}
        })();
    },[sb,user]);

    // 화면이 바뀌면 브라우저 기록에 추가 (같은 주소면 추가하지 않음)
    const firstRoute=useRef(true);
    useEffect(()=>{
        if(!user||!isApproved)return;
        const h=buildHash(page,editEstId,activeCatId);
        if(window.location.hash===h){firstRoute.current=false;return;}
        if(firstRoute.current){window.history.replaceState(null,'',h);firstRoute.current=false;}
        else window.history.pushState(null,'',h);
    },[page,editEstId,activeCatId,user,isApproved]);
    // 뒤로가기/앞으로가기 시 해당 화면으로 복원
    useEffect(()=>{
        const onPop=()=>{
            const r=parseHash(window.location.hash,user&&user.email===ADMIN_EMAIL);
            if(!r)return;
            setPage(r.page);
            if(r.estId)setEditEstId(r.estId);
            if(r.listKey)setActiveCatId({mat:null,prod:null,tool:null,[r.listKey]:r.catId});
            setSbOpen(false);
        };
        window.addEventListener('popstate',onPop);
        return()=>window.removeEventListener('popstate',onPop);
    },[user]);

    const navigate=(p,id)=>{if(id)setEditEstId(id);setPage(p);setSbOpen(false);};

    const addMatCat=async name=>{
        const{data}=await sb.from('material_categories').insert([{name,display_order:matCats.length}]).select();
        if(data)setMatCats(p=>[...p,data[0]]);
        setAddMatModal(false);toast('📁 자재분류 추가됨');
    };
    const delMatCat=async id=>{
        if(!confirm('분류를 삭제하시겠습니까?'))return;
        await sb.from('material_categories').delete().eq('id',id);
        setMatCats(p=>p.filter(c=>c.id!==id));toast('🗑 삭제됨');
    };
    const addProdCat=async name=>{
        const{data}=await sb.from('product_categories').insert([{name,display_order:prodCats.length}]).select();
        if(data)setProdCats(p=>[...p,data[0]]);
        setAddProdModal(false);toast('📁 카테고리 추가됨');
    };
    const delProdCat=async id=>{
        if(!confirm('카테고리를 삭제하시겠습니까?'))return;
        await sb.from('product_categories').delete().eq('id',id);
        setProdCats(p=>p.filter(c=>c.id!==id));toast('🗑 삭제됨');
    };
    const addToolCat=async name=>{
        const{data,error}=await sb.from('tool_categories').insert([{name,display_order:toolCats.length}]).select();
        if(error){alert('분류 추가 실패: '+error.message+'\n\nSupabase SQL Editor에서 아래를 실행하세요:\n\n'+SQL_TOOLS);return;}
        if(data)setToolCats(p=>[...p,data[0]]);
        setAddToolModal(false);toast('📁 공구/부자재 분류 추가됨');
    };
    const delToolCat=async id=>{
        if(!confirm('분류를 삭제하시겠습니까?\n(해당 분류의 품목은 "미분류"로 남습니다)'))return;
        await sb.from('tool_categories').delete().eq('id',id);
        setToolCats(p=>p.filter(c=>c.id!==id));toast('🗑 삭제됨');
    };
    const renameMatCat=async(id,name)=>{
        const{error}=await sb.from('material_categories').update({name}).eq('id',id);
        if(error){alert('수정 실패: '+error.message);return;}
        setMatCats(p=>p.map(c=>c.id===id?{...c,name}:c));setEditMatCat(null);toast('✅ 자재 분류명 수정됨');
    };
    const renameProdCat=async(id,name)=>{
        const{error}=await sb.from('product_categories').update({name}).eq('id',id);
        if(error){alert('수정 실패: '+error.message);return;}
        setProdCats(p=>p.map(c=>c.id===id?{...c,name}:c));setEditProdCat(null);toast('✅ 상품 분류명 수정됨');
    };
    const renameToolCat=async(id,name)=>{
        const{error}=await sb.from('tool_categories').update({name}).eq('id',id);
        if(error){alert('수정 실패: '+error.message);return;}
        setToolCats(p=>p.map(c=>c.id===id?{...c,name}:c));setEditToolCat(null);toast('✅ 공구/부자재 분류명 수정됨');
    };
    const handleLogout=async()=>{if(sb)await sb.auth.signOut();setUser(null);};

    const renderPage=()=>{
        switch(page){
            case 'mat-list':return<MaterialList sb={sb} matCats={matCats} suppliers={suppliers} onAddMatCat={()=>setAddMatModal(true)} initialCatId={activeCatId.mat} openMatId={openMatId} onOpened={()=>setOpenMatId(null)}/>;
            case 'tool-list':return<ToolList sb={sb} toolCats={toolCats} onAddToolCat={()=>setAddToolModal(true)} initialCatId={activeCatId.tool}/>;
            case 'supplier-list':return<SupplierList sb={sb} suppliers={suppliers} setSuppliers={setSuppliers}/>;
            case 'mat-stock':return<div><div className="page-header"><div className="page-title-wrap"><h1>🏭 재고 현황</h1><p>자재별 재고 조회</p></div></div><div className="coming-wrap" style={{marginTop:0}}><div className="coming-icon">🔨</div><div style={{fontSize:16,fontWeight:700,color:'var(--navy)'}}>준비 중</div></div></div>;
            case 'prod-list':return<ProductList sb={sb} matCats={matCats} prodCats={prodCats} toolCats={toolCats} onAddProdCat={()=>setAddProdModal(true)} initialCatId={activeCatId.prod}/>;
            case 'portfolio':return<Portfolio sb={sb} prodCats={prodCats}/>;
            case 'est-new':return<EstimateForm key="new" sb={sb} prodCats={prodCats} mode="new" onNavigate={navigate} onTotalChange={setGrandWithVat} userProfile={userProfile}/>;
            case 'est-list':return<EstimateList sb={sb} onEdit={id=>navigate('est-edit',id)} onNew={()=>navigate('est-new')} onChecklist={id=>navigate('est-checklist',id)} onView={id=>navigate('est-view',id)}/>;
            case 'est-edit':return<EstimateForm key={editEstId} sb={sb} prodCats={prodCats} mode="edit" estimateId={editEstId} onNavigate={navigate} onTotalChange={setGrandWithVat} userProfile={userProfile}/>;
            case 'est-view':return<EstimateView key={editEstId} sb={sb} estimateId={editEstId} onNavigate={navigate}/>;
            case 'est-checklist':return<ChecklistPage key={editEstId} sb={sb} estimateId={editEstId} onNavigate={navigate}/>;
            case 'sched-biweek':
            case 'sched-month':return<Schedule sb={sb} view={page==='sched-month'?'month':'biweek'} onSetView={v=>navigate(v==='month'?'sched-month':'sched-biweek')} onEditEst={id=>navigate('est-edit',id)} onViewEst={id=>navigate('est-view',id)}/>
;            case 'user-approval':return<UserApprovalPage sb={sb} user={user}/>;
            case 'settings':return<SettingsPage sb={sb}/>;
            default:return<EstimateList sb={sb} onEdit={id=>navigate('est-edit',id)} onNew={()=>navigate('est-new')} onChecklist={id=>navigate('est-checklist',id)} onView={id=>navigate('est-view',id)}/>;
        }
    };

    if(pfParam)return sb?<PublicPortfolioPage sb={sb} ids={pfParam.split(',').filter(Boolean)}/>:<div className="loading-wrap"><div className="loading-spinner"/></div>;
    if(authLoading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    if(!config)return<SetupScreen onDone={c=>{localStorage.setItem('supabase_config',JSON.stringify(c));setConfig(c);}}/>;
    if(!user)return<LoginScreen sb={sb}/>;
    if(!isApproved)return<AccessDenied user={user} sb={sb} onLogout={handleLogout} onApprove={()=>setIsApproved(true)}/>;

    return(<div className="layout">
        {showProfileSetup&&<ProfileSetupModal user={user} sb={sb} onSave={prof=>{setUserProfile(prof);setShowProfileSetup(false);}}/>}
        <div className="mobile-header">
            <button className="hamburger" onClick={()=>setSbOpen(o=>!o)}>☰</button>
            <div className="mobile-logo">LUCKY<span>STAR</span></div>
            <button style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',cursor:'pointer',fontSize:13,fontFamily:'Noto Sans KR,sans-serif'}} onClick={handleLogout}>⏻</button>
        </div>
        <div className={`sb-overlay ${sbOpen?'active':''}`} onClick={()=>setSbOpen(false)}/>
        {addMatModal&&<AddNameModal title="자재 분류 추가" placeholder="분류명 입력" onClose={()=>setAddMatModal(false)} onSave={addMatCat}/>}
        {editMatCat&&<AddNameModal title="자재 분류명 수정" placeholder="분류명 입력" initial={editMatCat.name} onClose={()=>setEditMatCat(null)} onSave={n=>renameMatCat(editMatCat.id,n)}/>}
        {editProdCat&&<AddNameModal title="상품 분류명 수정" placeholder="분류명 입력" initial={editProdCat.name} onClose={()=>setEditProdCat(null)} onSave={n=>renameProdCat(editProdCat.id,n)}/>}
        {editToolCat&&<AddNameModal title="공구/부자재 분류명 수정" placeholder="분류명 입력" initial={editToolCat.name} onClose={()=>setEditToolCat(null)} onSave={n=>renameToolCat(editToolCat.id,n)}/>}
        {addToolModal&&<AddNameModal title="공구/부자재 분류 추가" placeholder="분류명 입력 (예: 공구, 부자재)" onClose={()=>setAddToolModal(false)} onSave={addToolCat}/>}
        {addProdModal&&<AddNameModal title="상품 카테고리 추가" placeholder="카테고리명 입력" onClose={()=>setAddProdModal(false)} onSave={addProdCat}/>}
        <Sidebar user={user} page={page} setPage={p=>{setPage(p);setSbOpen(false);}} matCats={matCats} prodCats={prodCats} onAddMatCat={()=>{setAddMatModal(true);setSbOpen(false);}} onDelMatCat={delMatCat} onEditMatCat={c=>{setEditMatCat(c);setSbOpen(false);}} onEditToolCat={c=>{setEditToolCat(c);setSbOpen(false);}} onEditProdCat={c=>{setEditProdCat(c);setSbOpen(false);}} onAddProdCat={()=>{setAddProdModal(true);setSbOpen(false);}} onDelProdCat={delProdCat} toolCats={toolCats} onAddToolCat={()=>{setAddToolModal(true);setSbOpen(false);}} onDelToolCat={delToolCat} activeCatId={activeCatId} setActiveCatId={setActiveCatId} grandWithVat={grandWithVat} onLogout={handleLogout} sbOpen={sbOpen} onClose={()=>setSbOpen(false)}/>
        <main className="main">{renderPage()}</main>
    </div>);
}

const container=document.getElementById('root');
const root=ReactDOM.createRoot(container);
root.render(React.createElement(App));
</script>
</body>
