        {/* 카테고리 버튼 */}
        <div style={{marginBottom:12,display:'flex',gap:8,flexWrap:'wrap'}} className="no-print">
            <button className="btn btn-green" onClick={()=>setShowPick(true)}>🛍 상품 선택</button>
            <button className="btn btn-outline" onClick={addCat}>＋ 기타상품추가</button>
        </div>

        {/* 품목 테이블 */}
        {cats.length===0&&<div className="empty-state" style={{marginTop:20}}><div className="empty-icon">📋</div><div className="empty-text"><strong style={{color:'var(--blue)'}}>🛍 상품 선택</strong> 또는 <strong>기타상품추가</strong>로 시작하세요.</div></div>}
        {cats.map(cat=>{const ci=items.filter(i=>i.catId===cat.id);const sub=catTotal(cat.id);return(
            <div key={cat.id} className="cat-section">
                <div className="cat-header"><div className="cat-header-left"><div className="cat-bar"/><input className="cat-name-input" value={cat.name} onChange={e=>updCat(cat.id,e.target.value)}/><span className="cat-subtotal">소계 {fmt(sub)}원</span></div>
                <div style={{display:'flex',gap:8,alignItems:'center'}} className="no-print"><button className="btn btn-outline btn-sm" onClick={()=>addItem(cat.id)}>＋ 품목</button><button className="del-btn" onClick={()=>delCat(cat.id)}>🗑</button></div></div>
                <div className="table-wrap"><table>
                    <thead><tr><th className="tc" style={{width:52}}>사진</th><th style={{textAlign:'left',minWidth:130}}>품목/부품명</th><th style={{textAlign:'left',minWidth:100}}>규격/재질</th><th className="tr" style={{width:65}}>수량</th><th className="tr" style={{width:110}}>단가(원)</th><th className="tr" style={{width:115}}>합계(원)</th><th className="no-print" style={{width:34}}></th></tr></thead>
                    <tbody>
                        {ci.length===0&&<tr><td colSpan={7} style={{textAlign:'center',padding:16,color:'#94a3b8',fontSize:12}}>품목이 없습니다.</td></tr>}
                        {ci.map(item=><tr key={item.id}><td className="tc"><label className="img-lbl">{item.imgUrl?<img src={item.imgUrl} className="img-prev" alt=""/>:<div className="img-ph">+</div>}<input type="file" style={{display:'none'}} accept="image/*" onChange={e=>handleImg(e,item.id)}/></label></td><td><input className="cell-input" value={item.name} onChange={e=>updItem(item.id,'name',e.target.value)}/></td><td><input className="cell-input m" value={item.spec} onChange={e=>updItem(item.id,'spec',e.target.value)} placeholder="규격"/></td><td><input type="number" className="cell-input r" value={item.qty} onChange={e=>updItem(item.id,'qty',e.target.value)} min="0"/></td><td><input type="number" className="cell-input r" value={item.unitPrice} onChange={e=>updItem(item.id,'unitPrice',e.target.value)} min="0"/></td><td className="tr" style={{fontWeight:700,color:'var(--navy)'}}>{fmt(item.total)}</td><td className="tc no-print"><button className="del-btn" onClick={()=>delItem(item.id)}>✕</button></td></tr>)}
                        {ci.length>0&&<tr className="subtotal-row"><td colSpan={4}/><td className="tr subtotal-lbl">소 계</td><td className="tr subtotal-val">{fmt(sub)}원</td><td/></tr>}
                    </tbody>
                </table></div>
            </div>
        );})}

        {grand>0&&<div className="grand-card">
            <div><div className="grand-label">최종 견적금액 (VAT 포함)</div><div className="grand-val">{fmt(grandVat)}원</div><div className="grand-vat">공급가액 {fmt(grand)}원 + VAT {fmt(vat)}원</div></div>
            <div className="grand-breakdown">{[['공급가액',grand,false],['VAT 10%',vat,true]].map(([l,v,g])=><div className="bd-item" key={l}><div className="bd-label">{l}</div><div className="bd-val" style={g?{color:'var(--gold)'}:{}}>{fmt(v)}원</div></div>)}</div>
        </div>}
  
        {/* ★ 결제 정보 */}
        <div className="card" style={{marginTop:16}}>
            <div className="card-title">💳 결제 정보</div>
            <div className="pay-status-row">
                {['입금전','계약','완료'].map(s=>(
                    <button key={s} className={'pay-status-btn '+(paymentStatus===s?'ps-'+s:'')} onClick={()=>setPaymentStatus(s)}>
                        {s==='입금전'?'⏳ 입금전':s==='계약'?'📝 계약':'✅ 완료'}
                    </button>
                ))}
            </div>
            <div className="pay-grid">
                <div className="pay-field">
                    <div className="pay-label">계약금</div>
                    <input type="number" className="pay-input" value={depositAmount} min="0"
                        onChange={e=>setDepositAmount(e.target.value)} placeholder="금액 입력"/>
                    <div className="pay-sub">{fmt(depositNum)}원</div>
                </div>
                <div className="pay-field">
                    <div className="pay-label">중도금</div>
                    <input type="number" className="pay-input" value={midAmount} min="0"
                        onChange={e=>setMidAmount(e.target.value)} placeholder="금액 입력"/>
                    <div className="pay-sub">{fmt(midNum)}원</div>
                </div>
                <div className="pay-field">
                    <div className="pay-label">잔금 (자동계산)</div>
                    <input readOnly className={'pay-input auto '+(balancePaid||balanceAmount<=0&&grandVat>0?'zero':'')}
                        value={balancePaid?'0원':(grandVat>0?fmt(Math.max(0,balanceAmount))+'원':'-')}/>
                    <div className="pay-check-row">
                        <input type="checkbox" id="bpaid" className="pay-check"
                            checked={balancePaid} onChange={e=>setBalancePaid(e.target.checked)}/>
                        <label htmlFor="bpaid" className={'pay-check-lbl'+(balancePaid?' on':'')} style={{cursor:'pointer'}}>
                            잔금 입금 완료
                        </label>
                    </div>
                </div>
            </div>
        </div>

        {/* ★ 현장사진 */}
        <div className="card">
            <div className="card-title">📸 현장사진</div>
            <div className="site-photos-grid">
                {sitePhotos.map((photo,i)=>(
                    <div key={i} className="site-photo-item">
                        <img src={photo} className="site-photo-img" alt={'현장 '+(i+1)}/>
                        <button className="site-photo-del no-print"
                            onClick={()=>setSitePhotos(p=>p.filter((_,j)=>j!==i))}>✕</button>
                    </div>
                ))}
                <label className="site-photo-item site-photo-add no-print">
                    <span className="site-photo-add-icon">📷</span>
                    <span>사진 추가</span>
                    <input type="file" accept="image/*" multiple style={{display:'none'}}
                        onChange={async e=>{
                            const files=Array.from(e.target.files);e.target.value='';
                            for(const f of files){
                                const url=await uploadImg(sb,f,'site-photos');
                                setSitePhotos(p=>[...p,url]);
                            }
                        }}/>
                </label>
            </div>
            {sitePhotos.length===0&&<p style={{fontSize:12,color:'var(--muted)',marginTop:8}}>현장 사진을 추가하면 견적서에 함께 저장됩니다.</p>}
        </div>

        {/* ★ 소요 자재 */}
        <SoyoJaeCard sb={sb} estMaterials={estMaterials} setEstMaterials={setEstMaterials} uid={uid} items={items} cats={cats}/>

        {/* ★ 공구 · 부자재 */}
        <PrepCard estPrep={estPrep} setEstPrep={setEstPrep} uid={uid} items={items} cats={cats}/>


        {/* ★ 포트폴리오 첨부 */}
        <div className="card">
            <div className="card-title">🖼 포트폴리오 첨부</div>
            <div style={{marginBottom:10,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                <button className="btn btn-outline btn-sm" onClick={()=>setShowPortPick(true)}>＋ 포트폴리오 선택</button>
                <span style={{fontSize:11,color:'var(--muted)'}}>※ 인쇄 시 이미지와 링크가 포함됩니다</span>
            </div>
            {portItems.length===0
                ?<p style={{fontSize:12,color:'var(--muted)'}}>첨부된 포트폴리오가 없습니다.</p>
                :<div className="est-port-grid">
                    {portItems.map((p,i)=>(
                        <div key={i} className="est-port-item">
                            {p.image_url?<img src={p.image_url} className="est-port-img" alt=""/>
                                :<div className="est-port-img" style={{display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,color:'#94a3b8'}}>🖼</div>}
                            <div className="est-port-info">
                                {p.title}
                                <div style={{display:'flex',gap:4,marginTop:4,flexWrap:'wrap'}}>
                                    {p.image_url&&<a href={p.image_url} target="_blank" rel="noreferrer"><button className="btn btn-outline btn-xs" style={{fontSize:10}}>🔗 열기</button></a>}
                                    {p.image_url&&<button className="btn btn-outline btn-xs" style={{fontSize:10}} onClick={()=>{navigator.clipboard?.writeText(p.image_url).then(()=>toast('📋 복사됨')).catch(()=>alert(p.image_url));}}>📋 복사</button>}
                                </div>
                            </div>
                            <button className="est-port-del no-print" onClick={()=>setPortItems(prev=>prev.filter((_,j)=>j!==i))}>✕</button>
                        </div>
                    ))}
                </div>}
        </div>

        {/* 포트폴리오 선택 팝업 */}
        {showPortPick&&<PortPickModal sb={sb} portItems={portItems} setPortItems={setPortItems} onClose={()=>setShowPortPick(false)}/>}

        <div style={{textAlign:'center',marginTop:18,fontSize:11,color:'#94a3b8',paddingBottom:40}}>★ 럭키스타 캠핑카라반 | 경기도 파주시 광탄면 | {new Date().toLocaleDateString('ko-KR')} 기준</div>
    </div>);
}
/* ═══════════════════════════════════════
   ★ 포트폴리오 선택 모달 (견적서용)
═══════════════════════════════════════ */
function PortPickModal({sb, portItems, setPortItems, onClose}){
    const[all,setAll]=useState([]);
    const[loading,setLoading]=useState(true);
    const[sel,setSel]=useState(portItems.map(p=>p.id));

    useEffect(()=>{
        if(!sb)return;
        sb.from('portfolios').select('*').order('created_at',{ascending:false})
          .then(({data})=>{if(data)setAll(data);setLoading(false);});
    },[sb]);

    const toggle=item=>setSel(p=>p.includes(item.id)?p.filter(id=>id!==item.id):[...p,item.id]);

    const confirm=()=>{
        setPortItems(all.filter(a=>sel.includes(a.id)).map(a=>({id:a.id,title:a.title,image_url:a.image_url})));
        onClose();
    };

    return(
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box lg" onClick={e=>e.stopPropagation()}>
                <div className="modal-header">
                    <div className="modal-title">🖼 포트폴리오 선택</div>
                    <button className="modal-close" onClick={onClose}>✕</button>
                </div>
                {loading?<div style={{textAlign:'center',padding:40}}>로딩 중...</div>
                :all.length===0?<div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>등록된 포트폴리오가 없습니다.<br/>먼저 포트폴리오 메뉴에서 추가하세요.</div>
                :<div className="port-pick-grid" style={{maxHeight:'60vh',overflowY:'auto',padding:'4px 2px'}}>
                    {all.map(item=>(
                        <div key={item.id} className={`port-pick-card ${sel.includes(item.id)?'selected':''}`} onClick={()=>toggle(item)}>
                            {item.image_url?<img src={item.image_url} alt=""/>:<div className="port-pick-card-ph">🖼</div>}
                            <div className="port-pick-info">
                                {sel.includes(item.id)&&<span style={{color:'var(--green)',marginRight:4}}>✅</span>}
                                {item.title}
                            </div>
                        </div>
                    ))}
                </div>}
                <div className="modal-btns">
                    <button className="modal-cancel" onClick={onClose}>취소</button>
                    <button className="modal-ok" onClick={confirm}>{sel.length}개 선택 완료</button>
                </div>
            </div>
        </div>
    );
}

function PortfolioModal({sb, prodCats, initial, onClose, onSave}){
    const blank={title:'',description:'',image_url:'',categories:'[]'};
    const[form,setForm]=useState(()=>{
        if(!initial)return{...blank,_cats:[]};
        let cats=[];try{cats=typeof initial.categories==='string'?JSON.parse(initial.categories||'[]'):(initial.categories||[]);}catch{}
        return{...initial,_cats:cats};
    });
    const[uploading,setUploading]=useState(false);
    const set=(k,v)=>setForm(p=>({...p,[k]:v}));
    const toggleCat=id=>setForm(p=>({...p,_cats:p._cats.includes(id)?p._cats.filter(c=>c!==id):[...p._cats,id]}));
    const pickImg=async e=>{
        const f=e.target.files[0];if(!f)return;
        setUploading(true);
        try{const url=await uploadImg(sb,f,'portfolio');set('image_url',url);}
        finally{setUploading(false);}
    };
    const ok=()=>{
        if(!form.title.trim()){alert('제목을 입력하세요');return;}
        const{_cats,...rest}=form;
        onSave({...rest,categories:JSON.stringify(_cats)});
    };
    return(
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
                <div className="modal-header">
                    <div className="modal-title">{initial?'포트폴리오 수정':'포트폴리오 추가'}</div>
                    <button className="modal-close" onClick={onClose}>✕</button>
                </div>
                <div className="mf">
                    <label className="ml">이미지 *</label>
                    <label className="img-area" style={{display:'block',cursor:'pointer'}}>
                        {uploading?<div className="img-placeholder"><span>⏳</span>업로드 중...</div>
                        :form.image_url?<img src={form.image_url} alt="" style={{maxHeight:160,maxWidth:'100%',borderRadius:8,objectFit:'cover'}}/>
                        :<div className="img-placeholder"><span>📷</span>이미지 업로드</div>}
                        <input type="file" accept="image/*" style={{display:'none'}} onChange={pickImg}/>
                    </label>
                </div>
                <div className="mf"><label className="ml">제목 *</label><input className="mi" value={form.title} onChange={e=>set('title',e.target.value)} placeholder="작업명 입력"/></div>
                <div className="mf"><label className="ml">설명</label><input className="mi" value={form.description||''} onChange={e=>set('description',e.target.value)} placeholder="작업 설명 (선택)"/></div>
                <div className="mf">
                    <label className="ml">상품 분류 (해당 항목 체크)</label>
                    <div className="cat-check-grid">
                        {prodCats.map(c=>(
                            <label key={c.id} className={`cat-check-item ${form._cats.includes(c.id)?'checked':''}`} onClick={()=>toggleCat(c.id)}>
                                {form._cats.includes(c.id)?'✅':'⬜'} {c.name}
                            </label>
                        ))}
                        {prodCats.length===0&&<span style={{fontSize:12,color:'var(--muted)'}}>상품분류를 먼저 등록해 주세요.</span>}
                    </div>
                </div>
                <div className="modal-btns"><button className="modal-cancel" onClick={onClose}>취소</button><button className="modal-ok" onClick={ok}>저장</button></div>
            </div>
        </div>
    );
}

function Portfolio({sb, prodCats}){
    const[items,setItems]=useState([]);const[loading,setLoading]=useState(true);
    const[showModal,setShowModal]=useState(false);const[editing,setEditing]=useState(null);
    const[filterCat,setFilterCat]=useState(null);

    useEffect(()=>{
        if(!sb)return;
        sb.from('portfolios').select('*').order('created_at',{ascending:false})
          .then(({data})=>{if(data)setItems(data);setLoading(false);});
    },[sb]);

    const getCats=item=>{try{return typeof item.categories==='string'?JSON.parse(item.categories||'[]'):(item.categories||[]);}catch{return[];}};
    const catName=id=>prodCats.find(c=>c.id===id)?.name||'';

    const save=async form=>{
        setShowModal(false);setEditing(null);
        if(editing){
            const{data}=await sb.from('portfolios').update(form).eq('id',editing.id).select();
            if(data)setItems(p=>p.map(x=>x.id===editing.id?data[0]:x));
            toast('✅ 수정됨');
        }else{
            const{data}=await sb.from('portfolios').insert([form]).select();
            if(data)setItems(p=>[data[0],...p]);
            toast('✅ 추가됨');
        }
    };
    const del=async id=>{
        if(!confirm('삭제하시겠습니까?'))return;
        await sb.from('portfolios').delete().eq('id',id);
        setItems(p=>p.filter(x=>x.id!==id));
        toast('🗑 삭제됨');
    };

    const filtered=filterCat?items.filter(x=>getCats(x).includes(filterCat)):items;
    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;

    return(<div>
        {showModal&&<PortfolioModal sb={sb} prodCats={prodCats} initial={editing} onClose={()=>{setShowModal(false);setEditing(null);}} onSave={save}/>}
        <div className="page-header">
            <div className="page-title-wrap"><h1>🖼 포트폴리오</h1><p>작업 이미지 관리 · 견적서에 첨부 가능</p></div>
            <div className="btn-row"><button className="btn btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>＋ 포트폴리오 추가</button></div>
        </div>
        <div className="cat-filter">
            <div className={`cat-tab ${!filterCat?'active':''}`} onClick={()=>setFilterCat(null)}>전체 <span className="cnt">{items.length}</span></div>
            {prodCats.map(c=><div key={c.id} className={`cat-tab ${filterCat===c.id?'active':''}`} onClick={()=>setFilterCat(c.id)}>{c.name} <span className="cnt">{items.filter(x=>getCats(x).includes(c.id)).length}</span></div>)}
        </div>
        {filtered.length===0
            ?<div className="empty-state"><div className="empty-icon">🖼</div><div className="empty-text">포트폴리오가 없습니다.<br/>+ 포트폴리오 추가 버튼으로 시작하세요.</div></div>
            :<div className="port-grid">
                {filtered.map(item=>{
                    const cats=getCats(item);
                    return(<div key={item.id} className="port-card">
                        {item.image_url?<img src={item.image_url} className="port-card-img" alt=""/>:<div className="port-card-img-ph">🖼</div>}
                        <div className="port-card-body">
                            <div className="port-card-title">{item.title}</div>
                            <div className="port-card-cats">{cats.map(id=><span key={id} className="port-cat-tag">{catName(id)}</span>)}</div>
                            {item.description&&<div className="port-card-desc">{item.description}</div>}
                            <div className="port-card-actions">
                                {item.image_url&&<button className="btn btn-outline btn-sm" onClick={()=>{navigator.clipboard?.writeText(item.image_url).then(()=>toast('📋 링크 복사됨')).catch(()=>alert(item.image_url));}}>📋 링크복사</button>}
                                <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(item);setShowModal(true);}}>✏️</button>
                                <button className="btn btn-sm" style={{background:'#fee2e2',color:'var(--red)',border:'none'}} onClick={()=>del(item.id)}>🗑</button>
                            </div>
                        </div>
                    </div>);
                })}
            </div>}
    </div>);
}

   ★ 공구 · 부자재 카드 (견적서 하단)

const PREP_TYPES=[{key:'tool',label:'공구',icon:'🔧'},{key:'supply',label:'부자재',icon:'📎'}];

function PrepCard({estPrep,setEstPrep,uid,items,cats}){
    const[showAdd,setShowAdd]=useState(false);
    const[nf,setNf]=useState({type:'tool',name:'',qty:1});
    const groupsOf=type=>{
        const g={};
        estPrep.filter(r=>r.type===type).forEach(r=>{
            const k=r.type+'|'+r.name;
            if(!g[k])g[k]={key:k,name:r.name,qty:0,rows:[]};
            g[k].qty+=Number(r.qty)||0;
            g[k].rows.push(r);
        });
        return Object.values(g).map(x=>({...x,prods:collectProds(x.rows,items,cats)}));
    };
    const setQty=(g,q)=>setEstPrep(prev=>{
        const idxs=prev.map((r,i)=>(r.type+'|'+r.name)===g.key?i:-1).filter(i=>i>=0);
        if(!idxs.length)return prev;
        let remaining=q;
        const next=prev.slice();
        idxs.forEach((idx,n)=>{
            const orig=Number(prev[idx].qty)||0;
            const v=n===idxs.length-1?remaining:Math.min(orig,remaining);
            remaining-=v;
            next[idx]={...prev[idx],qty:v};
        });
        return next.filter(r=>!((r.type+'|'+r.name)===g.key&&!(Number(r.qty)>0)));
    });
    const del=g=>setEstPrep(prev=>prev.filter(r=>(r.type+'|'+r.name)!==g.key));
    const add=()=>{
        const name=nf.name.trim();
        if(!name){alert('이름을 입력하세요');return;}
        setEstPrep(p=>[...p,{id:uid(),type:nf.type,name,qty:Number(nf.qty)||1,itemId:null,itemName:'',checked:false}]);
        setNf(p=>({...p,name:'',qty:1}));
    };
    return(
        <div className="card">
            <div className="card-title">🧰 공구 · 부자재
                <span style={{fontSize:11,color:'var(--muted)',fontWeight:400,marginLeft:6}}>(상품 담을 때 자동 포함 · 시공 체크리스트에 출력)</span>
            </div>
            {PREP_TYPES.map(t=>{
                const list=groupsOf(t.key);
                return(<div key={t.key} style={{marginBottom:14}}>
                    <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1.5,textTransform:'uppercase',marginBottom:8}}>{t.icon} {t.label} ({list.length})</div>
                    {list.length===0
                        ?<p style={{fontSize:12,color:'var(--muted)'}}>항목이 없습니다.</p>
                        :<div className="table-wrap"><table style={{minWidth:520}}>
                            <thead><tr><th style={{textAlign:'left'}}>{t.label}명</th><th style={{textAlign:'left'}}>상품분류</th><th style={{textAlign:'left'}}>상품명</th><th className="tr" style={{width:100}}>수량</th><th style={{width:36}}></th></tr></thead>
                            <tbody>{list.map(g=>(
                                <tr key={g.key}>
                                    <td style={{fontWeight:700}}>{g.name}</td>
                                    {prodTds(g.prods)}
                                    <td className="tr" style={{padding:'4px 8px'}}>
                                        <input type="number" min="0" value={g.qty} onChange={e=>setQty(g,Number(e.target.value)||0)}
                                            style={{width:70,padding:'5px 8px',border:'1.5px solid var(--border)',borderRadius:6,fontSize:14,fontWeight:800,textAlign:'right'}}/>
                                    </td>
                                    <td style={{textAlign:'center'}}><button className="btn-icon" onClick={()=>del(g)}>✕</button></td>
                                </tr>
                            ))}</tbody>
                        </table></div>}
                </div>);
            })}
            {!showAdd
                ?<button className="btn btn-outline btn-sm" onClick={()=>setShowAdd(true)}>＋ 공구/부자재 직접 추가</button>
                :<div style={{background:'var(--bg)',borderRadius:10,padding:12}}>
                    <div style={{display:'grid',gridTemplateColumns:'110px minmax(0,2fr) 70px',gap:8,marginBottom:8}}>
                        <div><label className="ml">구분</label>
                            <select className="mi" value={nf.type} onChange={e=>setNf(p=>({...p,type:e.target.value}))}>
                                {PREP_TYPES.map(t=><option key={t.key} value={t.key}>{t.label}</option>)}
                            </select></div>
                        <div><label className="ml">이름</label><input className="mi" value={nf.name} autoFocus placeholder="이름 입력" onChange={e=>setNf(p=>({...p,name:e.target.value}))} onKeyDown={e=>{if(e.key==='Enter')add();}}/></div>
                        <div><label className="ml">수량</label><input className="mi" type="number" min="1" value={nf.qty} style={{textAlign:'right'}} onChange={e=>setNf(p=>({...p,qty:e.target.value}))}/></div>
                    </div>
                    <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                        <button className="btn btn-outline btn-sm" onClick={()=>setShowAdd(false)}>닫기</button>
                        <button className="btn btn-primary btn-sm" onClick={add}>추가</button>
                    </div>
                </div>}
        </div>
    );
}

/* ═══════════════════════════════════════
   ★ 시공 체크리스트 (필요자재 · 공구 · 부자재 + 체크 + 인쇄)

function ChecklistPage({sb,estimateId,onNavigate}){
    const[est,setEst]=useState(null);
    const[mats,setMats]=useState([]);
    const[prep,setPrep]=useState([]);
    const[loading,setLoading]=useState(true);

    useEffect(()=>{
        if(!sb||!estimateId){setLoading(false);return;}
        (async()=>{
            const{data}=await sb.from('estimates').select('*').eq('id',estimateId).single();
            if(data){setEst(data);setMats(parseJSON(data.est_materials,[]));setPrep(parseJSON(data.est_prep,[]));}
            setLoading(false);
        })();
    },[sb,estimateId]);

    const persist=async(col,rows)=>{
        const{error}=await sb.from('estimates').update({[col]:JSON.stringify(rows)}).eq('id',estimateId);
        if(error)toast('저장 실패: '+error.message);
    };
    const matKey=r=>r.material_id||r.name;
    const prepKey=r=>r.type+'|'+r.name;
    const group=(rows,keyFn)=>{
        const g={};
        rows.forEach(r=>{const k=keyFn(r);if(!k)return;if(!g[k])g[k]={key:k,name:r.name,qty:0,rows:[]};g[k].qty=Math.round((g[k].qty+(Number(r.qty)||0))*10)/10;g[k].rows.push(r);});
        return Object.values(g).filter(x=>x.qty>0);
    };
    const isOn=g=>g.rows.every(r=>r.checked);

    const sections=[
        {title:'📦 필요 자재',groups:group(mats,matKey),toggle:g=>{const v=!isOn(g);const next=mats.map(r=>matKey(r)===g.key?{...r,checked:v}:r);setMats(next);persist('est_materials',next);},reset:()=>{const n=mats.map(r=>({...r,checked:false}));setMats(n);persist('est_materials',n);}},
        {title:'🔧 공구',groups:group(prep.filter(r=>r.type==='tool'),prepKey),toggle:g=>{const v=!isOn(g);const next=prep.map(r=>prepKey(r)===g.key?{...r,checked:v}:r);setPrep(next);persist('est_prep',next);},reset:()=>{const n=prep.map(r=>r.type==='tool'?{...r,checked:false}:r);setPrep(n);persist('est_prep',n);}},
        {title:'📎 부자재',groups:group(prep.filter(r=>r.type==='supply'),prepKey),toggle:g=>{const v=!isOn(g);const next=prep.map(r=>prepKey(r)===g.key?{...r,checked:v}:r);setPrep(next);persist('est_prep',next);},reset:()=>{const n=prep.map(r=>r.type==='supply'?{...r,checked:false}:r);setPrep(n);persist('est_prep',n);}},
    ];
    const total=sections.reduce((s,x)=>s+x.groups.length,0);
    const done=sections.reduce((s,x)=>s+x.groups.filter(isOn).length,0);

    const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const printList=()=>{
        const blocks=sections.map(sec=>`<h3>${sec.title} (${sec.groups.length})</h3>
            ${sec.groups.length===0?'<p class="none">항목 없음</p>':`<table><tbody>${sec.groups.map(g=>`<tr><td class="ck"><span class="box">${isOn(g)?'✓':''}</span></td><td>${esc(g.name)}</td><td class="q">× ${g.qty}</td></tr>`).join('')}</tbody></table>`}`).join('');
        const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>시공 체크리스트</title>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
        <style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Noto Sans KR',sans-serif;padding:28px;color:#1e293b;font-size:14px;}
        h1{font-size:22px;font-weight:900;color:#0f1923;margin-bottom:4px;}.sub{font-size:12px;color:#64748b;margin-bottom:14px;}
        .info{background:#f4f6fa;border-radius:8px;padding:12px 16px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;}
        .info b{color:#475569;margin-right:6px;}
        h3{font-size:14px;font-weight:900;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid #0f1923;}
        table{width:100%;border-collapse:collapse;}td{padding:8px 6px;border-bottom:1px solid #e2e8f0;font-size:14px;}
        td.ck{width:38px;text-align:center;}td.q{width:80px;text-align:right;font-weight:700;}
        .box{display:inline-block;width:20px;height:20px;border:2px solid #0f1923;border-radius:4px;line-height:16px;text-align:center;font-weight:900;font-size:15px;}
        .none{font-size:12px;color:#94a3b8;padding:6px 0;}
        .ft{text-align:center;margin-top:18px;font-size:11px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:8px;}
        @media print{body{padding:14px;}}</style></head><body>
        <h1>시공 준비 체크리스트</h1><div class="sub">럭키스타 캠핑카라반 · 견적번호 ${esc(est?.est_no||'')} · 출력일 ${new Date().toLocaleDateString('ko-KR')}</div>
        <div class="info"><div><b>고객명</b>${esc(est?.client_name||'-')}</div><div><b>연락처</b>${esc(est?.client_phone||'-')}</div>
        <div><b>주소</b>${esc(est?.client_address||'-')}</div><div><b>담당자</b>${esc(est?.client_manager||'-')}</div></div>
        ${blocks}
        <div class="ft">★ 럭키스타 캠핑카라반 | 경기도 파주시 광탄면</div>
        <script>window.onload=()=>{window.print();}<\/script></body></html>`;
        const w=window.open('','_blank','width=800,height=900');
        if(w){w.document.write(html);w.document.close();}
    };

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    if(!est)return<div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">견적서를 찾을 수 없습니다.<br/><button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={()=>onNavigate('est-list')}>목록으로</button></div></div>;

    return(<div>
        <div className="page-header">
            <div className="page-title-wrap"><h1>✅ 시공 체크리스트</h1>
                <p>{est.client_name||'고객'} · {est.est_no||''} · 체크하면 바로 저장됩니다</p></div>
            <div className="btn-row no-print">
                <button className="btn btn-outline" onClick={()=>onNavigate('est-edit',estimateId)}>← 견적서</button>
                <button className="btn btn-outline" onClick={()=>onNavigate('est-list')}>목록</button>
                <button className="btn btn-primary" onClick={printList}>🖨 체크리스트 인쇄</button>
            </div>
        </div>
        <div className="est-badge">
            <div><div className="est-badge-label">준비 현황</div><span className="est-badge-num">{done} / {total}</span></div>
            <div className="est-badge-sep"/>
            <div style={{color:'rgba(255,255,255,.7)',fontSize:13}}>{total>0&&done===total?'🎉 모두 준비 완료!':'준비 중'}</div>
        </div>
        {sections.map(sec=>{
            const n=sec.groups.filter(isOn).length;
            return(<div className="card" key={sec.title}>
                <div className="card-title">{sec.title} <span style={{fontWeight:400,color:'var(--muted)',textTransform:'none'}}>({n}/{sec.groups.length})</span>
                    {sec.groups.length>0&&<button className="btn btn-outline btn-xs no-print" style={{marginLeft:8}} onClick={sec.reset}>전체 해제</button>}</div>
                {sec.groups.length===0
                    ?<p style={{fontSize:12,color:'var(--muted)'}}>항목이 없습니다.</p>
                    :sec.groups.map(g=>{const on=isOn(g);return(
                        <label key={g.key} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 4px',borderBottom:'1px solid var(--border)',cursor:'pointer'}}>
                            <input type="checkbox" className="status-check" style={{width:22,height:22}} checked={on} onChange={()=>sec.toggle(g)}/>
                            <span style={{flex:1,fontWeight:700,fontSize:14,textDecoration:on?'line-through':'none',color:on?'var(--muted)':'var(--navy)'}}>{g.name}</span>
                            <span style={{fontFamily:'Bebas Neue,sans-serif',fontSize:18,letterSpacing:1,color:'var(--navy)'}}>× {g.qty}</span>
                        </label>);})}
            </div>);
        })}
    </div>);
}

function ToolModal({sb,toolCats,initial,onClose,onSave}){
    const blank={category_id:'',name:'',specification:'',category_extra:'',memo:'',image_url:''};
    const[form,setForm]=useState(initial?{...blank,...initial}:blank);
    const set=(k,v)=>setForm(p=>({...p,[k]:v}));
    const ok=()=>{
        if(!(form.name||'').trim()){alert('품명을 입력하세요');return;}
        onSave({category_id:form.category_id||null,name:form.name.trim(),specification:form.specification||'',category_extra:form.category_extra||'',memo:form.memo||'',image_url:form.image_url||''});
    };
    return(<div className="modal-overlay" onClick={onClose}>
        <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><div className="modal-title">{initial?'공구/부자재 수정':'새 공구/부자재 등록'}</div><button className="modal-close" onClick={onClose}>✕</button></div>
            <div className="mf"><label className="ml">사진</label><ImgUpload sb={sb} folder="tools" value={form.image_url} onChange={v=>set('image_url',v)}/></div>
            <div className="modal-grid">
                <div className="mf"><label className="ml">분류</label>
                    <select className="mi" value={form.category_id||''} onChange={e=>set('category_id',e.target.value)}>
                        <option value="">분류 선택</option>
                        {toolCats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select></div>
                <div className="mf"><label className="ml">품명 *</label><input className="mi" value={form.name||''} onChange={e=>set('name',e.target.value)} placeholder="품명 입력" autoFocus/></div>
                <div className="mf"><label className="ml">규격/재질</label><input className="mi" value={form.specification||''} onChange={e=>set('specification',e.target.value)} placeholder="규격 입력"/></div>
                <div className="mf"><label className="ml">기타구분</label><input className="mi" value={form.category_extra||''} onChange={e=>set('category_extra',e.target.value)} placeholder="예: 전동, 소모품"/></div>
                <div className="mf full"><label className="ml">메모</label><input className="mi" value={form.memo||''} onChange={e=>set('memo',e.target.value)} placeholder="기타 메모"/></div>
            </div>
            <div className="modal-btns"><button className="modal-cancel" onClick={onClose}>취소</button><button className="modal-ok" onClick={ok}>저장</button></div>
        </div>
    </div>);
}

function ToolList({sb,toolCats,onAddToolCat,initialCatId}){
    const[tools,setTools]=useState([]);const[loading,setLoading]=useState(true);
    const[dbErr,setDbErr]=useState('');
    const[activeCat,setActiveCat]=useState(initialCatId||null);
    const[showModal,setShowModal]=useState(false);const[editing,setEditing]=useState(null);
    const[search,setSearch]=useState('');

    useEffect(()=>{setActiveCat(initialCatId||null);},[initialCatId]);
    useEffect(()=>{
        if(!sb)return;
        sb.from('tools').select('*').order('name',{ascending:true}).then(({data,error})=>{
            if(error)setDbErr(error.message);else if(data)setTools(data);
            setLoading(false);
        });
    },[sb]);

    const fail=e=>alert('저장 실패: '+e.message+(/relation|does not exist|schema cache/.test(e.message)?'\n\nSupabase SQL Editor에서 아래를 실행하세요:\n\n'+SQL_TOOLS:''));
    const save=async form=>{
        if(editing){
            const{data,error}=await sb.from('tools').update(form).eq('id',editing.id).select();
            if(error){fail(error);return;}
            if(data)setTools(p=>p.map(x=>x.id===editing.id?data[0]:x).sort((a,b)=>a.name.localeCompare(b.name,'ko')));
            toast('✅ 수정됨');
        }else{
            const{data,error}=await sb.from('tools').insert([form]).select();
            if(error){fail(error);return;}
            if(data)setTools(p=>[...p,data[0]].sort((a,b)=>a.name.localeCompare(b.name,'ko')));
            toast('✅ 등록됨');
        }
        setShowModal(false);setEditing(null);
    };
    const del=async id=>{if(!confirm('삭제?'))return;await sb.from('tools').delete().eq('id',id);setTools(p=>p.filter(x=>x.id!==id));toast('🗑 삭제됨');};
    const catName=id=>toolCats.find(c=>c.id===id)?.name||'미분류';
    const q=search.toLowerCase();
    const filtered=tools
        .filter(x=>!activeCat||x.category_id===activeCat)
        .filter(x=>!q||(x.name||'').toLowerCase().includes(q)||(x.specification||'').toLowerCase().includes(q)||(x.category_extra||'').toLowerCase().includes(q)||(x.memo||'').toLowerCase().includes(q));

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    if(dbErr)return(<div>
        <div className="page-header"><div className="page-title-wrap"><h1>🧰 공구/부자재 관리</h1><p>DB 테이블 설정이 필요합니다</p></div></div>
        <div className="card">
            <div className="card-title">⚙️ 먼저 한 번만 실행하세요</div>
            <p style={{fontSize:13,color:'var(--muted)',marginBottom:10}}>Supabase → SQL Editor에 아래 내용을 붙여넣고 실행한 뒤 새로고침하세요.</p>
            <pre style={{background:'var(--bg)',borderRadius:8,padding:14,fontSize:12,overflowX:'auto',whiteSpace:'pre-wrap'}}>{SQL_TOOLS}</pre>
            <button className="btn btn-outline btn-sm" style={{marginTop:10}} onClick={()=>{navigator.clipboard?.writeText(SQL_TOOLS).then(()=>toast('📋 SQL 복사됨')).catch(()=>alert(SQL_TOOLS));}}>📋 SQL 복사</button>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:10}}>오류 내용: {dbErr}</div>
        </div>
    </div>);

    return(<div>
        {showModal&&<ToolModal sb={sb} toolCats={toolCats} initial={editing} onClose={()=>{setShowModal(false);setEditing(null);}} onSave={save}/>}
        <div className="page-header">
            <div className="page-title-wrap"><h1>🧰 공구/부자재 관리</h1><p>공구 · 부자재 등록 · 분류별 관리 · 이름순 정렬</p></div>
            <div className="btn-row">
                <button className="btn btn-outline" onClick={onAddToolCat}>＋ 분류 추가</button>
                <button className="btn btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>＋ 공구/부자재 등록</button>
            </div>
        </div>
        <div className="cat-filter">
            <div className={`cat-tab ${!activeCat?'active':''}`} onClick={()=>setActiveCat(null)}>전체 <span className="cnt">{tools.length}</span></div>
            {toolCats.map(c=><div key={c.id} className={`cat-tab ${activeCat===c.id?'active':''}`} onClick={()=>setActiveCat(c.id)}>{c.name} <span className="cnt">{tools.filter(x=>x.category_id===c.id).length}</span></div>)}
        </div>
        <div style={{marginBottom:14}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 품명 · 규격 · 기타구분 · 메모 검색..."
                style={{width:'100%',padding:'9px 14px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:13,fontFamily:'Noto Sans KR,sans-serif',outline:'none'}}
                onFocus={e=>e.target.style.borderColor='var(--blue)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
        </div>
        {filtered.length===0
            ?<div className="empty-state"><div className="empty-icon">🧰</div><div className="empty-text">{search?'검색 결과가 없습니다.':'등록된 공구/부자재가 없습니다.'}</div></div>
            :<div className="table-wrap"><table style={{minWidth:700}}>
                <thead><tr>
                    <th style={{width:50}}>사진</th>
                    <th style={{textAlign:'left'}}>품명</th>
                    <th style={{textAlign:'left'}}>분류</th>
                    <th style={{textAlign:'left'}}>규격/재질</th>
                    <th style={{textAlign:'left'}}>기타구분</th>
                    <th style={{textAlign:'left'}}>메모</th>
                    <th style={{textAlign:'center',width:80}}>관리</th>
                </tr></thead>
                <tbody>{filtered.map(x=>(
                    <tr key={x.id}>
                        <td style={{textAlign:'center'}}>{x.image_url?<img src={x.image_url} style={{width:36,height:36,objectFit:'cover',borderRadius:5,border:'1px solid var(--border)'}} alt=""/>:<span style={{fontSize:18}}>🧰</span>}</td>
                        <td style={{fontWeight:700}}>{x.name}</td>
                        <td style={{fontSize:12,color:'var(--muted)'}}>{catName(x.category_id)}</td>
                        <td style={{fontSize:12,color:'var(--muted)'}}>{x.specification||'-'}</td>
                        <td style={{fontSize:12,color:'var(--muted)'}}>{x.category_extra||'-'}</td>
                        <td style={{fontSize:12,color:'var(--muted)'}}>{x.memo||'-'}</td>
                        <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                            <button className="btn-icon" onClick={()=>{setEditing(x);setShowModal(true);}}>✏️</button>
                            <button className="btn-icon" onClick={()=>del(x.id)}>🗑</button>
                        </td>
                    </tr>
                ))}</tbody>
            </table></div>}
    </div>);
}

function EstimateView({sb,estimateId,onNavigate}){
    const[est,setEst]=useState(null);
    const[cats,setCats]=useState([]);
    const[items,setItems]=useState([]);
    const[loading,setLoading]=useState(true);
    const[pfMap,setPfMap]=useState({}); // 상품명 → 연결된 포트폴리오 ID들
    const[holdDays,setHoldDays]=useState(SETTINGS_DEFAULT.holdDays);
    useEffect(()=>{if(sb)loadSettings(sb).then(s=>setHoldDays(s.holdDays));},[sb]);

    useEffect(()=>{
        if(!sb||!estimateId){setLoading(false);return;}
        (async()=>{
            const{data}=await sb.from('estimates').select('*').eq('id',estimateId).single();
            if(data)setEst(data);
            const{data:cd}=await sb.from('est_cats').select('*').eq('estimate_id',estimateId).order('display_order');
            const mc=cd||[];setCats(mc);
            if(mc.length>0){
                const{data:idt}=await sb.from('est_items').select('*').in('cat_id',mc.map(c=>c.id)).order('display_order');
                setItems(idt||[]);
            }
            const{data:pr}=await sb.from('products').select('name,portfolio_ids');
            const mp={};(pr||[]).forEach(x=>{const ids=parseJSON(x.portfolio_ids,[]);if(ids.length&&!mp[x.name])mp[x.name]=ids;});
            setPfMap(mp);
            setLoading(false);
        })();
    },[sb,estimateId]);

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    if(!est)return<div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">견적서를 찾을 수 없습니다.<br/><button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={()=>onNavigate('est-list')}>목록으로</button></div></div>;

    const{sd,sc,stage,hold,label:stageLabel}=estStageInfo(est,holdDays);
    const photos=parseJSON(est.site_photos,[]);
    const ports=parseJSON(est.portfolio_items,[]);
    const rowTotal=i=>(Number(i.total_amount)||((Number(i.quantity)||0)*(Number(i.unit_price)||0)+(Number(i.labor_cost)||0)));
    const totalMat=items.reduce((s,i)=>s+(Number(i.quantity)||0)*(Number(i.unit_price)||0),0);
    const totalLab=items.reduce((s,i)=>s+(Number(i.labor_cost)||0),0);
    const grand=totalMat+totalLab;const vat=Math.round(grand*.1);const grandVat=grand+vat;
    const dep=Number(est.deposit_amount)||0,mid=Number(est.mid_amount)||0;
    const bal=est.balance_paid?0:Math.max(0,grandVat-dep-mid);
    const tel=(est.client_phone||'').replace(/[^0-9+]/g,'');
    const mtel=(est.manager_phone||'').replace(/[^0-9+]/g,'');
    const PAY_ICON={'입금전':'⏳','계약':'📝','완료':'✅'};

    const printView=()=>{
        const step=sendStepOnPrint(stage,sd,sc,hold);
        if(step&&window.confirm(hold?`⏸ 보류 중인 견적입니다.\n${step}을 다시 발송 처리하시겠습니까?`:`${step} 완료 처리하시겠습니까?`)){
            const nd={...sd,[step]:new Date().toISOString()};
            const upd={status:getStage({sd:nd,sc,deposit:est.deposit_amount,balancePaid:est.balance_paid}),status_dates:JSON.stringify(nd)};
            sb.from('estimates').update(upd).eq('id',estimateId).then(({error})=>{
                if(error){toast('⚠️ 상태 저장 실패: '+error.message);return;}
                setEst(p=>({...p,...upd}));toast('📤 '+step+' 처리됨');
            });
        }
        printEstimateDoc(sb,{no:est.est_no||estimateId.substr(0,8).toUpperCase(),
            client:{name:est.client_name,phone:est.client_phone,address:est.client_address,manager:est.client_manager,managerPhone:est.manager_phone},
            cats,items:items.map(i=>({catId:i.cat_id,name:i.name,spec:i.specification,qty:i.quantity,unitPrice:i.unit_price,total:rowTotal(i)})),
            portItems:ports});
    };
    const telLink=(t,label)=>t?<a href={'tel:'+t} style={{color:'var(--blue)',fontWeight:700,textDecoration:'none'}}>📞 {label}</a>:'-';
    const infoField=([l,v])=><div className="info-field" key={l}><label>{l}</label><div style={{fontSize:14,fontWeight:600,color:'var(--navy)',padding:'4px 0'}}>{v}</div></div>;

    return(<div>
        <div className="view-sticky">
        <div className="page-header">
            <div className="page-title-wrap"><h1>📄 견적서 보기</h1><p>{est.client_name||'고객'} · {est.est_no||''}</p></div>
            <div className="btn-row no-print">
                <button className="btn btn-outline" onClick={()=>onNavigate('est-list')}>← 목록으로</button>
                <button className="btn btn-outline" onClick={()=>onNavigate('est-checklist',estimateId)}>✅ 시공 체크리스트</button>
                <button className="btn btn-outline" onClick={printView}>🖨 인쇄</button>
                <button className="btn btn-primary" onClick={()=>onNavigate('est-edit',estimateId)}>✏️ 견적 수정</button>
            </div>
        </div>

        <div className="est-badge">
            <div><div className="est-badge-label">견적번호</div><span className="est-badge-num">{est.est_no||estimateId.substr(0,8).toUpperCase()}</span></div>
            <div className="est-badge-sep"/>
            <div><div className="est-badge-label">작성일</div><span style={{color:'#fff',fontSize:14,fontWeight:600}}>{est.created_at?new Date(est.created_at).toLocaleDateString('ko-KR'):'-'}</span></div>
            <div className="est-badge-sep"/>
            <div><div className="est-badge-label">상태</div><StatusBadge status={stageLabel}/></div>
        </div>

        <div className="card"><div className="view-info">
            <div className="view-info-client"><div className="card-title">고객 정보</div>
                <div className="info-grid">

function EstimateList({sb,onEdit,onNew,onChecklist,onView}){
    const[estimates,setEstimates]=useState([]);
    const[loading,setLoading]=useState(true);
    const[statusFilter,setStatusFilter]=useState(null);
    const[payFilter,setPayFilter]=useState(null);
    const[q,setQ]=useState('');
    const[holdDays,setHoldDays]=useState(SETTINGS_DEFAULT.holdDays);

    useEffect(()=>{
        if(!sb)return;
        (async()=>{setLoading(true);const{data}=await sb.from('estimates').select('*').order('created_at',{ascending:false});if(data)setEstimates(data);setLoading(false);})();
        loadSettings(sb).then(s=>setHoldDays(s.holdDays));
    },[sb]);
    const labelOf=e=>estStageInfo(e,holdDays).label;
    const del=async id=>{
        if(!confirm('견적서를 삭제하시겠습니까?'))return;
        await sb.from('estimates').delete().eq('id',id);
        setEstimates(p=>p.filter(e=>e.id!==id));toast('🗑 삭제됨');
    };

    const STATUS_DASH=['가견적발송','방문상담 및 실측','본견적발송','제작중','설치완료','보류','추가방문'];
    const PAY_DASH=['입금전','계약'];
    const labels=Object.fromEntries(estimates.map(e=>[e.id,labelOf(e)]));
    const hasExtra=e=>pendingExtras(e).length>0;
    const sCount=s=>s==='추가방문'?estimates.filter(hasExtra).length:estimates.filter(e=>labels[e.id]===s).length;
    const pCount=p=>estimates.filter(e=>(e.payment_status||'입금전')===p).length;
    const STATUS_DASH_STYLE={...Object.fromEntries(STATUS_DASH.map(s=>[s,{color:STATUS_COLOR[s],bg:STATUS_BG[s]}])),'추가방문':{color:EXTRA_TYPES['AS'].color,bg:EXTRA_TYPES['AS'].bg}};
    const DASH_TEXT={...STATUS_TEXT,'추가방문':'추가 방문 예정'};const DASH_ICON={...STATUS_ICON,'추가방문':'🔧'};
    const PAY_STYLE={'입금전':{color:'#b91c1c',bg:'#fee2e2'},'계약':{color:'#854d0e',bg:'#fef9c3'}};

    // 검색: 고객명·연락처·주소·견적번호 (검색 중에는 보류 견적도 표시)
    const qs=q.trim().toLowerCase();const qd=qs.replace(/[^0-9]/g,'');
    const matchQ=e=>!qs||[e.client_name,e.client_address,e.est_no].some(v=>(v||'').toLowerCase().includes(qs))||(qd.length>=3&&(e.client_phone||'').replace(/[^0-9]/g,'').includes(qd));
    const filtered=estimates.filter(e=>{
        if(statusFilter==='추가방문'){if(!hasExtra(e))return false;}
        else if(statusFilter&&labels[e.id]!==statusFilter)return false;
        if(!statusFilter&&!qs&&labels[e.id]==='보류')return false; // 보류는 기본으로 숨김
        if(payFilter&&(e.payment_status||'입금전')!==payFilter)return false;
        return matchQ(e);
    });
    const hiddenHold=!statusFilter&&!qs?sCount('보류'):0;
    const toggleSF=s=>setStatusFilter(p=>p===s?null:s);
    const togglePF=p=>setPayFilter(p2=>p2===p?null:p);

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;

    return(<div>
        <div className="page-header">
            <div className="page-title-wrap"><h1>📂 견적 목록</h1><p>카드 클릭으로 필터링 · 진행 상태는 견적서에서 자동으로 바뀝니다</p></div>
            <div className="btn-row"><button className="btn btn-primary" onClick={onNew}>＋ 새 견적서</button></div>
        </div>

        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:16}}>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 고객명 · 연락처 · 주소 · 견적번호 검색 (보류 견적 포함)"
                style={{flex:1,maxWidth:520,border:'1.5px solid var(--border)',borderRadius:8,padding:'10px 14px',fontSize:13,fontFamily:"'Noto Sans KR',sans-serif",outline:'none',background:'#fff'}}/>
            {q&&<button className="btn btn-outline btn-sm" onClick={()=>setQ('')}>✕ 지우기</button>}
        </div>

        <div className="dash-section-title">진행상태</div>
        <div className="dash-grid" style={{marginBottom:10}}>
            {STATUS_DASH.map(s=>{
                const st=STATUS_DASH_STYLE[s]||{};const isActive=statusFilter===s;
                return(<div key={s} className={`dash-card ${isActive?'active':''}`}
                    style={{color:st.color,background:isActive?st.bg:'#fff',borderColor:isActive?st.color:'var(--border)'}}
                    onClick={()=>toggleSF(s)}>
                    <div className="dash-card-type">진행상태</div>
                    <div className="dash-card-num">{sCount(s)}</div>
                    <div className="dash-card-label">{DASH_ICON[s]} {DASH_TEXT[s]||s}</div>
                </div>);
            })}
        </div>

        <div className="dash-section-title" style={{marginTop:4}}>결제상태</div>
        <div className="dash-grid" style={{gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',marginBottom:18}}>
            {PAY_DASH.map(p=>{
                const st=PAY_STYLE[p]||{};const isActive=payFilter===p;
                return(<div key={p} className={`dash-card ${isActive?'active':''}`}
                    style={{color:st.color,background:isActive?st.bg:'#fff',borderColor:isActive?st.color:'var(--border)'}}
                    onClick={()=>togglePF(p)}>
                    <div className="dash-card-type">결제상태</div>
                    <div className="dash-card-num">{pCount(p)}</div>
                    <div className="dash-card-label">{p==='입금전'?'⏳':'📝'} {p}</div>
                </div>);
            })}
        </div>

        {(statusFilter||payFilter)&&(
            <div className="filter-active-bar">
                <span>🔍 필터:</span>
                {statusFilter&&<span style={{color:STATUS_DASH_STYLE[statusFilter]?.color||'var(--navy)',fontWeight:800}}>{DASH_ICON[statusFilter]} {DASH_TEXT[statusFilter]||statusFilter}</span>}
                {statusFilter&&payFilter&&<span>+</span>}
                {payFilter&&<span style={{color:PAY_STYLE[payFilter]?.color,fontWeight:800}}>{payFilter}</span>}
                <span style={{marginLeft:'auto',color:'var(--muted)',fontSize:11}}>{filtered.length}건</span>
                <button onClick={()=>{setStatusFilter(null);setPayFilter(null);}}>✕</button>
            </div>
        )}

        {hiddenHold>0&&<div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>⏸ 보류 견적 {hiddenHold}건은 숨겨져 있습니다 — 위의 '보류' 카드를 누르거나 검색하면 볼 수 있습니다.</div>}
        {estimates.length===0
            ?<div className="empty-state"><div className="empty-icon">📂</div><div className="empty-text">저장된 견적서가 없습니다.</div></div>
            :filtered.length===0
            ?<div className="empty-state"><div className="empty-icon">🔍</div><div className="empty-text">해당 조건의 견적서가 없습니다.<br/><button className="btn btn-outline btn-sm" style={{marginTop:8}} onClick={()=>{setStatusFilter(null);setPayFilter(null);setQ('');}}>필터 초기화</button></div></div>
            :<div className="est-list-wrap" style={{overflowX:'auto'}}><table style={{minWidth:600}}>
                <thead><tr>
                    <th style={{textAlign:'left'}}>견적번호</th>
                    <th style={{textAlign:'left'}}>고객명</th>
                    <th style={{textAlign:'left'}}>연락처</th>
                    <th className="tr">공급가액(원)</th>
                    <th style={{textAlign:'left',minWidth:180}}>진행상태</th>
                    <th style={{textAlign:'left'}}>결제</th>
                    <th style={{textAlign:'left'}}>작성일</th>
                    <th className="tc" style={{width:110}}>관리</th>
                </tr></thead>
                <tbody>
                    {filtered.map(est=>{
                        const ps=est.payment_status||'입금전';
                        const pst=PAY_STYLE[ps]||{};
                        return(<tr key={est.id}>
                            <td><div className="est-no">{est.est_no||est.id?.substr(0,8).toUpperCase()}</div></td>
                            <td><div className="est-client" title="견적서 보기" style={onView?{cursor:'pointer',color:'var(--blue)',textDecoration:'underline',textUnderlineOffset:3}:{}} onClick={()=>onView&&onView(est.id)}>{est.client_name||'-'}</div></td>
                            <td style={{fontSize:12}}>{est.client_phone?<a href={'tel:'+est.client_phone.replace(/[^0-9+]/g,'')} title="전화 걸기" style={{color:'var(--blue)',textDecoration:'none',fontWeight:600,whiteSpace:'nowrap'}}>📞 {est.client_phone}</a>:<span style={{color:'var(--muted)'}}>-</span>}</td>
                            <td className="tr"><div className="est-amount">{fmt(est.total_supply||0)}</div></td>
                            <td><StatusBadge status={labels[est.id]}/>
                                {pendingExtras(est).map(v=>{const tp=EXTRA_TYPES[v.type]||EXTRA_TYPES['기타'];return<span key={v.id} className="status-badge" title={v.reason||''} style={{marginLeft:4,background:tp.bg,color:tp.color}}>{tp.icon} {v.type} {fmtDT(v.at).split(' ').slice(0,2).join(' ')}</span>;})}</td>
                            <td><span style={{fontSize:11,fontWeight:700,color:pst.color,background:pst.bg,padding:'2px 8px',borderRadius:10,whiteSpace:'nowrap'}}>{ps==='입금전'?'⏳':ps==='계약'?'📝':'✅'} {ps}</span></td>
                            <td style={{fontSize:12,color:'var(--muted)'}}>{est.created_at?new Date(est.created_at).toLocaleDateString('ko-KR'):'-'}</td>
                            <td className="tc">
                                {onChecklist&&<button className="btn-icon" title="시공 체크리스트" onClick={()=>onChecklist(est.id)}>✅</button>}
                                <button className="btn-icon" onClick={()=>onEdit(est.id)}>✏️</button>
                                <button className="btn-icon" onClick={()=>del(est.id)}>🗑</button>
                            </td>
                        </tr>);
                    })}
                </tbody>
            </table></div>}
    </div>);
}
