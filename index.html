    const ok=()=>{if(!form.name.trim()){alert('품명을 입력하세요');return;}
        if(!subId){alert('하위분류를 선택하세요.\n(하위분류가 없으면 ＋ 새 하위분류로 먼저 만드세요)');return;}
        const{stock_qty,...rest}=form;onSave(initial?rest:form);};
    return(<div className="modal-overlay" onClick={onClose}>
        <div className="modal-box lg" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><div className="modal-title">{initial?'자재 수정':'새 자재 등록'}</div><button className="modal-close" onClick={onClose}>✕</button></div>
            <div className="mf"><label className="ml">사진</label><ImgUpload sb={sb} folder="materials" value={form.image_url} onChange={v=>set('image_url',v)}/></div>
            <div className="modal-grid">
                <div className="mf"><label className="ml">분류 *</label><select className="mi" value={topId} onChange={e=>{setTopId(e.target.value);set('category_id','');}}><option value="">분류 선택</option>{topMatCats(matCats).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                <div className="mf"><label className="ml">하위분류 *</label>
                    <div style={{display:'flex',gap:6}}>
                        <select className="mi" style={{flex:1}} value={subId} disabled={!topId} onChange={e=>set('category_id',e.target.value)}>
                            <option value="">{!topId?'분류를 먼저 선택':subs.length?'하위분류 선택':'하위분류 없음 → ＋ 로 추가'}</option>
                            {subs.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
                        {topId&&<button type="button" className="btn btn-outline btn-sm" onClick={addSub}>＋</button>}
                    </div>
                    {initial&&!subId&&topId&&<div style={{fontSize:11,color:'#b45309',marginTop:3}}>하위분류 미지정 — 저장하려면 하위분류를 고르세요</div>}
                </div>
                <div className="mf"><label className="ml">품명 *</label><input className="mi" value={form.name||''} onChange={e=>set('name',e.target.value)} placeholder="자재명 입력"/></div>
                <div className="mf"><label className="ml">재질/색상</label><input className="mi" value={form.specification||''} onChange={e=>set('specification',e.target.value)} placeholder="예: 화이트, 오크, 스테인리스"/></div>
                <div className="mf"><label className="ml">규격/두께</label><input className="mi" value={form.thickness||''} onChange={e=>set('thickness',e.target.value)} placeholder="예: 1220×2440, 18mm, 2T"/></div>
                <div className="mf"><label className="ml">기타구분</label><input className="mi" value={form.category_extra||''} onChange={e=>set('category_extra',e.target.value)} placeholder="예: 외부용, 방수, A등급"/></div>
                <div className="mf"><label className="ml">단가(원)</label><input className="mi" type="number" value={form.unit_price||0} onChange={e=>set('unit_price',Number(e.target.value))} min="0"/></div>
                <div className="mf"><label className="ml">가공비(원)</label><input className="mi" type="number" value={form.processing_cost||0} onChange={e=>set('processing_cost',Number(e.target.value))} min="0"/></div>
                <div className="mf"><label className="ml">재고수량{initial?' (목록의 ✏️ 재고 수정에서 변경)':' (처음 수량)'}</label><input className="mi" type="number" value={form.stock_qty||0} readOnly={!!initial} style={initial?{background:'#f1f5f9'}:undefined} onChange={e=>set('stock_qty',Number(e.target.value))} min="0"/></div>
                <div className="mf"><label className="ml">제조사</label><input className="mi" value={form.manufacturer||''} onChange={e=>set('manufacturer',e.target.value)} placeholder="제조사명"/></div>
                <div className="mf"><label className="ml">공급업체</label>
                    <select className="mi" value={form.supplier||''} onChange={e=>set('supplier',e.target.value)}>
                        <option value="">공급업체 선택</option>
                        {(suppliers||[]).map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                        <option value="__direct__">직접 입력...</option>
                    </select>
                    {form.supplier==='__direct__'&&<input className="mi" style={{marginTop:6}} placeholder="업체명 직접 입력" onChange={e=>set('supplier',e.target.value)}/>}
                </div>
                <div className="mf"><label className="ml">구매링크</label><input className="mi" value={form.purchase_link||''} onChange={e=>set('purchase_link',e.target.value)} placeholder="https://..."/></div>
                <div className="mf full"><label className="ml">메모</label><input className="mi" value={form.memo||''} onChange={e=>set('memo',e.target.value)} placeholder="기타 메모"/></div>
                <div className="mf full"><label className="ml">견적서 파일</label><FileUpload sb={sb} folder="quotes" value={form.quote_file_url} fileName={form.quote_file_name} onChange={(url,name)=>{set('quote_file_url',url);set('quote_file_name',name);}}/></div>
            </div>
            <div className="modal-btns"><button className="modal-cancel" onClick={onClose}>취소</button><button className="modal-ok" onClick={ok}>저장</button></div>
        </div>
    </div>);
}

function MaterialList({sb,matCats,suppliers,onAddMatCat,onAddSubCat,onRenameMatCat,onDelMatCat,initialCatId,openMatId,onOpened}){
    const[materials,setMaterials]=useState([]);const[loading,setLoading]=useState(true);
    const[activeCat,setActiveCat]=useState(initialCatId||null); // 상위분류
    const[activeSub,setActiveSub]=useState(null);               // 하위분류 (null=전체, 'none'=하위분류 미지정)
    useEffect(()=>{setActiveCat(initialCatId||null);},[initialCatId]); // 사이드바 분류 클릭 시 목록 갱신
    useEffect(()=>{setActiveSub(null);},[activeCat]);
    const[showModal,setShowModal]=useState(false);const[editing,setEditing]=useState(null);
    const[search,setSearch]=useState('');const[importing,setImporting]=useState(false);
    const[orderCart,setOrderCart]=useState([]); // 발주서 카트
    const[stockMat,setStockMat]=useState(null); // 재고 수정 창에 연 자재
    const[showOrderQty,setShowOrderQty]=useState(null); // 수량입력 팝업
    const[orderQtyVal,setOrderQtyVal]=useState(1);
    const[showOrderForm,setShowOrderForm]=useState(false); // 발주서 양식

    useEffect(()=>{
        if(!sb)return;
        sb.from('materials').select('*').order('name',{ascending:true}).then(({data})=>{if(data)setMaterials(data);setLoading(false);
            if(data&&openMatId){const t=data.find(x=>x.id===openMatId);if(t){setEditing(t);setShowModal(true);}else{toast('자재를 찾을 수 없습니다');}if(onOpened)onOpened();}
        });
    },[sb]);

    const save=async form=>{
        setShowModal(false);setEditing(null);
        if(editing){
            const{data}=await sb.from('materials').update(form).eq('id',editing.id).select();
            if(data)setMaterials(p=>p.map(m=>m.id===editing.id?data[0]:m).sort((a,b)=>a.name.localeCompare(b.name,'ko')));toast('✅ 수정됨');
        }else{
            const{data}=await sb.from('materials').insert([form]).select();
            if(data)setMaterials(p=>[...p,data[0]].sort((a,b)=>a.name.localeCompare(b.name,'ko')));toast('✅ 자재 등록됨');
        }
    };
    const del=async id=>{if(!confirm('삭제?'))return;await sb.from('materials').delete().eq('id',id);setMaterials(p=>p.filter(m=>m.id!==id));toast('🗑 삭제됨');};
    const catName=id=>matCatLabel(matCats,id);
    const isSub=id=>!!(matCats.find(c=>c.id===id)||{}).parent_id;

    // ★ 엑셀 내보내기 (분류 · 하위분류 따로)
    const exportExcel=()=>{
        const headers=['자재ID','품명','분류','하위분류','재질/색상','규격/두께','단가(원)','가공비(원)','재고수량','제조사','공급업체','기타구분','메모','구매링크'];
        const nm=id=>(matCats.find(c=>c.id===id)||{}).name||'';
        const rows=materials.map(m=>[m.id,m.name||'',nm(matTopId(matCats,m.category_id)),isSub(m.category_id)?nm(m.category_id):'',m.specification||'',m.thickness||'',m.unit_price||0,m.processing_cost||0,m.stock_qty||0,m.manufacturer||'',m.supplier||'',m.category_extra||'',m.memo||'',m.purchase_link||'']);
        const wb=XLSX.utils.book_new();
        const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
        ws['!cols']=[{wch:38},{wch:22},{wch:12},{wch:12},{wch:16},{wch:8},{wch:10},{wch:10},{wch:8},{wch:14},{wch:14},{wch:12},{wch:18},{wch:30}];
        XLSX.utils.book_append_sheet(wb,ws,'자재목록');
        XLSX.writeFile(wb,'럭키스타_자재목록.xlsx');
        toast('📊 엑셀 저장됨');
    };

    // ★ 엑셀 가져오기 (업로드 후 수정/추가)
    const importExcel=async e=>{
        const file=e.target.files[0];if(!file)return;
        e.target.value='';
        setImporting(true);
        try{
            const ab=await file.arrayBuffer();
            const wb=XLSX.read(ab,{type:'array'});
            const ws=wb.Sheets[wb.SheetNames[0]];
            const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
            if(rows.length<2){alert('데이터가 없습니다.');return;}
            const hdr=rows[0];
            const col=k=>hdr.indexOf(k);
            let added=0,updated=0,errors=0;
            const cats=[...matCats]; // 가져오는 중 새로 만든 하위분류도 바로 찾을 수 있게
            for(let i=1;i<rows.length;i++){
                const r=rows[i];
                const name=String(r[col('품명')]||'').trim();
                if(!name)continue;
                const catStr=String(r[col('분류')]||'').trim();
                const subStr=col('하위분류')>=0?String(r[col('하위분류')]||'').trim():'';
                const catObj=topMatCats(cats).find(c=>c.name===catStr);
                // 하위분류: 이름이 있으면 그 상위분류 아래에서 찾고, 없으면 새로 만듦 (비어 있으면 상위분류에 '하위분류 미지정'으로)
                let subObj=catObj&&subStr?subMatCats(cats,catObj.id).find(c=>c.name===subStr):null;
                if(catObj&&subStr&&!subObj){subObj=await onAddSubCat(catObj.id,subStr,true);if(subObj)cats.push(subObj);}
                const payload={
                    name,
                    category_id:subObj?subObj.id:catObj?catObj.id:null,
                    specification:String(r[col('재질/색상')>=0?col('재질/색상'):col('규격/재질')]||''), // 예전 엑셀(규격/재질·두께)도 읽음
                    thickness:String(r[col('규격/두께')>=0?col('규격/두께'):col('두께')]||''),
                    unit_price:Number(r[col('단가(원)')])||0,
                    processing_cost:Number(r[col('가공비(원)')])||0,
                    stock_qty:Number(r[col('재고수량')])||0,
                    manufacturer:String(r[col('제조사')]||''),
                    supplier:String(r[col('공급업체')]||''),
                    category_extra:String(r[col('기타구분')]||''),
                    memo:String(r[col('메모')]||''),
                    purchase_link:String(r[col('구매링크')]||''),
                };
                // 자재ID 칸이 있으면 ID로 찾음(품명을 바꿔도 같은 자재), 비어 있으면 예전처럼 품명으로 찾음
                const idStr=col('자재ID')>=0?String(r[col('자재ID')]||'').trim():'';
                const existing=idStr?materials.find(m=>m.id===idStr):materials.find(m=>m.name===name);
                if(existing){
                    const{error}=await sb.from('materials').update(payload).eq('id',existing.id);
                    if(!error)updated++;else errors++;
                }else{
                    const{error}=await sb.from('materials').insert([payload]);
                    if(!error)added++;else errors++;
                }
            }
            // 다시 로드
            const{data}=await sb.from('materials').select('*').order('name',{ascending:true});
            if(data)setMaterials(data);
            alert(`가져오기 완료
추가: ${added}건  수정: ${updated}건${errors>0?' 오류: '+errors+'건':''}`);
        }catch(err){
            alert('오류: '+err.message);
        }finally{setImporting(false);}
    };

    // ★ 필터 + 검색 + 정렬(이름순)
    const filtered=materials
        .filter(m=>!activeCat||matTopId(matCats,m.category_id)===activeCat)
        .filter(m=>!activeSub||(activeSub==='none'?m.category_id===activeCat:m.category_id===activeSub))
        .filter(m=>!search||m.name.toLowerCase().includes(search.toLowerCase())||
            (m.specification||'').toLowerCase().includes(search.toLowerCase())||
            (m.supplier||'').toLowerCase().includes(search.toLowerCase()));

    // ★ 발주서 출력
    const printOrder=(supName,items)=>{
        const sup=suppliers.find(s=>s.name===supName)||{};
        const rows=items.map(it=>`<tr>
            <td>${it.mat.name}</td>
            <td>${it.mat.specification||''}</td>
            <td>${it.mat.thickness||''}</td>
            <td style="text-align:right;font-weight:700">${it.qty}</td>
        </tr>`).join('');
        const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>발주서-${supName}</title>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
        <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Noto Sans KR',sans-serif;padding:30px;color:#1e293b;font-size:13px;background:#fff;}
        h1{font-size:22px;font-weight:900;margin-bottom:4px;color:#0f1923;}
        .sub{font-size:12px;color:#64748b;margin-bottom:18px;}
        .info{background:#f4f6fa;border-radius:8px;padding:14px 18px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .info-row{font-size:12px;color:#1e293b;}.info-label{font-weight:700;color:#475569;margin-right:8px;}
        table{width:100%;border-collapse:collapse;margin-bottom:16px;}
        thead{background:#0f1923;}
        th{color:#fff;padding:8px 10px;font-size:11px;letter-spacing:.5px;text-align:left;font-weight:700;}
        td{padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;color:#1e293b;}
        .footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:16px;border-top:1px solid #e2e8f0;padding-top:10px;}
        @media print{body{padding:15px;}}
        </style></head><body>
        <h1>발주서 (PURCHASE ORDER)</h1>
        <div class="sub">발주일: ${new Date().toLocaleDateString('ko-KR')} &nbsp;|&nbsp; 럭키스타 캠핑카라반</div>
        <div class="info">
            <div class="info-row"><span class="info-label">공급업체</span>${supName}</div>
            <div class="info-row"><span class="info-label">사업자번호</span>${sup.business_no||'-'}</div>
            <div class="info-row"><span class="info-label">담당자</span>${sup.contact_person||'-'}</div>
            <div class="info-row"><span class="info-label">연락처</span>${sup.phone||'-'}</div>
            <div class="info-row"><span class="info-label">주소</span>${sup.address||'-'}</div>
            <div class="info-row"><span class="info-label">발주처</span>${sup.order_to||'-'}</div>
        </div>
        <table>
            <thead><tr><th>품명</th><th>재질/색상</th><th>규격/두께</th><th style="text-align:right">발주수량</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>
        <div class="footer">★ 럭키스타 캠핑카라반 | 경기도 파주시 광탄면</div>
        <script>window.onload=()=>{window.print();}<\/script></body></html>`;
        const w=window.open('','_blank','width=800,height=600');
        if(w){w.document.write(html);w.document.close();}
    };

    // ★ 발주 완료 처리
    const completeOrder=async(supName)=>{
        if(!confirm(`[${supName}] 발주 완료 처리하시겠습니까?
재고 수량이 발주 수량만큼 증가합니다.`))return;
        const items=orderCart.filter(it=>it.mat.supplier===supName);
        for(const it of items){
            // 입고: 재고 입출고 기록에 남김
            const newQty=await adjustStock(sb,{materialId:it.mat.id,delta:it.qty,reason:'입고',memo:supName+' 발주 완료'});
            setMaterials(p=>p.map(m=>m.id===it.mat.id?{...m,stock_qty:newQty}:m));
        }
        setOrderCart(p=>p.filter(it=>it.mat.supplier!==supName));
        toast('✅ 발주 완료 — 재고 반영됨');
    };

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    return(<div>
        {stockMat&&<StockModal sb={sb} mat={stockMat} onClose={()=>setStockMat(null)} onChanged={q=>{setMaterials(p=>p.map(m=>m.id===stockMat.id?{...m,stock_qty:q}:m));setStockMat(s=>({...s,stock_qty:q}));}}/>}
        {showModal&&<MaterialModal sb={sb} matCats={matCats} suppliers={suppliers||[]} initial={editing} defaultCatId={activeSub&&activeSub!=='none'?activeSub:(activeCat||'')} onAddSubCat={onAddSubCat} onClose={()=>{setShowModal(false);setEditing(null);}} onSave={save}/>}
        <div className="page-header">
            <div className="page-title-wrap"><h1>📦 자재 관리</h1><p>자재 등록 · 단가 · 재고 · 이름순 정렬</p></div>
            <div className="btn-row">
                <button className="btn btn-outline" onClick={onAddMatCat}>＋ 분류 추가</button>
                <button className="btn btn-outline" onClick={exportExcel}>📊 엑셀 저장</button>
                <label className={`btn btn-outline ${importing?'disabled':''}`} style={{cursor:'pointer'}}>
                    {importing?'⏳ 가져오는 중...':'📥 엑셀 가져오기'}
                    <input type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={importExcel} disabled={importing}/>
                </label>
                <button className="btn btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>＋ 자재 등록</button>
                {orderCart.length>0&&<div className="cart-badge">
                    <button className="btn btn-gold" onClick={()=>setShowOrderForm(true)}>📋 발주서 ({orderCart.length})</button>
                    <span className="cart-count">{orderCart.length}</span>
                </div>}
            </div>
        </div>
        {/* 카테고리 필터 */}
        <div className="cat-filter">
            <div className={`cat-tab ${!activeCat?'active':''}`} onClick={()=>setActiveCat(null)}>전체 <span className="cnt">{materials.length}</span></div>
            {topMatCats(matCats).map(c=><div key={c.id} className={`cat-tab ${activeCat===c.id?'active':''}`} onClick={()=>setActiveCat(c.id)}>{c.name} <span className="cnt">{materials.filter(m=>matTopId(matCats,m.category_id)===c.id).length}</span></div>)}
        </div>
        {/* 하위분류 — 상위분류를 고르면 표시 */}
        {activeCat&&(()=>{
            const subs=subMatCats(matCats,activeCat),noneCnt=materials.filter(m=>m.category_id===activeCat).length;
            const chip=on=>({display:'inline-flex',alignItems:'center',gap:4,padding:'4px 12px',borderRadius:16,fontSize:12,fontWeight:700,cursor:'pointer',border:'1.5px solid '+(on?'var(--blue)':'var(--border)'),background:on?'#eff6ff':'#fff',color:on?'var(--blue)':'var(--text)'});
            const sub=subs.find(c=>c.id===activeSub);
            return(<div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',margin:'-4px 0 12px',padding:'8px 10px',background:'#f8fafc',borderRadius:10}}>
                <span style={{fontSize:12,color:'var(--muted)',fontWeight:700}}>하위분류</span>
                <span style={chip(!activeSub)} onClick={()=>setActiveSub(null)}>전체</span>
                {subs.map(c=><span key={c.id} style={chip(activeSub===c.id)} onClick={()=>setActiveSub(c.id)}>{c.name} <span style={{fontWeight:400,color:'var(--muted)'}}>{materials.filter(m=>m.category_id===c.id).length}</span></span>)}
                {noneCnt>0&&<span style={{...chip(activeSub==='none'),color:activeSub==='none'?'#b45309':'#b45309',borderColor:activeSub==='none'?'#b45309':'#fcd34d'}} onClick={()=>setActiveSub('none')}>⚠ 하위분류 미지정 {noneCnt}</span>}
                <span style={{...chip(false),borderStyle:'dashed',color:'var(--muted)'}} onClick={()=>{const n=(window.prompt('새 하위분류 이름')||'').trim();if(n)onAddSubCat(activeCat,n).then(c=>c&&setActiveSub(c.id));}}>＋ 하위분류</span>
                {sub&&<>
                    <button className="btn btn-outline btn-xs" onClick={()=>{const n=(window.prompt('하위분류 이름 수정',sub.name)||'').trim();if(n&&n!==sub.name)onRenameMatCat(sub.id,n);}}>✏️ 이름 수정</button>
                    <button className="btn btn-outline btn-xs" style={{color:'var(--red)'}} onClick={()=>{onDelMatCat(sub.id);setActiveSub(null);}}>✕ 삭제</button>
                </>}
            </div>);
        })()}
        {/* 검색 */}
        <div style={{marginBottom:14}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 품명 · 재질/색상 · 공급업체 검색..."
                style={{width:'100%',padding:'9px 14px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:13,fontFamily:'Noto Sans KR,sans-serif',outline:'none'}}
                onFocus={e=>e.target.style.borderColor='var(--blue)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
        </div>
        {/* ★ 수량입력 팝업 */}
        {showOrderQty&&(<div className="modal-overlay" onClick={()=>setShowOrderQty(null)}>
            <div className="modal-box sm" style={{maxWidth:320}} onClick={e=>e.stopPropagation()}>
                <div className="modal-header"><div className="modal-title">📋 발주서에 담기</div><button className="modal-close" onClick={()=>setShowOrderQty(null)}>✕</button></div>
                <div style={{padding:'8px 0 16px'}}>
                    <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>{showOrderQty.name}</div>
                    <div className="mf"><label className="ml">발주 수량</label>
                        <input type="number" className="mi" value={orderQtyVal} min="1" autoFocus
                            onChange={e=>setOrderQtyVal(Number(e.target.value)||1)}/>
                    </div>
                    <div style={{fontSize:12,color:'var(--muted)',marginTop:8}}>
                        단가: {fmt(showOrderQty.unit_price||0)}원 + 가공비: {fmt(showOrderQty.processing_cost||0)}원
                    </div>
                </div>
                <div className="modal-btns">
                    <button className="modal-cancel" onClick={()=>setShowOrderQty(null)}>취소</button>
                    <button className="modal-ok" onClick={()=>{
                        const exists=orderCart.find(x=>x.mat.id===showOrderQty.id);
                        if(exists){setOrderCart(p=>p.map(x=>x.mat.id===showOrderQty.id?{...x,qty:x.qty+orderQtyVal}:x));}
                        else{setOrderCart(p=>[...p,{mat:showOrderQty,qty:orderQtyVal}]);}
                        setShowOrderQty(null);toast('📋 발주서에 담겼습니다');
                    }}>담기</button>
                </div>
            </div>
        </div>)}

        {/* ★ 발주서 양식 */}
        {showOrderForm&&(<div className="modal-overlay" onClick={()=>setShowOrderForm(false)}>
            <div className="modal-box lg" style={{maxWidth:900,maxHeight:'90vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
                <div className="modal-header">
                    <div className="modal-title">📋 발주서</div>
                    <button className="modal-close" onClick={()=>setShowOrderForm(false)}>✕</button>
                </div>
                {orderCart.length===0?<div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>발주서에 담긴 자재가 없습니다.</div>
                :(()=>{
                    // 업체별 그룹핑
                    const groups={};
                    orderCart.forEach(it=>{const k=it.mat.supplier||'공급업체 미지정';if(!groups[k])groups[k]=[];groups[k].push(it);});
                    return Object.entries(groups).map(([supName,items])=>{
                        const total=items.reduce((s,it)=>s+((it.mat.unit_price||0)+(it.mat.processing_cost||0))*it.qty,0);
                        const sup=suppliers.find(s=>s.name===supName);
                        return(<div key={supName} className="order-section">
                            <div className="order-section-header">
                                <div>
                                    <div className="order-supplier-name">🏢 {supName}</div>
                                    {sup&&<div className="order-supplier-meta">{sup.contact_person&&sup.contact_person+' '}{sup.phone&&'| '+sup.phone}{sup.order_to&&' | '+sup.order_to}</div>}
                                </div>
                                <div style={{display:'flex',gap:8}}>
                                    <button className="btn btn-sm" style={{background:'#f0a500',color:'#0f1923',border:'none',fontWeight:700}} onClick={()=>printOrder(supName,items)}>🖨 발주서 인쇄</button>
                                    <button className="btn btn-sm" style={{background:'var(--green)',color:'#fff',border:'none'}} onClick={()=>completeOrder(supName)}>✅ 발주 완료</button>
                                </div>
                            </div>
                            <div style={{overflowX:'auto'}}>
                            <table className="order-table" style={{minWidth:600}}>
                                <thead><tr>
                                    <th>품명</th><th>재질/색상</th><th>규격/두께</th>
                                    <th className="tr">발주수량</th>
                                    <th className="tr">단가(원)</th><th className="tr">가공비(원)</th>
                                    <th className="tr">금액(원)</th><th style={{width:40}}></th>
                                </tr></thead>
                                <tbody>{items.map((it,i)=>(
                                    <tr key={i}>
                                        <td style={{fontWeight:700}}>{it.mat.name}</td>
                                        <td style={{fontSize:12,color:'var(--muted)'}}>{it.mat.specification||'-'}</td>
                                        <td style={{fontSize:12,color:'var(--muted)'}}>{it.mat.thickness||'-'}</td>
                                        <td className="tr">
                                            <input type="number" className="qty-input order-table" min="1" value={it.qty}
                                                onChange={e=>setOrderCart(p=>p.map((x,j)=>x.mat.id===it.mat.id?{...x,qty:Number(e.target.value)||1}:x))}/>
                                        </td>
                                        <td className="tr">{fmt(it.mat.unit_price||0)}</td>
                                        <td className="tr" style={{color:'var(--orange)'}}>{fmt(it.mat.processing_cost||0)}</td>
                                        <td className="tr" style={{fontWeight:700}}>{fmt(((it.mat.unit_price||0)+(it.mat.processing_cost||0))*it.qty)}</td>
                                        <td style={{textAlign:'center'}}>
                                            <button className="btn-icon" onClick={()=>setOrderCart(p=>p.filter(x=>x.mat.id!==it.mat.id))}>✕</button>
                                        </td>
                                    </tr>
                                ))}</tbody>
                            </table>
                            </div>
                            <div className="order-footer">
                                <span style={{fontSize:12,color:'var(--muted)'}}>{items.length}개 품목</span>
                                <div className="order-total">발주 합계: <span>{fmt(total)}원</span></div>
                            </div>
                        </div>);
                    });
                })()}
                <div className="modal-btns">
                    <button className="modal-cancel" onClick={()=>setOrderCart([])}>🗑 전체 비우기</button>
                    <button className="modal-ok" onClick={()=>setShowOrderForm(false)}>닫기</button>
                </div>
            </div>
        </div>)}

        {filtered.length===0?<div className="empty-state"><div className="empty-icon">📦</div><div className="empty-text">{search?'검색 결과가 없습니다.':'자재가 없습니다.'}</div></div>
        :<div className="table-wrap"><table style={{minWidth:900}}>
            <thead><tr>
                <th style={{width:50}}>사진</th>
                <th style={{textAlign:'left'}}>품명</th>
                <th style={{textAlign:'left'}}>분류</th>
                <th style={{textAlign:'left'}}>재질/색상</th>
                <th style={{textAlign:'left'}}>규격/두께</th>
                <th className="tr">단가(원)</th>
                <th className="tr">가공비(원)</th>
                <th className="tr">재고</th>
                <th style={{textAlign:'left'}}>제조사</th>
                <th style={{textAlign:'left'}}>공급업체</th>
                <th style={{textAlign:'left'}}>기타구분</th>
                <th style={{textAlign:'center',width:70}}>링크</th>
                <th style={{textAlign:'center',width:70}}>견적서</th>
                <th style={{textAlign:'center',width:70}}>관리</th>
            </tr></thead>
            <tbody>{filtered.map(m=>(
                <tr key={m.id}>
                    <td style={{textAlign:'center'}}>{m.image_url?<img src={m.image_url} style={{width:36,height:36,objectFit:'cover',borderRadius:5,border:'1px solid var(--border)'}} alt=""/>:<span style={{fontSize:18}}>📦</span>}</td>
                    <td style={{fontWeight:700}}>{m.name}</td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>{catName(m.category_id)}{m.category_id&&!isSub(m.category_id)&&matCats.some(c=>c.id===m.category_id)&&<div style={{color:'#b45309',fontSize:11}}>하위분류 미지정</div>}</td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>{m.specification||'-'}</td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>{m.thickness||'-'}</td>
                    <td className="tr" style={{fontWeight:700}}>{fmt(m.unit_price||0)}</td>
                    <td className="tr" style={{color:'var(--orange)',fontWeight:700}}>{fmt(m.processing_cost||0)}</td>
                    <td className="tr" style={{color:(m.stock_qty||0)<=0?'var(--red)':'inherit',fontWeight:700,whiteSpace:'nowrap'}}>{m.stock_qty||0}
                        <button className="btn-icon" style={{fontSize:12}} title="재고 수량 수정 · 입출고 기록" onClick={()=>setStockMat(m)}>✏️</button></td>
                    <td style={{fontSize:12}}>{m.manufacturer||'-'}</td>
                    <td style={{fontSize:12}}>{m.supplier||'-'}</td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>{m.category_extra||'-'}</td>
                    <td style={{textAlign:'center'}}>
                        {m.purchase_link?<a href={m.purchase_link} target="_blank" rel="noreferrer">
                            <button className="btn btn-outline btn-xs" style={{whiteSpace:'nowrap'}}>🔗 열기</button>
                        </a>:<span style={{fontSize:11,color:'var(--muted)'}}>-</span>}
                    </td>
                    <td style={{textAlign:'center'}}>
                        {m.quote_file_url?<a href={m.quote_file_url} target="_blank" rel="noreferrer" title={m.quote_file_name||'견적서'}>
                            <button className="btn btn-outline btn-xs" style={{whiteSpace:'nowrap'}}>📄 보기</button>
                        </a>:<span style={{fontSize:11,color:'var(--muted)'}}>-</span>}
                    </td>
                    <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                        <button className="btn btn-outline btn-xs" style={{marginBottom:3}} onClick={()=>{setShowOrderQty(m);setOrderQtyVal(1);}}>📋담기</button>
                        <br/>
                        <button className="btn-icon" onClick={()=>{setEditing(m);setShowModal(true);}}>✏️</button>
                        <button className="btn-icon" onClick={()=>del(m.id)}>🗑</button>
                    </td>
                </tr>
            ))}</tbody>
        </table></div>}
    </div>);
}


/* ═══════════════════════════════════════
   ★ 외주 관리 (자재분류와 동일 구조: 분류 + 품목)
═══════════════════════════════════════ */
function OutsourcingModal({sb,outCats,suppliers,initial,onClose,onSave}){
    const blank={category_id:'',name:'',specification:'',unit_price:0,supplier:'',category_extra:'',purchase_link:'',image_url:'',memo:'',quote_file_url:'',quote_file_name:''};
    const[form,setForm]=useState(initial?{...initial}:blank);
    const set=(k,v)=>setForm(p=>({...p,[k]:v}));
    const ok=()=>{if(!form.name.trim()){alert('품목명을 입력하세요');return;}onSave(form);};
    return(<div className="modal-overlay">
        <div className="modal-box lg" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><div className="modal-title">{initial?'외주 품목 수정':'새 외주 품목 등록'}</div><button className="modal-close" onClick={onClose}>✕</button></div>
            <div className="mf"><label className="ml">사진</label><ImgUpload sb={sb} folder="outsourcing" value={form.image_url} onChange={v=>set('image_url',v)}/></div>
            <div className="modal-grid">
                <div className="mf"><label className="ml">분류</label><select className="mi" value={form.category_id||''} onChange={e=>set('category_id',e.target.value)}><option value="">분류 선택</option>{outCats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                <div className="mf"><label className="ml">품목명 *</label><input className="mi" value={form.name||''} onChange={e=>set('name',e.target.value)} placeholder="외주 품목명 입력"/></div>
                <div className="mf full"><label className="ml">규격/작업내용</label><input className="mi" value={form.specification||''} onChange={e=>set('specification',e.target.value)} placeholder="규격 또는 작업 내용"/></div>
                <div className="mf"><label className="ml">단가(원)</label><input className="mi" type="number" value={form.unit_price||0} onChange={e=>set('unit_price',Number(e.target.value))} min="0"/></div>
                <div className="mf"><label className="ml">기타구분</label><input className="mi" value={form.category_extra||''} onChange={e=>set('category_extra',e.target.value)} placeholder="예: 긴급, A업체 전용"/></div>
                <div className="mf"><label className="ml">외주업체</label>
                    <select className="mi" value={form.supplier||''} onChange={e=>set('supplier',e.target.value)}>
                        <option value="">외주업체 선택</option>
                        {(suppliers||[]).map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                        <option value="__direct__">직접 입력...</option>
                    </select>
                    {form.supplier==='__direct__'&&<input className="mi" style={{marginTop:6}} placeholder="업체명 직접 입력" onChange={e=>set('supplier',e.target.value)}/>}
                </div>
                <div className="mf"><label className="ml">참고링크</label><input className="mi" value={form.purchase_link||''} onChange={e=>set('purchase_link',e.target.value)} placeholder="https://..."/></div>
                <div className="mf full"><label className="ml">메모</label><input className="mi" value={form.memo||''} onChange={e=>set('memo',e.target.value)} placeholder="기타 메모"/></div>
                <div className="mf full"><label className="ml">견적서 파일</label><FileUpload sb={sb} folder="out-quotes" value={form.quote_file_url} fileName={form.quote_file_name} onChange={(url,name)=>{set('quote_file_url',url);set('quote_file_name',name);}}/></div>
            </div>
            <div className="modal-btns"><button className="modal-cancel" onClick={onClose}>취소</button><button className="modal-ok" onClick={ok}>저장</button></div>
        </div>
    </div>);
}

function OutsourcingList({sb,outCats,suppliers,onAddOutCat,initialCatId}){
    const[items,setItems]=useState([]);const[loading,setLoading]=useState(true);
    const[activeCat,setActiveCat]=useState(initialCatId||null);
    const[showModal,setShowModal]=useState(false);const[editing,setEditing]=useState(null);
    const[search,setSearch]=useState('');

    useEffect(()=>{
        if(!sb)return;
        sb.from('outsourcing_items').select('*').order('name',{ascending:true}).then(({data,error})=>{if(error)console.warn('outsourcing_items 로드 오류:',error.message);if(data)setItems(data);setLoading(false);});
    },[sb]);

    const save=async form=>{
        setShowModal(false);setEditing(null);
        if(editing){
            const{data,error}=await sb.from('outsourcing_items').update(form).eq('id',editing.id).select();
            if(error){toast('오류: '+error.message);return;}
            if(data)setItems(p=>p.map(m=>m.id===editing.id?data[0]:m).sort((a,b)=>a.name.localeCompare(b.name,'ko')));toast('✅ 수정됨');
        }else{
            const{data,error}=await sb.from('outsourcing_items').insert([form]).select();
            if(error){toast('오류: '+error.message);return;}
            if(data)setItems(p=>[...p,data[0]].sort((a,b)=>a.name.localeCompare(b.name,'ko')));toast('✅ 외주 품목 등록됨');
        }
    };
    const del=async id=>{if(!confirm('삭제?'))return;await sb.from('outsourcing_items').delete().eq('id',id);setItems(p=>p.filter(m=>m.id!==id));toast('🗑 삭제됨');};
    const catName=id=>outCats.find(c=>c.id===id)?.name||'미분류';

    const exportExcel=()=>{
        const headers=['품목명','분류','규격/작업내용','단가(원)','외주업체','기타구분','메모','참고링크'];
        const rows=items.map(m=>[m.name||'',catName(m.category_id),m.specification||'',m.unit_price||0,m.supplier||'',m.category_extra||'',m.memo||'',m.purchase_link||'']);
        const wb=XLSX.utils.book_new();
        const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
        ws['!cols']=[{wch:22},{wch:12},{wch:24},{wch:10},{wch:14},{wch:12},{wch:18},{wch:30}];
        XLSX.utils.book_append_sheet(wb,ws,'외주목록');
        XLSX.writeFile(wb,'럭키스타_외주목록.xlsx');
        toast('📊 엑셀 저장됨');
    };

    const showSqlGuide=()=>alert(`📋 외주관리 Supabase 테이블 생성 안내\n\n`+
`CREATE TABLE IF NOT EXISTS outsourcing_categories (\n  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,\n  name TEXT,\n  display_order INT DEFAULT 0\n);\n`+
`ALTER TABLE outsourcing_categories ENABLE ROW LEVEL SECURITY;\nDROP POLICY IF EXISTS staff_all ON outsourcing_categories;\nCREATE POLICY staff_all ON outsourcing_categories FOR ALL TO authenticated USING (public.is_staff()) WITH CHECK (public.is_staff());\n\n`+
`CREATE TABLE IF NOT EXISTS outsourcing_items (\n  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,\n  category_id UUID REFERENCES outsourcing_categories(id) ON DELETE SET NULL,\n  name TEXT,\n  specification TEXT,\n  unit_price NUMERIC DEFAULT 0,\n  supplier TEXT,\n  category_extra TEXT,\n  purchase_link TEXT,\n  image_url TEXT,\n  memo TEXT,\n  quote_file_url TEXT,\n  quote_file_name TEXT,\n  created_at TIMESTAMPTZ DEFAULT NOW()\n);\n`+
`ALTER TABLE outsourcing_items ENABLE ROW LEVEL SECURITY;\nDROP POLICY IF EXISTS staff_all ON outsourcing_items;\nCREATE POLICY staff_all ON outsourcing_items FOR ALL TO authenticated USING (public.is_staff()) WITH CHECK (public.is_staff());`);

    const filtered=koSort(items
        .filter(m=>!activeCat||m.category_id===activeCat)
        .filter(m=>!search||m.name.toLowerCase().includes(search.toLowerCase())||
            (m.specification||'').toLowerCase().includes(search.toLowerCase())||
            (m.supplier||'').toLowerCase().includes(search.toLowerCase())),'name');

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    return(<div className="list-page">
        {showModal&&<OutsourcingModal sb={sb} outCats={outCats} suppliers={suppliers||[]} initial={editing} onClose={()=>{setShowModal(false);setEditing(null);}} onSave={save}/>}
        <div className="page-header">
            <div className="page-title-wrap"><h1>🛠 외주 관리</h1><p>외주 품목 등록 · 분류별 단가 관리</p></div>
            <div className="btn-row">
                <button className="btn btn-outline" onClick={onAddOutCat}>＋ 분류 추가</button>
                <button className="btn btn-outline" onClick={exportExcel}>📊 엑셀 저장</button>
                <button className="btn btn-outline" style={{fontSize:11,padding:'6px 10px',color:'var(--muted)'}} onClick={showSqlGuide}>⚙️ DB 안내</button>
                <button className="btn btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>＋ 외주 품목 등록</button>
            </div>
        </div>
        <div className="cat-filter">
            <div className={`cat-tab ${!activeCat?'active':''}`} onClick={()=>setActiveCat(null)}>전체 <span className="cnt">{items.length}</span></div>
            {outCats.map(c=><div key={c.id} className={`cat-tab ${activeCat===c.id?'active':''}`} onClick={()=>setActiveCat(c.id)}>{c.name} <span className="cnt">{items.filter(m=>m.category_id===c.id).length}</span></div>)}
        </div>
        <div style={{marginBottom:14}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 품목명 · 규격 · 업체 검색..."
                style={{width:'100%',padding:'9px 14px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:13,fontFamily:'Noto Sans KR,sans-serif',outline:'none'}}
                onFocus={e=>e.target.style.borderColor='var(--blue)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
        </div>
        <div className="list-body">
        {filtered.length===0?<div className="empty-state"><div className="empty-icon">🛠</div><div className="empty-text">{search?'검색 결과가 없습니다.':'등록된 외주 품목이 없습니다.'}</div></div>
        :<div className="table-wrap"><table style={{minWidth:820}}>
            <thead><tr>
                <th style={{width:50}}>사진</th>
                <th style={{textAlign:'left'}}>품목명</th>
                <th style={{textAlign:'left'}}>분류</th>
                <th style={{textAlign:'left'}}>규격/작업내용</th>
                <th className="tr">단가(원)</th>
                <th style={{textAlign:'left'}}>외주업체</th>
                <th style={{textAlign:'left'}}>기타구분</th>
                <th style={{textAlign:'center',width:70}}>링크</th>
                <th style={{textAlign:'center',width:70}}>견적서</th>
                <th style={{textAlign:'center',width:70}}>관리</th>
            </tr></thead>
            <tbody>{filtered.map(m=>(
                <tr key={m.id}>
                    <td style={{textAlign:'center'}}>{m.image_url?<img src={m.image_url} style={{width:36,height:36,objectFit:'cover',borderRadius:5,border:'1px solid var(--border)'}} alt=""/>:<span style={{fontSize:18}}>🛠</span>}</td>
                    <td style={{fontWeight:700}}>{m.name}</td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>{catName(m.category_id)}</td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>{m.specification||'-'}</td>
                    <td className="tr" style={{fontWeight:700}}>{fmt(m.unit_price||0)}</td>
                    <td style={{fontSize:12}}>{m.supplier||'-'}</td>
                    <td style={{fontSize:12,color:'var(--muted)'}}>{m.category_extra||'-'}</td>
                    <td style={{textAlign:'center'}}>
                        {m.purchase_link?<a href={m.purchase_link} target="_blank" rel="noreferrer">
                            <button className="btn btn-outline btn-xs" style={{whiteSpace:'nowrap'}}>🔗 열기</button>
                        </a>:<span style={{fontSize:11,color:'var(--muted)'}}>-</span>}
                    </td>
                    <td style={{textAlign:'center'}}>
                        {m.quote_file_url?<a href={m.quote_file_url} target="_blank" rel="noreferrer" title={m.quote_file_name||'견적서'}>
                            <button className="btn btn-outline btn-xs" style={{whiteSpace:'nowrap'}}>📄 보기</button>
                        </a>:<span style={{fontSize:11,color:'var(--muted)'}}>-</span>}
                    </td>
                    <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                        <button className="btn-icon" onClick={()=>{setEditing(m);setShowModal(true);}}>✏️</button>
                        <button className="btn-icon" onClick={()=>del(m.id)}>🗑</button>
                    </td>
                </tr>
            ))}</tbody>
        </table></div>}
        </div>
    </div>);
}

function ProductModal({sb,matCats,prodCats,toolCats,initial,onClose,onSave}){
    const blank={category_id:'',name:'',description:'',price:0,image_url:''};
    const[form,setForm]=useState(initial?{...initial}:blank);
    const[mats,setMats]=useState([]);
    const[prep,setPrep]=useState(()=>parseJSON(initial?.prep_items,[]).map(x=>({id:x.id||uid(),type:x.type||'tool',tool_id:x.tool_id||'',name:x.name||'',qty:x.qty||1})));
    const[allTools,setAllTools]=useState([]); // 공구/부자재 관리 목록
    const[pfIds,setPfIds]=useState(()=>parseJSON(initial?.portfolio_ids,[])); // 연결된 포트폴리오 ID
    const[allPf,setAllPf]=useState([]);
    const[showPfPick,setShowPfPick]=useState(false);
    const updPrep=(id,k,v)=>setPrep(p=>p.map(x=>x.id===id?{...x,[k]:v}:x));
    const updPrepBatch=(id,obj)=>setPrep(p=>p.map(x=>x.id===id?{...x,...obj}:x));
    const[allMaterials,setAllMaterials]=useState([]); // category_id 포함
    const set=(k,v)=>setForm(p=>({...p,[k]:v}));

    useEffect(()=>{
        if(!sb)return;
        // ★ 순서 보장: 자재목록 먼저 로드 후 상품자재 로드 (분류 매칭)
        (async()=>{
            const{data:allMatsData}=await sb.from('materials')
                .select('id,name,specification,unit_price,category_id').order('name');
            if(allMatsData) setAllMaterials(allMatsData);
            const{data:toolsData}=await sb.from('tools').select('id,name,specification,category_id').order('name');
            if(toolsData) setAllTools(toolsData);
            const{data:pfData}=await sb.from('portfolios').select('id,title,image_url,categories');
            if(pfData) setAllPf(pfData);

            if(!initial?.id) return;
            const{data:pmData}=await sb.from('product_materials')
                .select('*').eq('product_id',initial.id);
            if(pmData){
                setMats(pmData.map(m=>{
                    // material_id로 자재 분류 복원
                    const found=(allMatsData||[]).find(x=>x.id===m.material_id);
                    return{
                        _catId:matTopId(matCats,found?.category_id)||'', // 자재분류 칸은 상위분류
                        material_id:m.material_id||'',
                        material_name:m.material_name||'',
                        unit_price:Number(found?.unit_price??m.unit_price)||0,
                        quantity:Number(m.quantity)||1,
                        total:(Number(found?.unit_price??m.unit_price)||0)*(Number(m.quantity)||1),
                    };
                }));
            }
        })();
    },[sb,initial?.id]);

    const addMat=()=>setMats(p=>[...p,{_catId:'',material_id:'',material_name:'',unit_price:0,quantity:1,total:0}]);
    const updMat=(i,k,v)=>setMats(p=>p.map((m,j)=>{if(j!==i)return m;const nm=k==='__batch__'?{...m,...v}:{...m,[k]:v};nm.total=(Number(nm.unit_price)||0)*(Number(nm.quantity)||1);return nm;}));
    const delMat=i=>setMats(p=>p.filter((_,j)=>j!==i));
    const matTotal=mats.filter(m=>m.material_id||m.material_name).reduce((s,m)=>s+(Number(m.unit_price)||0)*(Number(m.quantity)||1),0);
    const matCount=mats.filter(m=>m.material_id||m.material_name).length;

    // ★ 저장 시 DB 전용 필드만 추출 (id, product_id 제외)
    const ok=()=>{
        if(!form.name.trim()){alert('상품명을 입력하세요');return;}
        const cleanMats=mats.filter(m=>m.material_name).map(m=>({
            material_id:m.material_id||null,
            material_name:m.material_name||'',
            unit_price:Number(m.unit_price)||0,
            unit:'개',
            quantity:Number(m.quantity)||1,
            total:(Number(m.unit_price)||0)*(Number(m.quantity)||1),
        }));
        const cleanPrep=prep.filter(x=>(x.name||'').trim()).map(x=>({type:x.type,tool_id:x.tool_id||null,name:x.name.trim(),qty:Number(x.qty)||1}));
        const cleanPf=allPf.length>0?pfIds.filter(id=>allPf.some(p=>p.id===id)):pfIds;
        onSave({form:{...form,prep_items:JSON.stringify(cleanPrep),portfolio_ids:JSON.stringify(cleanPf)},mats:cleanMats});
    };

    return(<div className="modal-overlay" onClick={onClose}>
        <div className="modal-box lg" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><div className="modal-title">{initial?'상품 수정':'새 상품 등록'}</div><button className="modal-close" onClick={onClose}>✕</button></div>
            <div className="mf"><label className="ml">사진</label><ImgUpload sb={sb} folder="products" value={form.image_url} onChange={v=>set('image_url',v)}/></div>
            <div className="modal-grid">
                <div className="mf"><label className="ml">카테고리 *</label><select className="mi" value={form.category_id} onChange={e=>set('category_id',e.target.value)}><option value="">선택</option>{prodCats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                <div className="mf"><label className="ml">상품명 *</label><input className="mi" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="상품명 입력"/></div>
                <div className="mf"><label className="ml">설명</label><input className="mi" value={form.description||''} onChange={e=>set('description',e.target.value)} placeholder="상품 설명"/></div>
                <div className="mf"><label className="ml">판매가(원)</label><input className="mi" type="number" value={form.price} onChange={e=>set('price',Number(e.target.value))} min="0"/></div>
                <div className="mf col2"><label className="ml">자재 합계(원) · {matCount}종</label>
                    <div style={{padding:'10px 14px',border:'1.5px solid var(--border)',borderRadius:8,background:'var(--bg)',fontSize:15,fontWeight:800,color:'var(--purple)',textAlign:'right'}}>{fmt(matTotal)}원</div>
                </div>
            </div>
            <div style={{marginTop:14,overflowX:'auto'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                    <span style={{fontSize:11,fontWeight:700,color:'var(--muted)',letterSpacing:1,textTransform:'uppercase'}}>필요 자재</span>
                    <button className="btn btn-outline btn-sm" onClick={addMat}>＋ 자재 추가</button>
                </div>
                {/* 컬럼 헤더 */}
                {mats.length>0&&<div style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) minmax(0,1.4fr) 64px 84px 96px 32px',minWidth:600,gap:6,marginBottom:4}}>
                    <span style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1}}>자재 분류</span>
                    <span style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1}}>자재 품명</span>
                    <span style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1,textAlign:'center'}}>수량</span>
                    <span style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1,textAlign:'right'}}>단가</span>
                    <span style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1,textAlign:'right'}}>금액</span>
                    <span></span>
                </div>}
                {mats.map((m,i)=>(
                    <div key={i} style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) minmax(0,1.4fr) 64px 84px 96px 32px',minWidth:600,gap:6,marginBottom:6,alignItems:'center'}}>
                        {/* 1. 자재 분류 선택 */}
                        <select className="mi" style={{fontSize:12}} value={m._catId||''}
                            onChange={e=>updMat(i,'_catId',e.target.value)}>
                            <option value="">── 분류 선택 ──</option>
                            {topMatCats(matCats).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                        </select>
                        {/* 2. 자재 품명 (분류 선택 후 필터링 / 기존값 표시) */}
                        <select className="mi" style={{fontSize:12}} value={m.material_id||''}
                            onChange={e=>{
                                const mat=allMaterials.find(x=>x.id===e.target.value);
                                if(mat)updMat(i,'__batch__',{_catId:matTopId(matCats,mat.category_id)||'',material_id:mat.id,material_name:mat.name,unit_price:mat.unit_price||0});
                                else updMat(i,'material_id','');
                            }}>
                            <option value="">{m._catId?'── 품명 선택 ──':'← 분류 먼저 선택'}</option>
                            {/* 저장된 값이 현재 목록에 없을 때도 표시 */}
                            {m.material_id&&!allMaterials.filter(x=>matTopId(matCats,x.category_id)===m._catId).find(x=>x.id===m.material_id)&&
                                <option value={m.material_id}>{m.material_name} (저장됨)</option>}
                            {allMaterials.filter(mat=>!m._catId||matTopId(matCats,mat.category_id)===m._catId).map(mat=>(
                                <option key={mat.id} value={mat.id}>{(matCats.find(c=>c.id===mat.category_id&&c.parent_id)||{name:''}).name?'['+matCats.find(c=>c.id===mat.category_id).name+'] ':''}{mat.name}{mat.specification?' ('+mat.specification+')':''}</option>
                            ))}
                        </select>
                        {/* 3. 수량 */}
                        <DecimalInput className="mi" value={m.quantity||1} style={{fontSize:12,textAlign:'right'}} onCommit={v=>updMat(i,'quantity',v)}/>
                        <div style={{fontSize:12,textAlign:'right',color:'var(--muted)'}}>{fmt(m.unit_price||0)}</div>
                        <div style={{fontSize:13,textAlign:'right',fontWeight:700,color:'var(--navy)'}}>{fmt((Number(m.unit_price)||0)*(Number(m.quantity)||1))}</div>
                        <button className="btn-icon" onClick={()=>delMat(i)}>🗑</button>
                    </div>
                ))}
                {mats.length===0&&<p style={{fontSize:12,color:'var(--muted)',margin:'8px 0'}}>자재 추가 버튼으로 필요 자재를 등록하세요.</p>}
            </div>
            {/* 공구 / 부자재 (시공 체크리스트용) — 필요 자재와 같은 방식: 분류 → 품명 → 수량 */}
            {[['tool','🔧 공구'],['supply','📎 부자재']].map(([type,label])=>{
                const rows=prep.filter(x=>x.type===type);
                const GRID={display:'grid',gridTemplateColumns:'minmax(0,1fr) minmax(0,1.4fr) 64px 32px',gap:6,minWidth:480};
                return(<div key={type} style={{marginTop:18,overflowX:'auto'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                        <span style={{fontSize:11,fontWeight:700,color:'var(--muted)',letterSpacing:1,textTransform:'uppercase'}}>{label} <span style={{fontWeight:400,textTransform:'none'}}>(시공 체크리스트)</span></span>
                        <button className="btn btn-outline btn-sm" onClick={()=>setPrep(p=>[...p,{id:uid(),type,tool_id:'',name:'',qty:1}])}>＋ {type==='tool'?'공구':'부자재'} 추가</button>
                    </div>
                    {rows.length>0&&<div style={{...GRID,marginBottom:4}}>
                        <span style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1}}>분류</span>
                        <span style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1}}>품명</span>
                        <span style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1,textAlign:'center'}}>수량</span>
                        <span></span>
                    </div>}
                    {rows.length===0&&<p style={{fontSize:12,color:'var(--muted)',margin:'4px 0'}}>추가 버튼으로 {label}를 등록하세요. (공구/부자재 관리에 등록된 항목에서 선택)</p>}
                    {rows.map(x=>{
                        const catId=x._catId!==undefined?x._catId:(allTools.find(t=>t.id===x.tool_id)?.category_id||'');
                        const legacy=!x.tool_id&&x.name;
                        return(<div key={x.id} style={{...GRID,marginBottom:6,alignItems:'center'}}>
                            <select className="mi" style={{fontSize:12}} value={catId||''} onChange={e=>updPrep(x.id,'_catId',e.target.value)}>
                                <option value="">── 분류 선택 ──</option>
                                {toolCats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                            <select className="mi" style={{fontSize:12}} value={x.tool_id||(legacy?'__legacy__':'')}
                                onChange={e=>{
                                    const v=e.target.value;
                                    if(v==='__legacy__')return;
                                    const t=allTools.find(y=>y.id===v);
                                    if(t)updPrepBatch(x.id,{_catId:t.category_id||'',tool_id:t.id,name:t.name});
                                    else updPrepBatch(x.id,{tool_id:'',name:''});
                                }}>
                                <option value="">{catId?'── 품명 선택 ──':'← 분류 먼저 선택'}</option>
                                {legacy&&<option value="__legacy__">{x.name} (저장됨)</option>}
                                {allTools.filter(t=>!catId||t.category_id===catId).map(t=>(

                                ))}
                            </select>
                            <input className="mi" type="number" min="1" style={{fontSize:12,textAlign:'right'}} value={x.qty} onChange={e=>updPrep(x.id,'qty',e.target.value)}/>
                            <button className="btn-icon" onClick={()=>setPrep(p=>p.filter(y=>y.id!==x.id))}>🗑</button>
                        </div>);
                    })}
                </div>);
            })}
            {/* 포트폴리오 연결: 이 상품의 분류와 같은 분류로 등록된 포트폴리오에서 선택 */}
            <div style={{marginTop:18}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                    <span style={{fontSize:11,fontWeight:700,color:'var(--muted)',letterSpacing:1,textTransform:'uppercase'}}>🖼 포트폴리오 <span style={{fontWeight:400,textTransform:'none'}}>(견적서에 링크/QR로 표시)</span></span>
                    <button className="btn btn-outline btn-sm" onClick={()=>setShowPfPick(true)}>＋ 포트폴리오 추가</button>
                </div>
                {pfIds.filter(id=>allPf.some(p=>p.id===id)).length===0
                    ?<p style={{fontSize:12,color:'var(--muted)',margin:'4px 0'}}>연결된 포트폴리오가 없습니다.</p>
                    :<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                        {pfIds.map(id=>allPf.find(p=>p.id===id)).filter(Boolean).map(p=>(
                            <div key={p.id} style={{position:'relative',width:92,border:'1.5px solid var(--border)',borderRadius:8,overflow:'hidden',background:'#fff'}}>
                                {p.image_url?<img src={p.image_url} alt="" style={{width:'100%',height:64,objectFit:'cover',display:'block'}}/>:<div style={{height:64,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,background:'var(--bg)'}}>🖼</div>}
                                <div style={{fontSize:10,padding:'3px 5px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.title}</div>
                                <button onClick={()=>setPfIds(x=>x.filter(i=>i!==p.id))} style={{position:'absolute',top:2,right:2,width:18,height:18,border:'none',borderRadius:'50%',background:'rgba(0,0,0,.55)',color:'#fff',fontSize:10,cursor:'pointer',lineHeight:1}}>✕</button>
                            </div>
                        ))}
                    </div>}
            </div>
            {showPfPick&&<PfPicker all={allPf} categoryId={form.category_id} catName={(prodCats.find(c=>c.id===form.category_id)||{}).name||''} selected={pfIds} onClose={()=>setShowPfPick(false)} onConfirm={ids=>{setPfIds(ids);setShowPfPick(false);}}/>}
            <div className="modal-btns"><button className="modal-cancel" onClick={onClose}>취소</button><button className="modal-ok" onClick={ok}>저장</button></div>
        </div>
    </div>);
}

function ProductList({sb,matCats,prodCats,toolCats,onAddProdCat,initialCatId}){
    const[products,setProducts]=useState([]);const[loading,setLoading]=useState(true);
    const[activeCat,setActiveCat]=useState(initialCatId||null);
    useEffect(()=>{setActiveCat(initialCatId||null);},[initialCatId]); // 사이드바 분류 클릭 시 목록 갱신
    const[showModal,setShowModal]=useState(false);const[editing,setEditing]=useState(null);
    const[search,setSearch]=useState('');
    const[matTotals,setMatTotals]=useState({}); // 상품별 자재합계
    const loadMatTotals=async()=>{
        if(!sb)return;
        const[{data:pm},{data:ms}]=await Promise.all([
            sb.from('product_materials').select('product_id,material_id,unit_price,quantity'),
            sb.from('materials').select('id,unit_price')
        ]);
        const priceMap={};(ms||[]).forEach(x=>{priceMap[x.id]=Number(x.unit_price)||0;});
        const t={};
        (pm||[]).forEach(r=>{
            const p=(r.material_id&&priceMap[r.material_id]!==undefined)?priceMap[r.material_id]:(Number(r.unit_price)||0);
            t[r.product_id]=(t[r.product_id]||0)+p*(Number(r.quantity)||1);
        });
        setMatTotals(t);
    };

    useEffect(()=>{
        if(!sb)return;
        loadMatTotals();
        sb.from('products').select('*').order('name',{ascending:true}).then(({data})=>{if(data)setProducts(data);setLoading(false);});
    },[sb]);

    const save=async({form,mats})=>{
        setShowModal(false);setEditing(null);
        // ★ 안전한 자재 데이터 (id/product_id 제외, DB필드만)
        const cleanRow=(m,pid)=>({
            product_id:pid,
            material_id:m.material_id||null,
            material_name:m.material_name||'',
            unit_price:Number(m.unit_price)||0,
            unit:'개',
            quantity:Number(m.quantity)||1,
            total:(Number(m.unit_price)||0)*(Number(m.quantity)||1),
        });
        if(editing){
            const{data,error:e1}=await prepSafe(f=>sb.from('products').update(f).eq('id',editing.id).select(),form);
            if(e1){toast('오류: '+e1.message);return;}
            if(data){
                await sb.from('product_materials').delete().eq('product_id',editing.id);
                const validMats=mats.filter(m=>m.material_name);
                if(validMats.length>0){
                    const{error:e2}=await sb.from('product_materials').insert(validMats.map(m=>cleanRow(m,editing.id)));
                    if(e2){alert('자재 저장 오류: '+e2.message+'\n\nSupabase SQL Editor에서 아래를 실행하세요:\nALTER TABLE product_materials ENABLE ROW LEVEL SECURITY;\nDROP POLICY IF EXISTS staff_all ON product_materials;\nCREATE POLICY staff_all ON product_materials FOR ALL TO authenticated USING (public.is_staff()) WITH CHECK (public.is_staff());');return;}
                }
                setProducts(p=>p.map(x=>x.id===editing.id?data[0]:x));
            }
            loadMatTotals();toast('수정됨 (자재 '+mats.length+'종)');
        }else{
            const{data,error:e1}=await prepSafe(f=>sb.from('products').insert([f]).select(),form);
            if(e1){toast('오류: '+e1.message);return;}
            if(data){
                const pid=data[0].id;
                const validMats=mats.filter(m=>m.material_name);
                if(validMats.length>0){
                    const{error:e2}=await sb.from('product_materials').insert(validMats.map(m=>cleanRow(m,pid)));
                    if(e2){alert('자재 저장 오류: '+e2.message+'\n\nSupabase SQL Editor에서 아래를 실행하세요:\nALTER TABLE product_materials ENABLE ROW LEVEL SECURITY;\nDROP POLICY IF EXISTS staff_all ON product_materials;\nCREATE POLICY staff_all ON product_materials FOR ALL TO authenticated USING (public.is_staff()) WITH CHECK (public.is_staff());');return;}
                }
                setProducts(p=>[...p,data[0]]);
            }
            loadMatTotals();toast('등록됨 (자재 '+mats.length+'종)');
        }
    };
    const del=async id=>{
        if(!confirm('삭제?'))return;
        await sb.from('product_materials').delete().eq('product_id',id);
        await sb.from('products').delete().eq('id',id);
        setProducts(p=>p.filter(x=>x.id!==id));toast('🗑 삭제됨');
    };

    const catName=id=>prodCats.find(c=>c.id===id)?.name||'미분류';
    const filtered=products
        .filter(p=>!activeCat||p.category_id===activeCat)
        .filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())||
            (p.description||'').toLowerCase().includes(search.toLowerCase()));

    if(loading)return<div className="loading-wrap"><div className="loading-spinner"/></div>;
    return(<div>
        {showModal&&<ProductModal sb={sb} matCats={matCats} prodCats={prodCats} toolCats={toolCats||[]} initial={editing} onClose={()=>{setShowModal(false);setEditing(null);}} onSave={save}/>}
        <div className="page-header">
            <div className="page-title-wrap"><h1>🛍 상품 관리</h1><p>카테고리별 상품 등록 · 필요 자재 연동</p></div>
            <div className="btn-row">
                <button className="btn btn-outline" onClick={onAddProdCat}>＋ 카테고리 추가</button>
                <button className="btn btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>＋ 상품 등록</button>
            </div>
        </div>
        <div className="cat-filter">
            <div className={`cat-tab ${!activeCat?'active':''}`} onClick={()=>setActiveCat(null)}>전체 <span className="cnt">{products.length}</span></div>
            {prodCats.map(c=><div key={c.id} className={`cat-tab ${activeCat===c.id?'active':''}`} onClick={()=>setActiveCat(c.id)}>{c.name} <span className="cnt">{products.filter(p=>p.category_id===c.id).length}</span></div>)}
        </div>
        {/* 검색 */}
        <div style={{marginBottom:14}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 상품명 · 설명 검색..."
                style={{width:'100%',padding:'9px 14px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:13,fontFamily:'Noto Sans KR,sans-serif',outline:'none'}}
                onFocus={e=>e.target.style.borderColor='var(--blue)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
        </div>
        {filtered.length===0?<div className="empty-state"><div className="empty-icon">🛍</div><div className="empty-text">{search?'검색 결과가 없습니다.':'상품이 없습니다.'}</div></div>
        :<div className="prod-grid">
            {filtered.map(prod=>(
                <div key={prod.id} className="prod-card">
                    {prod.image_url?<img src={prod.image_url} className="prod-card-img" alt=""/>:<div className="prod-card-img" style={{background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:32,color:'#94a3b8'}}>🛍</div>}
                    <div className="prod-card-body">
                        <div className="prod-card-cat">{catName(prod.category_id)}</div>
                        <div className="prod-card-name">{prod.name}</div>
                        {prod.description&&<div className="prod-card-desc">{prod.description}</div>}
                        {prod.price>0&&<div className="prod-card-price">{fmt(prod.price)}원</div>}
                        <div style={{fontSize:11,color:'var(--purple)',fontWeight:700,marginTop:3}}>자재합계 {fmt(matTotals[prod.id]||0)}원</div>
                        <div className="prod-card-actions">
                            <button className="btn btn-outline btn-sm" onClick={()=>{setEditing(prod);setShowModal(true);}}>✏️ 수정</button>
                            <button className="btn btn-sm" style={{background:'#fee2e2',color:'var(--red)',border:'none'}} onClick={()=>del(prod.id)}>🗑</button>
                        </div>
                    </div>
                </div>
            ))}
        </div>}
    </div>);
}

function ProductPickModal({sb,prodCats,cats,onAddProduct,onClose}){
    const[products,setProducts]=useState([]);const[activeCat,setActiveCat]=useState(null);
    const[picked,setPicked]=useState([]);const[loading,setLoading]=useState(true);

    useEffect(()=>{
        if(!sb)return;
        sb.from('products').select('*').order('name',{ascending:true}).then(({data})=>{if(data)setProducts(data);setLoading(false);});
    },[sb]);

    const toggle=prod=>setPicked(p=>p.find(x=>x.id===prod.id)?p.filter(x=>x.id!==prod.id):[...p,prod]);
    const filtered=activeCat?products.filter(p=>p.category_id===activeCat):products;

    const confirm=()=>{
        if(picked.length===0){toast('상품을 선택하세요');return;}
        // 각 선택된 상품을 순서대로 추가
        picked.forEach(prod=>{
            const catName=prodCats.find(c=>c.id===prod.category_id)?.name||'상품';
            onAddProduct(prod,catName,null);
        });
        onClose();
        toast('✅ '+picked.length+'개 상품 추가됨');
    };

    return(<div className="modal-overlay" onClick={onClose}>
        <div className="modal-box lg" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><div className="modal-title">🛍 상품 선택</div><button className="modal-close" onClick={onClose}>✕</button></div>
            {loading?<div style={{textAlign:'center',padding:40}}>로딩 중...</div>
            :<>
                <div className="cat-filter" style={{marginBottom:12}}>
                    <div className={`cat-tab ${!activeCat?'active':''}`} onClick={()=>setActiveCat(null)}>전체 <span className="cnt">{products.length}</span></div>
                    {prodCats.map(c=><div key={c.id} className={`cat-tab ${activeCat===c.id?'active':''}`} onClick={()=>setActiveCat(c.id)}>{c.name}</div>)}
                </div>
                <div className="pick-prod-grid" style={{maxHeight:'50vh',overflowY:'auto'}}>
                    {filtered.map(prod=>(
                        <div key={prod.id} className={`pick-prod-card ${picked.find(x=>x.id===prod.id)?'selected':''}`} onClick={()=>toggle(prod)}>
                            {prod.image_url?<img src={prod.image_url} className="pick-prod-img" alt=""/>:<div className="pick-prod-img" style={{background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,color:'#94a3b8'}}>🛍</div>}
                            <div className="pick-prod-info">
                                {picked.find(x=>x.id===prod.id)&&<span style={{color:'var(--green)',marginRight:4}}>✅</span>}
                                <span style={{fontWeight:700}}>{prod.name}</span>
                                {prod.price>0&&<span style={{fontSize:11,color:'var(--muted)'}}> {fmt(prod.price)}원</span>}
                            </div>
                        </div>
                    ))}
                </div>
            </>}
            <div className="modal-btns"><button className="modal-cancel" onClick={onClose}>취소</button><button className="modal-ok" onClick={confirm}>{picked.length}개 상품 추가</button></div>
        </div>
    </div>);
}

/* ═══════════════════════════════════════
   ★ 소요자재 카드 (상품별 + 합산)

function SoyoJaeCard({sb, estMaterials, setEstMaterials, uid, items, cats}){
    const[showAdd,setShowAdd]=useState(false);
    const[nm,setNm]=useState({name:'',qty:1,price:0});
    // 상품별 그룹 (itemName 있는 것)
    const byItem = {};
    estMaterials.forEach(m => {
        if(!m.itemName) return;
        if(!byItem[m.itemName]) byItem[m.itemName] = [];
        byItem[m.itemName].push(m);
    });
    const itemGroups = Object.entries(byItem);

    // 합산 (material_id 또는 name 기준)
    const sumMap = {};
    estMaterials.forEach(m => {
        const key = m.material_id || m.name;
        if(!key) return;
        if(!sumMap[key]) sumMap[key] = {id:m.id, name:m.name, material_id:m.material_id, unit_price:m.unit_price||0, qty:0, amount:0, rows:[]};
        sumMap[key].rows.push(m);
        sumMap[key].qty = Math.round((sumMap[key].qty + (Number(m.qty) || 0)) * 10) / 10;
        sumMap[key].amount += (Number(m.unit_price)||0) * (Number(m.qty)||0);
    });
    const sumList = Object.values(sumMap).filter(m => m.qty > 0).map(m => ({...m, prods:collectProds(m.rows, items, cats)}));
    const matGrandTotal = sumList.reduce((s, m) => s + m.amount, 0);

    const removeByKey = key => setEstMaterials(p => p.filter(x => (x.material_id || x.name) !== key));
    const addManual = () => {
        const name = nm.name.trim();
        if(!name){ alert('자재명을 입력하세요'); return; }
        setEstMaterials(p => [...p, {id:uid(), name, qty:Number(nm.qty)||1, unit_price:Number(nm.price)||0, material_id:null}]);
        setNm({name:'',qty:1,price:0});
        setShowAdd(false);
    };
    // 자재 단가 수정 (같은 자재 전체 행에 적용, 견적서에만 반영되고 자재관리 단가는 변하지 않음)
    // 입력한 단가를 자재관리(마스터)의 자재 단가로 반영
    const pushPrice = async (m) => {
        const price = m.qty > 0 ? Math.round(m.amount / m.qty) : 0;
        if(!window.confirm('['+m.name+'] 자재관리의 단가를 '+price.toLocaleString('ko-KR')+'원으로 수정하시겠습니까?\n(이미 저장된 다른 견적서의 단가는 변하지 않습니다)')) return;
        const{error}=await sb.from('materials').update({unit_price:price}).eq('id',m.material_id);
        if(error){ alert('수정 실패: '+error.message); return; }
        toast('✅ 자재관리 단가가 '+price.toLocaleString('ko-KR')+'원으로 수정되었습니다');
    };
    const updateSumPrice = (key, price) => setEstMaterials(prev => prev.map(x => (x.material_id || x.name) === key ? {...x, unit_price:price} : x));

    // ★ 합산수량 직접 편집: 행(상품 정보)은 유지한 채 마지막 행에서 증감분을 흡수
    const updateSumQty = (key, newQty) => {
        setEstMaterials(prev => {
            const idxs = prev.map((x, i) => (x.material_id || x.name) === key ? i : -1).filter(i => i >= 0);
            if(!idxs.length) return prev;
            let remaining = newQty;
            const next = prev.slice();
            idxs.forEach((idx, n) => {
                const orig = Number(prev[idx].qty) || 0;
                const q = n === idxs.length - 1 ? remaining : Math.min(orig, remaining);
                remaining = Math.round((remaining - q) * 10) / 10;
                // 직접 고친 수량도 품목 수량 연동이 유지되도록 1개 기준 수량(baseQty)을 다시 계산
                const iq = parseFloat((items||[]).find(it => it.id === prev[idx].itemId)?.qty) || 1;
                next[idx] = {...prev[idx], qty:q, baseQty:Math.round(q / iq * 1000) / 1000};
            });
            return next.filter(x => !((x.material_id || x.name) === key && !(Number(x.qty) > 0)));
        });
    };

    return(
        <div className="card">
            <div className="card-title">🔧 소요 자재
                <span style={{fontSize:11,color:'var(--muted)',fontWeight:400,marginLeft:6}}>(고객 인쇄 미포함 · 설치완료 시 재고 차감 · 단가는 상품을 담은 시점 기준으로 고정)</span>
            </div>

            {/* ① 상품별 필요자재 - itemName 있을 때만 표시 */}
            {itemGroups.length > 0 && (
                <div style={{marginBottom:14}}>
                    <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1.5,textTransform:'uppercase',marginBottom:10}}>상품별 필요자재</div>
                    {itemGroups.map(([itemName, mats]) => (
                        <div key={itemName} style={{marginBottom:10}}>
                            <div style={{fontSize:12,fontWeight:800,color:'var(--navy)',marginBottom:5,display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                                <span>📦 {itemName}</span>
                                <span style={{fontSize:11,color:'var(--purple)'}}>자재합계 {fmt(mats.reduce((s,m)=>s+(Number(m.unit_price)||0)*(Number(m.qty)||0),0))}원</span>
                            </div>
                        </div>
                    ))}
                    <div style={{borderTop:'1.5px dashed var(--border)',margin:'4px 0 12px'}}/>
                </div>
            )}

            {/* ② 합산 소요자재 */}
            <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',letterSpacing:1.5,textTransform:'uppercase',marginBottom:8}}>
                {itemGroups.length > 0 ? '합산 소요자재' : '소요자재'}
            </div>
            {sumList.length === 0
                ? <p style={{fontSize:12,color:'var(--muted)',marginBottom:10}}>상품 추가 시 자재가 자동으로 포함됩니다.</p>
                : <div className="table-wrap" style={{marginBottom:10}}>
                    <table style={{minWidth:820}}>
                        <thead>
                            <tr>
                                <th style={{textAlign:'left'}}>자재명</th>
                                <th style={{textAlign:'left'}}>상품분류</th>
                                <th style={{textAlign:'left'}}>상품명</th>
                                <th className="tr" style={{width:100}}>합산수량</th>
                                <th className="tr" style={{width:90}}>단가(원)</th>
                                <th className="tc" style={{width:100}}>자재단가 수정</th>
                                <th className="tr" style={{width:110}}>금액(원)</th>
                                <th style={{width:36}}></th>
                            </tr>
                        </thead>
                        <tbody>
                            {sumList.map((m, i) => (
                                <tr key={i}>
                                    <td style={{fontWeight:700}}>
                                        {m.material_id
                                            ? <a href={window.location.origin+window.location.pathname+'?mat='+m.material_id} target="_blank" rel="noreferrer"
                                                title="자재 수정 페이지 열기 (새 탭)" style={{color:'var(--blue)',textDecoration:'none'}}>{m.name} <span style={{fontSize:11}}>↗</span></a>
